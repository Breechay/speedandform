<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RPD Creative B · FORM</title>
<style>
:root{--bg:#071012;--ink:#f4f6f2;--muted:#a8b4b6;--lime:#c9ff36;--line:#293b3e}
*{box-sizing:border-box}
html,body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.board{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--bg);color:var(--ink);padding:72px 72px 62px;display:flex;flex-direction:column}
.brand{font-size:25px;font-weight:800;letter-spacing:-.06em;margin-bottom:68px}.brand i{font-style:normal;color:var(--lime)}
.eyebrow{font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:650;margin:0 0 18px}
h1{font-size:100px;line-height:.9;letter-spacing:-.07em;font-weight:650;max-width:830px;margin:0 0 26px}
.sub{font-size:31px;line-height:1.24;letter-spacing:-.025em;margin:0;color:var(--muted)}
.preview{position:relative;margin-top:54px;height:514px;border:1px solid var(--line);overflow:hidden;background:#ece6da}
.preview iframe{position:absolute;width:1600px;height:930px;border:0;left:0;top:0;transform:scale(.585);transform-origin:0 0;pointer-events:none;background:#ece6da}
.preview::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);pointer-events:none}
.bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:30px;display:grid;grid-template-columns:1fr auto;gap:34px;align-items:end}
.product{font-size:29px;line-height:1.15;font-weight:650;letter-spacing:-.035em}.product small{display:block;margin-top:10px;color:var(--muted);font-size:17px;line-height:1.4;font-weight:500;letter-spacing:0}
.offer{text-align:right}.offer strong{display:block;color:var(--lime);font-size:23px;letter-spacing:-.02em}.offer span{display:block;color:var(--muted);font-size:16px;margin-top:5px}
@media(max-width:1120px){body{padding:0}.board{transform-origin:top left}}
</style>
</head>
<body>
<main class="board" aria-label="Race Pace Durability ad creative board">
  <div class="brand">FORM<i>.</i></div>
  <p class="eyebrow">Half marathon · 15 weeks</p>
  <h1>See the first<br>four weeks.</h1>
  <p class="sub">Run them before you decide.</p>
  <div class="preview" aria-label="Race Pace Durability plan preview">
    <iframe src="/plans/race-pace-durability/#plan" title="Weeks 1 through 4 of Race Pace Durability" tabindex="-1"></iframe>
  </div>
  <div class="bottom">
    <div class="product">Race Pace Durability<small>A complete half-marathon plan for runners already training consistently.</small></div>
    <div class="offer"><strong>Weeks 1–4 free</strong><span>Full plan · one-time payment of $79</span></div>
  </div>
</main>
</body>
</html>
