<main><h1>Thursday at the track.</h1><p id="note">Finding Thursday's session…</p></main>
<script>
(function () {
  'use strict';
  // Someone with FORM never lands here: the link opens the app. Everyone else goes straight to Thursday's session page.
  var SUPA = 'https://pbgsjjegycacodiltbhn.supabase.co';
  var KEY = 'sb_publishable_5Dg5TUvnh2mEo-zCYAbgmw_WHNXKDqj';
  function go(path) { window.location.replace(path); }
  var done = false;
  setTimeout(function () { if (!done) { done = true; go('/workout/'); } }, 6000);
  fetch(SUPA + '/rest/v1/rpc/form_thursday_tonight', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: '{}', cache: 'no-store', credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error('unavailable'); return r.json(); })
    .then(function (t) {
      if (done) return; done = true;
      var id = t && t.session_id;
      go(id && /^[a-z0-9-]+$/.test(id) ? '/workout/' + id + '/' : '/workout/');
    })
    .catch(function () { if (!done) { done = true; go('/workout/'); } });
})();
</script>
