<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#080b0c">
  <title>My training · FORM</title>
  <link rel="stylesheet" href="/private/graphite.css?v=33">
  <link rel="stylesheet" href="/athlete/workspace.css?v=1">
</head>
<body>
  <a class="skip-link" href="#app">Skip to your training</a>
  <div class="app-shell">
    <header class="topbar athlete-topbar">
      <a class="brand" href="/" aria-label="FORM home"><span class="form-mark">FORM</span><span class="product-name">My training</span></a>
      <div class="topbar-tools">
        <span class="user-email" id="userEmail"></span>
        <details class="record-nav" id="recordNav" hidden>
          <summary aria-label="Training sections"><span class="nav-bars" aria-hidden="true"></span></summary>
          <nav class="record-nav-panel">
            <a href="#today" data-nav-view="today">Today</a>
            <a href="#plan" data-nav-view="plan">Plan</a>
            <a href="#history" data-nav-view="history">History</a>
            <a href="#account" data-nav-view="account">Account</a>
            <button class="nav-signout" id="navSignOut" type="button">Sign out</button>
          </nav>
        </details>
        <button class="button quiet" id="signOut" type="button" hidden>Sign out</button>
      </div>
    </header>
    <main id="app"><div class="loading" aria-label="Loading your training"></div></main>
  </div>

  <dialog class="dialog" id="emailDialog">
    <form class="dialog-inner" id="emailForm">
      <div class="dialog-head"><div><p class="eyebrow">Account</p><h2>Change your email</h2></div><button class="dialog-close" type="button" data-close-dialog aria-label="Close">&times;</button></div>
      <div class="form-grid"><label class="field-label">New email address<input class="field-input" type="email" name="email" autocomplete="email" required placeholder="you@example.com"><small class="field-hint">We send a confirmation to the new address. Your training stays linked either way.</small></label></div>
      <p class="status-message" id="emailStatus" role="status"></p>
      <div class="dialog-actions"><button class="button" type="button" data-close-dialog>Cancel</button><button class="button primary" type="submit">Send confirmation <span class="icon-arrow">&rarr;</span></button></div>
    </form>
  </dialog>
  <script type="module" src="/athlete/athlete.js?v=33"></script>
  <script type="module" src="/private/auth-enhancements.js?v=2"></script>
  <script type="module" src="/private/recovery-enhancements.js?v=1"></script>
</body>
</html>
