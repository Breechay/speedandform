# ── Publishing is a human action ─────────────────────────────────────────────
#
# Every push to main was auto-publishing, and a production deploy is 15 of the 300
# free monthly credits. That is roughly twenty pushes a month, and one working day
# spent about a dozen of them. Build minutes were never the cost; automatic
# publishing was.
#
# The real control is the Netlify UI: Site configuration -> Build & deploy ->
# Continuous deployment -> Stop auto publishing. Pushes still build a preview and
# nothing reaches production until a person presses publish.
#
# Deliberately NOT using `ignore = "exit 0"` here. That skips every build including
# branch previews, which is the loop used to check a change on a phone. The point is
# to stop publishing, not to stop building.

[build]
  command = "echo 'no build needed'"
  publish = "."

# Force Netlify CDN to purge on every deploy
[build.environment]
  NODE_VERSION = "20"

# Context-level cache headers — belt and suspenders alongside _headers file
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# WordPress spam

# Sign in with Apple web Services ID return URL
[[redirects]]
  from = "/auth/apple/callback"
  to = "/auth/apple/callback.html"
  status = 200

# Private athlete system
# 200 rewrites, not 301s: Netlify matches "/coach" and "/coach/" as the same
# path, so a redirect between them loops forever. A rewrite cannot loop, and
# force = true still makes the private product win over legacy coach.html.
# The pages reference assets by absolute path, so serving them at the
# slashless URL resolves correctly.
[[redirects]]
  from = "/athlete"
  to = "/athlete/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/coach"
  to = "/coach/index.html"
  status = 200
  force = true

# The published plan. A 200 rewrite so the slashless URL — the one an athlete is
# actually handed — serves the page rather than bouncing through a redirect.
[[redirects]]
  from = "/plans/race-pace-durability"
  to = "/plans/race-pace-durability/index.html"
  status = 200
  force = true

[[redirects]]
