<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FORM · Race Pace Durability</title>
<link rel="stylesheet" href="/plans/race-pace-durability/styles.css" />
</head>
<body>
<div class="page-shell">
  <header class="topbar">
    <div class="brand">FORM <span>LABS</span></div>
    <nav class="topnav" aria-label="Primary">
      <a href="#plan">The Plan</a>
    </nav>
    <div class="actions">
      <button class="btn" id="share" type="button">⇧ &nbsp; Share Plan</button>
      <button class="btn lime" id="pdf" type="button">▣ &nbsp; Download PDF</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="mobile-folio" id="folio" aria-live="polite"></div>
      <div class="hero-copy">
        <h1>Race Pace Durability</h1>
        <div class="eyebrow" id="eyebrow"></div>
      </div>
      <div class="mobile-hero-actions">
        <button class="share-icon-btn" id="shareMobile" type="button" aria-label="Share plan" title="Share plan">↗</button>
        <button class="btn lime" id="pdfMobile" type="button">▣ &nbsp; Download PDF</button>
      </div>
    </section>

    <div class="done" id="done" hidden>
      <div class="status">Completed · v1</div>
      <h3>The plan has been run.</h3>
      <p id="doneDates"></p>
    </div>

    <section class="plan-section" id="plan" tabindex="0" aria-label="Training plan">
      <div class="plan-head">
        <h2 id="planTitle"></h2>
        <div class="week-now">
          <button class="circle" id="prev" type="button" aria-label="Previous week">‹</button>
          <span class="range" id="range" aria-live="polite"></span>
          <button class="circle" id="next" type="button" aria-label="Next week">›</button>
        </div>
      </div>

      <div class="motion-viewport" id="viewport">
        <div class="motion-track" id="track">
          <div class="sheet" id="prevSheet" aria-hidden="true"></div>
          <div class="sheet" id="curSheet"></div>
          <div class="sheet" id="nextSheet" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-brand">FORM <span>LABS</span></div>
    <div class="footer-rule"></div>
    <div class="footer-copy">A higher standard for distance running.</div>
    <div class="version" id="version"></div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="dev" id="dev" aria-label="Prototype state (development only)">
  <button data-state="build">W3 · Build</button>
  <button data-state="ask">W4 · Ask</button>
  <button data-state="race">W15 · Race</button>
  <button data-state="complete">Complete</button>
  <button data-state="auto">Auto</button>
</div>
<script type="module" src="/plans/race-pace-durability/plan.js"></script>
</body>
</html>
