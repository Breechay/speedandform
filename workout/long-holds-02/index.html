<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta property="og:image" content="https://speedandform.com/og/workout-long-holds-02.jpg">

<meta name="apple-itunes-app" content="app-id=6761313085, app-argument=https://speedandform.com/workout/long-holds-02">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/css/sf-brand.css?v=20261001">
<style>
@font-face{font-family:"Inter Tight";src:url("/assets/site/fonts/inter-tight-latin-variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{--night:#0B0B0B;--graphite:#1A1A1A;--chalk:#F4F2EC;--mist:#B9B9B3;--stone:#8C8C86;--line:rgba(244,242,236,.12);--sans:"Inter Tight",-apple-system,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{position:absolute;z-index:5;inset:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,4vw,56px)}
.top .sf-brand{filter:invert(1)}
.top .crumb{font-size:14px;color:var(--mist);text-decoration:none}
.hero{position:relative;min-height:72svh;display:flex;align-items:flex-end;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1) contrast(1.08);transform:scale(1.04);transition:transform 1600ms cubic-bezier(.16,1,.3,1)}
.hero.in img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,11,.15) 0%,rgba(11,11,11,.45) 45%,var(--night) 100%)}
.hero .copy{position:relative;z-index:2;padding:0 clamp(20px,5vw,88px) 34px;max-width:900px}
h1{margin:10px 0 0;font-size:clamp(44px,9vw,104px);line-height:.95;font-weight:850;letter-spacing:-.045em}
.structure{margin-top:10px;font-size:clamp(18px,2.4vw,24px);font-weight:600;color:var(--chalk);opacity:.86;font-variant-numeric:tabular-nums}
.lead{margin-top:16px;font-size:clamp(17px,2vw,21px);line-height:1.45;color:var(--mist);max-width:620px}
main{padding:0 clamp(20px,5vw,88px) 140px;max-width:900px}
.label{margin:44px 0 10px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}
.work{border-top:1px solid var(--line)}
.work div{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.work b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.work span{font-size:15px;color:var(--stone)}
p.body{margin:0;font-size:17px;line-height:1.55;color:var(--mist);max-width:620px}
.cta{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:16px clamp(20px,5vw,88px) calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(11,11,11,0),var(--night) 40%);display:flex;gap:10px;align-items:center}
.cta a.primary{flex:1;max-width:420px;display:flex;justify-content:center;align-items:center;min-height:56px;border-radius:999px;background:var(--chalk);color:var(--night);font-weight:650;font-size:17px;text-decoration:none}
.cta small{font-size:13px;color:var(--stone);max-width:220px;line-height:1.35}
.group{margin-top:56px}
.group .band{position:relative;height:180px;border-radius:22px;overflow:hidden;display:flex;align-items:flex-end}
.group .band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 32%;filter:grayscale(1)}
.group .band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(11,11,11,.85))}
.group .band h2{position:relative;z-index:2;margin:0;padding:18px;font-size:36px;font-weight:850;letter-spacing:-.03em}
.group .line{margin:12px 0 4px;font-size:15px;color:var(--stone)}
.row{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row strong{display:block;font-size:21px;font-weight:600;letter-spacing:-.01em}
.row em{display:block;font-style:normal;font-size:15px;font-weight:550;color:var(--chalk);opacity:.86;margin-top:3px;font-variant-numeric:tabular-nums}
.row span{display:block;font-size:15px;color:var(--stone);margin-top:4px;line-height:1.4}
.row i{font-style:normal;color:var(--stone);align-self:center}
.note{color:var(--stone);font-size:15px;padding:40px 0}
@media(prefers-reduced-motion:reduce){.hero img{transition:none;transform:none}}
</style>
</head>
<body>
<header class="top"><a class="sf-brand" href="/" aria-label="Speed and Form home"></a><a class="crumb" href="/workout/">All sessions</a></header>
<section class="hero" id="hero"><img id="hero-img" src="/media/library/bw-lead-runner-1200.webp" alt="" fetchpriority="high"><div class="copy" id="hero-copy"><h1>Choose your work.</h1><p class="lead">Sessions from our Thursday track in Miami. Run one, keep your times in FORM, share the work.</p></div></section>
<main id="main"><p class="note">Loading…</p></main>
<div class="cta"><a class="primary" id="cta" href="https://apps.apple.com/us/app/id6761313085">Run it in FORM</a><small>Free on iPhone. Keep your times without an account.</small></div>
<script>
(function () {
  'use strict';
  var SUPA = 'https://pbgsjjegycacodiltbhn.supabase.co';
  var KEY = 'sb_publishable_5Dg5TUvnh2mEo-zCYAbgmw_WHNXKDqj';
  var PHOTO = { Speed: 'bw-high-knees', Endurance: 'night-pair-track', Threshold: 'bw-track-talk' };
  var LINE = { Speed: 'Short and fast. Relaxed speed, full rests.', Endurance: 'Longer reps. Learn a pace and hold it.',
               Threshold: 'Long, steady holds. The engine for every race from 5K up.' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function name(t) {
    var small = { and: 1, of: 1, the: 1, a: 1, to: 1, 'in': 1, by: 1 };
    return String(t).toLowerCase().split(' ').map(function (w, i) { return /\d/.test(w) ? w.toUpperCase() : (i > 0 && small[w] ? w : w.charAt(0).toUpperCase() + w.slice(1)); }).join(' ');
  }
  function one(b) { return b.distance_meters ? String(b.distance_meters) : (b.duration_seconds ? Math.round(b.duration_seconds / 60) + ' min' : ''); }
  function work(b) {
    if (b.distance_meters) return (b.reps > 1 ? b.reps + ' × ' : '') + b.distance_meters + ' m';
    if (b.duration_seconds) return (b.reps > 1 ? b.reps + ' × ' : '') + Math.round(b.duration_seconds / 60) + ' min';
    return '';
  }
  function structure(s) {
    var bl = s.blocks || [];
    if (bl.length === 1) return work(bl[0]);
    if (bl.every(function (b) { return b.reps === 1; })) return bl.map(one).join(' · ') + (bl[0].distance_meters ? ' m' : '');
    return bl.map(function (b) { return b.reps > 1 ? b.reps + ' × ' + one(b) : one(b); }).join(' · ');
  }
  function rest(b) {
    if (b.recovery) return b.recovery;
    if (b.recovery_seconds) { var m = Math.floor(b.recovery_seconds / 60), s = b.recovery_seconds % 60; return (m ? m + ':' + String(s).padStart(2, '0') : s + 's') + ' easy'; }
    return '';
  }
  function photo(group) { return '/media/library/' + (PHOTO[group] || PHOTO.Speed) + '-1200.webp'; }
  function rpc(fn, body) {
    return fetch(SUPA + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}), cache: 'no-store', credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error('unavailable'); return r.json(); });
  }
  var main = document.getElementById('main');
  var id = decodeURIComponent((location.pathname.match(/^\/workout\/([^\/?#]+)/) || [])[1] || '');
  requestAnimationFrame(function () { document.getElementById('hero').classList.add('in'); });

  function session(s) {
    document.title = name(s.title) + ' · ' + structure(s) + ' | FORM Speed';
    var canon = document.querySelector('link[rel=canonical]'); if (canon) canon.href = 'https://speedandform.com/workout/' + s.id;
    document.getElementById('hero-img').src = photo(s.group);
    document.getElementById('hero-copy').innerHTML =
      '<h1>' + esc(name(s.title)) + '</h1>' +
      '<div class="structure">' + esc(structure(s)) + '</div>' + (s.purpose ? '<p class="lead">' + esc(s.purpose) + '</p>' : '');
    var html = '<div class="label">The work</div><div class="work">' + (s.blocks || []).map(function (b) {
      var r = rest(b); return '<div><b>' + esc(work(b)) + '</b>' + (r && b.recovery_seconds !== 0 ? '<span>' + esc(r) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
    if (s.effort) html += '<div class="label">How it should feel</div><p class="body">' + esc(s.effort) + '</p>';
    html += '<div class="label">Before and after</div><p class="body">Warm up with 15 minutes easy, drills and a few strides. Cool down with 10 minutes easy. If something hurts, stop there.</p>';
    if (s.runs_this_month >= 3) html += '<div class="label">This month</div><p class="body">' + s.runs_this_month + ' runners ran this session in FORM.</p>';
    html += '<div class="label">More sessions</div><p class="body"><a href="/workout/">See all of them</a>, or run with us on <a href="/thursday">Thursday</a> at Flamingo Park.</p>';
    main.innerHTML = html;
  }

  function list(all) {
    var groups = ['Speed', 'Endurance', 'Threshold'];
    main.innerHTML = groups.map(function (g) {
      var items = all.filter(function (s) { return (s.group || 'Speed') === g; });
      if (!items.length) return '';
      return '<section class="group"><div class="band"><img src="' + photo(g) + '" alt="" loading="lazy"><h2>' + g + '.</h2></div>' +
        '<p class="line">' + esc(LINE[g]) + '</p>' + items.map(function (s) {
          return '<a class="row" href="/workout/' + encodeURIComponent(s.id) + '"><div><strong>' + esc(name(s.title)) + '</strong><em>' +
            esc(structure(s)) + '</em>' + (s.purpose ? '<span>' + esc(s.purpose) + '</span>' : '') + '</div><i>›</i></a>';
        }).join('') + '</section>';
    }).join('');
  }

  (id ? rpc('form_open_speed_session', { p_id: id }) : rpc('form_open_speed_library'))
    .then(function (data) {
      if (id) { if (!data) throw new Error('missing'); session(data); } else { list(data || []); }
    })
    .catch(function () {
      main.innerHTML = '<p class="note">' + (id ? 'This session is not available. <a href="/workout/">See all sessions</a>.' : 'The sessions are not available right now. Try again in a moment.') + '</p>';
    });
})();
</script>
</body>
</html>
