<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07090a">
  <title>Runs · Labs</title>
  <link rel="preload" href="/assets/site/fonts/inter-tight-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/coach/runs/runs.css?v=4">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/coach/labs/">Labs</a>
    <nav class="nav" aria-label="Labs">
      <a href="/coach/labs/#/brief">Brief</a>
      <a href="/coach/labs/">Plan</a>
      <a href="/coach/console/">Console</a>
      <a class="on" href="/coach/runs/" aria-current="page">Runs</a>
    </nav>
  </header>
  <div class="wrap" id="wrap">
    <aside class="list" id="list" aria-label="Runs">
      <div class="listHead">
        <h1>Runs.</h1>
        <button type="button" class="pill" id="newRun">New run</button>
      </div>
      <div id="rows"><p class="quiet pad">Loading runs…</p></div>
    </aside>
    <main class="pane" id="pane" aria-live="polite">
      <div class="empty"><p class="quiet">Choose a run. Upcoming runs can be moved or canceled; past runs take photographs.</p></div>
    </main>
  </div>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <form method="dialog" id="sheetForm">
      <div class="sheetHead"><h2 id="sheetTitle"></h2><button type="button" class="x" id="sheetClose" aria-label="Close">×</button></div>
      <div id="sheetBody"></div>
      <p class="note" id="sheetNote" role="status"></p>
      <div class="sheetFoot"><button type="button" class="btn ghost" id="sheetCancel">Cancel</button><button type="submit" class="btn go" id="sheetSave">Save</button></div>
    </form>
  </dialog>

  <script type="module" src="/coach/runs/runs.js?v=3"></script>
</body>
</html>
