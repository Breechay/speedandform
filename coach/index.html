<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#141718">
  <title>Coach Desk · FORM</title>
  <link rel="stylesheet" href="/private/graphite.css?v=28">
</head>
<body>
  <a class="skip-link" href="#deskMain">Skip to current decision</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="FORM home"><span class="form-mark">FORM</span><span class="product-name">Coach Desk</span></a>
      <div class="topbar-tools">
        <button class="switcher" id="openRoster" type="button" aria-label="Switch athlete">Athletes</button>
        <details class="control" id="control">
          <summary aria-label="Account"><span class="avatar-me" id="userInitials">B</span></summary>
          <div class="control-menu">
            <p class="control-who" id="userEmail"></p>
            <button class="control-item" id="signOut" type="button">Sign out</button>
          </div>
        </details>
      </div>
    </header>
    <main id="app"><div class="loading" aria-label="Loading Coach Desk"></div></main>
  </div>
  <div class="roster-scrim" id="rosterScrim" hidden></div>
  <aside class="roster-drawer" id="rosterDrawer" hidden aria-label="Athletes">
    <div class="roster-head"><p class="eyebrow" id="rosterCount"></p><button class="drawer-close" id="closeRoster" type="button" aria-label="Close">&times;</button></div>
    <div class="athlete-list" id="rosterList"></div>
  </aside>

  <dialog class="dialog" id="decisionDialog">
    <form class="dialog-inner" id="decisionForm">
      <div class="dialog-head"><div><p class="eyebrow">Publish a Decision</p><h2 id="decisionDialogTitle">Make the next call</h2></div><button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button></div>
      <input type="hidden" name="actionId">
      <div class="form-grid">
        <label class="field-label">Athlete-facing decision<textarea class="field-textarea" name="athleteText" required></textarea></label>
        <label class="field-label">Why this changed<textarea class="field-textarea" name="rationale" required></textarea></label>
      </div>
      <p class="status-message" id="decisionStatus" role="status"></p>
      <div class="dialog-actions"><button class="button" type="button" data-close-dialog>Cancel</button><button class="button primary" type="submit">Publish Decision <span class="icon-arrow">→</span></button></div>
    </form>
  </dialog>

  <dialog class="dialog" id="coachingDialog">
    <form class="dialog-inner" id="coachingForm">
      <div class="dialog-head">
        <h2 id="coachingContext">Write to her</h2>
        <button class="dialog-close" type="button" data-close-dialog aria-label="Close">&times;</button>
      </div>

      <label class="field-label lead">Instructions
        <textarea class="field-textarea tall" name="athleteText" required placeholder="How these miles get run."></textarea>
      </label>

      <div class="switch" role="group" aria-label="When this is for">
        <label><input type="radio" name="objectType" value="direction" checked><span>Before the run</span></label>
        <label><input type="radio" name="objectType" value="read"><span>After the run</span></label>
      </div>

      <details class="more" data-direction-only>
        <summary>Structure</summary>
        <div class="form-grid two">
          <label class="field-label">Protect<input class="field-input" name="protectedVariable" placeholder="Easy effort and a quiet knee"></label>
          <label class="field-label">Can move<input class="field-input" name="movableVariable" placeholder="Distance and walk breaks"></label>
          <label class="field-label">Stop or change if<input class="field-input" name="stopOrChangeIf" placeholder="Movement changes or discomfort builds"></label>
          <label class="field-label">Heat allowance<input class="field-input" name="heatAllowance" placeholder="Slower is correct above 80&deg;F"></label>
          <label class="field-label">Where<select class="field-select" name="surface"><option value="">Not specified</option><option value="outdoor">Outdoor</option><option value="treadmill">Treadmill</option><option value="track">Track</option></select></label>
          <label class="field-label">Company<select class="field-select" name="company"><option value="">Not specified</option><option value="with_brice">With Brice</option><option value="independent">Independent</option></select></label>
        </div>
        <label class="field-label">Priority order<textarea class="field-textarea priority-input" name="priorityTargets" placeholder="One target per line, most important first."></textarea></label>
        <label class="field-label">Session<select class="field-select" name="plannedSessionId"></select></label>
      </details>

      <details class="more" data-read-only hidden>
        <summary>Which runs</summary>
        <label class="field-label">Runs this covers<select class="field-select" name="completionIds" multiple size="4"></select></label>
        <label class="field-label">Question this answers<input class="field-input" name="questionAnswered" placeholder="What did the session teach us?"></label>
      </details>

      <details class="more">
        <summary>How it reaches her</summary>
        <label class="field-label">Delivery<select class="field-select" name="deliveryState"><option value="published">Published to her record</option><option value="delivered_externally">Sent outside FORM</option></select></label>
        <label class="field-label" data-external-only hidden>Wording actually sent<textarea class="field-textarea" name="deliveredWording" placeholder="Paste exactly what you sent."></textarea></label>
      </details>

      <p class="status-message" id="coachingStatus" role="status"></p>
      <div class="dialog-actions"><button class="button" type="button" data-close-dialog>Cancel</button><button class="button primary" type="submit">Save <span class="icon-arrow">&rarr;</span></button></div>
    </form>
  </dialog>

  <dialog class="dialog" id="noteDialog">
    <form class="dialog-inner" id="noteForm">
      <div class="dialog-head"><div><p class="eyebrow">Coach only</p><h2>Add a private note.</h2></div><button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button></div>
      <div class="form-grid"><label class="field-label">Private note<textarea class="field-textarea" name="body" required placeholder="This can never be selected by the athlete."></textarea></label></div>
      <p class="status-message" id="noteStatus" role="status"></p>
      <div class="dialog-actions"><button class="button" type="button" data-close-dialog>Cancel</button><button class="button primary" type="submit">Save private note <span class="icon-arrow">→</span></button></div>
    </form>
  </dialog>

  <dialog class="dialog" id="shareDialog">
    <form class="dialog-inner" id="shareForm">
      <div class="dialog-head"><div><p class="eyebrow">Frozen public excerpt</p><h2>Share only what was approved.</h2></div><button class="dialog-close" type="button" data-close-dialog aria-label="Close">×</button></div>
      <div class="form-grid">
        <label class="field-label">Public headline<input class="field-input" name="headline" required></label>
        <label class="field-label">Public summary<textarea class="field-textarea" name="summary" required></textarea></label>
        <label class="field-label">Consent note<input class="field-input" name="consentNote" required placeholder="Natalie approved this exact excerpt on Aug 24"></label>
        <label class="field-label">Consent recorded at<input class="field-input" name="consentRecordedAt" type="datetime-local" required></label>
      </div>
      <p class="status-message" id="shareStatus" role="status"></p>
      <div class="dialog-actions"><button class="button" type="button" data-close-dialog>Cancel</button><button class="button primary" type="submit">Publish frozen excerpt <span class="icon-arrow">→</span></button></div>
    </form>
  </dialog>
  <script type="module" src="/coach/coach.js?v=28"></script>
</body>
</html>
