<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07090a">
  <title>FORM Labs</title>
  <link rel="preload" href="/assets/labs/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/labs/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/coach/labs/labs.css?v=2">
</head>
<body>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="mark">FORM <em>LABS</em></div>
  <div class="stamp" id="stamp"></div>
  <div class="viewAs" id="viewAs" hidden>
    <button data-view-as="coach" type="button" class="on">Coach</button>
    <button data-view-as="athlete" type="button">Athlete</button>
  </div>
  <nav class="navSet" id="nav" hidden>
    <button data-nav="bench" type="button">Bench</button>
    <button data-nav="brief" type="button">Brief</button>
    <button data-nav="plan" type="button">Plan</button>
    <button data-nav="console" type="button">Console</button>
  </nav>

  <div id="app"><div class="loading">READING THE BENCH</div></div>


  <button class="plToggle" id="plToggle" type="button" aria-expanded="false" aria-controls="plPanel">Photo Lab</button>
  <aside class="plPanel" id="plPanel" aria-label="Athlete portrait">
    <div class="plHead">
      <div><div class="plTitle">Portrait</div>
        <div class="plHint">Crop against the real column. Nothing is saved until you keep it.</div></div>
      <button class="plClose" id="plClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="plField"><label for="plWho">ATHLETE</label><select id="plWho"></select></div>
    <div class="plField"><label>PHOTO</label>
      <label class="plPick">Choose or replace image<input id="plFile" type="file" accept="image/*"></label></div>
    <div class="plField"><label for="plX">HORIZONTAL</label>
      <div class="plRow"><input id="plX" type="range" min="0" max="100"><span class="plVal" id="plXv"></span></div></div>
    <div class="plField"><label for="plY">VERTICAL</label>
      <div class="plRow"><input id="plY" type="range" min="0" max="100"><span class="plVal" id="plYv"></span></div></div>
    <div class="plField"><label for="plZ">ZOOM</label>
      <div class="plRow"><input id="plZ" type="range" min="100" max="260"><span class="plVal" id="plZv"></span></div></div>
    <div class="plField"><label for="plE">EXPOSURE</label>
      <div class="plRow"><input id="plE" type="range" min="40" max="180"><span class="plVal" id="plEv"></span></div></div>
    <div class="plField"><label for="plC">CONTRAST</label>
      <div class="plRow"><input id="plC" type="range" min="50" max="200"><span class="plVal" id="plCv"></span></div></div>
    <div class="plField"><label for="plG">COLOUR</label>
      <div class="plRow"><input id="plG" type="range" min="0" max="100"><span class="plVal" id="plGv"></span></div></div>
    <div class="plActs">
      <button id="plRemove" type="button">Remove photo</button>
      <button id="plKeep" type="button">Keep</button>
    </div>
    <div class="plNote" id="plNote">Six values, stored on the athlete. The crop is theirs, not this browser's.</div>
  </aside>

  <div class="dScrim" id="sessionScrim"></div>
  <aside class="drawer" id="sessionDrawer" aria-label="Session"></aside>

  <div class="shScrim" id="shScrim"></div>
  <aside class="sheet" id="sheet" aria-label="Editor" aria-hidden="true">
    <div class="shHead">
      <div><div class="shKind" id="shKind"></div><div class="shTitle" id="shTitle"></div>
        <div class="shSub" id="shSub"></div></div>
      <button class="shClose" id="shClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="shBody" id="shBody"></div>
    <div class="shFoot">
      <span class="shNote" id="shNote"></span>
      <button class="btn ghost" id="shCancel" type="button">Cancel</button>
      <button class="btn" id="shSave" type="button">Keep</button>
    </div>
  </aside>

  <script type="module" src="/coach/labs/labs.js?v=1"></script>
</body>
</html>
