<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Village</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #f5f2ec;
  --ink:   #2a2620;
  --mid:   #6b6459;
  --faint: #c2bbb4;
  --rule:  #e2ddd7;
}
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--cream);
  -webkit-text-size-adjust: 100%;
}

/* ════════════════════════════════
   IPAD LANDSCAPE — primary target
   1024×768 · 1180×820
   ════════════════════════════════ */
.page {
  display: none;
  position: absolute;
  inset: 0;
  background: var(--cream);
  padding: 44px 64px 44px;
}
.page.on { display: block; }

.intake-shell {
  width: 100%;
  max-width: 1120px;
  height: 100%;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 0.76fr 1.24fr;
  grid-template-rows: auto 1fr;
  column-gap: 56px;
}

/* NAV — full width across both columns */
.nav {
  grid-column: 1 / -1;
  grid-row: 1;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 0;
}
.wordmark {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 17px;
  letter-spacing: 0.2em;
  color: var(--ink);
  text-decoration: none;
}
.steward-btn {
  font-family: 'Jost', sans-serif;
  font-size: 7px;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--faint);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  touch-action: manipulation;
  transition: color 0.2s;
}
.steward-btn:hover { color: var(--mid); }

/* LEFT — title anchored upper area, not centered */
.left-pane {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-top: clamp(140px, 21vh, 200px);
}
.heading {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(44px, 4.8vw, 68px);
  line-height: 0.93;
  letter-spacing: 0.02em;
  color: var(--ink);
  margin-bottom: 20px;
}
.helper {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  font-weight: 300;
  color: var(--faint);
  line-height: 1.5;
  max-width: 340px;
  letter-spacing: 0.01em;
}

/* RIGHT — form vertically centered in its row */
.form-pane {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: 118px;
  padding-bottom: 24px;
}

/* FIELDS */
.fields {
  display: flex;
  flex-direction: column;
  gap: 30px;
}
.field { display: block; }
.lbl {
  display: block;
  font-family: 'Jost', sans-serif;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 10px;
}
input[type="text"] {
  width: 100%;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: 0.01em;
  color: var(--ink);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 0 0 12px;
  outline: none;
  -webkit-appearance: none;
  border-radius: 0;
  caret-color: var(--mid);
  transition: border-color 0.2s;
}
input:focus { border-bottom-color: var(--mid); }
input::placeholder {
  color: var(--faint);
  font-style: italic;
}

/* SUBMIT */
.submit {
  display: block;
  width: 440px;
  max-width: 100%;
  align-self: flex-start;
  margin-top: 36px;
  padding: 17px 0;
  font-family: 'Jost', sans-serif;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--cream);
  background: var(--ink);
  border: none;
  cursor: pointer;
  transition: opacity 0.2s;
  -webkit-appearance: none;
  touch-action: manipulation;
}
.submit:disabled { opacity: 0.3; }
.submit:active   { opacity: 0.75; }

/* ════════════════════════════════
   IPAD PORTRAIT — 768×1024
   ════════════════════════════════ */
@media (max-width: 900px) {
  .page { padding: 40px 48px 32px; overflow-y: auto; }

  .intake-shell {
    max-width: 620px;
    min-height: auto;
    height: auto;
    display: flex;
    flex-direction: column;
    margin: 0 auto;
  }

  .nav { margin-bottom: 38px; }

  .left-pane { padding-top: 0; margin-bottom: 18px; }

  .heading { font-size: 44px; line-height: 0.94; }

  .helper { font-size: 17px; max-width: 100%; }

  .form-pane { flex: none; padding-top: 0; padding-bottom: 0; max-width: none; width: 100%; }

  .fields { gap: 22px; }

  input[type="text"] { font-size: 22px; }

  .submit { width: 100%; align-self: stretch; margin-top: 26px; }
}

/* ════════════════════════════════
   PHONE — small screens, centered
   ════════════════════════════════ */
@media (max-width: 540px) {
  .page { padding: 32px 28px; }
  .heading { font-size: 36px; }
  .helper  { display: none; }
  input[type="text"] { font-size: 20px; }
}

/* ════════════════════════════════
   SUCCESS
   ════════════════════════════════ */
#pg-success .intake-shell {
  align-items: center;
}
.success-left {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-top: clamp(140px, 21vh, 200px);
}
.success-heading {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(44px, 4.8vw, 68px);
  line-height: 0.93;
  letter-spacing: 0.02em;
  color: var(--ink);
  margin-bottom: 16px;
}
.success-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 19px;
  font-weight: 300;
  color: var(--faint);
  line-height: 1.5;
  letter-spacing: 0.01em;
}
.success-right {
  grid-column: 2;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding-top: 118px;
  padding-bottom: 24px;
}
.next-hint {
  display: block;
  font-family: 'Jost', sans-serif;
  font-size: 8px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--faint);
  margin-top: 12px;
  text-align: center;
}

@media (max-width: 900px) {
  .success-left  { grid-column: unset; grid-row: unset; padding-top: 0; margin-bottom: 44px; }
  .success-right { grid-column: unset; grid-row: unset; justify-content: flex-start; padding-bottom: 0; }
  #pg-success .intake-shell { align-items: unset; }
  .success-heading { font-size: 46px; }
}

/* ════════════════════════════════
   OVERLAY
   ════════════════════════════════ */
.overlay {
  position: fixed;
  inset: 0;
  background: var(--cream);
  z-index: 100;
  display: none;
  overflow-y: auto;
  padding: 44px 64px 56px;
}
.overlay.on { display: block; }
.ov-shell {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}
.ov-nav {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 48px;
}
.ov-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 38px;
  letter-spacing: 0.02em;
  color: var(--ink);
}
.close-btn {
  font-family: 'Jost', sans-serif;
  font-size: 7px;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--faint);
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.2s;
}
.close-btn:hover { color: var(--mid); }
.lock-lbl {
  font-family: 'Jost', sans-serif;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--mid);
  display: block;
  margin-bottom: 12px;
}
.lock-input {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 24px;
  color: var(--ink);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--rule);
  padding: 0 0 12px;
  outline: none;
  border-radius: 0;
  width: 240px;
  display: block;
  margin-bottom: 32px;
}
.lock-err {
  font-family: 'Jost', sans-serif;
  font-size: 10px;
  color: var(--faint);
  letter-spacing: 0.05em;
  margin-top: 12px;
  display: none;
}
.room-count {
  font-family: 'Jost', sans-serif;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 36px;
  display: block;
}
.p-row { padding: 18px 0; border-top: 1px solid var(--rule); }
.p-row:last-child { border-bottom: 1px solid var(--rule); }
.p-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: 26px;
  color: var(--ink);
  margin-bottom: 3px;
}
.p-world {
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--mid);
  letter-spacing: 0.04em;
  margin-bottom: 3px;
}
.p-building {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 16px;
  font-weight: 300;
  color: var(--mid);
  margin-bottom: 3px;
}
.p-contact {
  font-family: 'Jost', sans-serif;
  font-size: 11px;
  font-weight: 300;
  color: var(--faint);
}
.p-empty {
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  color: var(--faint);
  padding: 24px 0;
  letter-spacing: 0.04em;
}

@media (max-width: 900px) {
  .overlay { padding: 40px 48px 56px; }
}
@media (max-width: 540px) {
  .overlay { padding: 32px 28px 48px; }
}
</style>
</head>
<body>

<!-- ── FORM ── -->
<div class="page on" id="pg-form">
  <div class="intake-shell">

    <div class="nav">
      <a class="wordmark" href="/">FORM</a>
      <button class="steward-btn" onclick="openOverlay()">Steward</button>
    </div>

    <div class="left-pane">
      <h1 class="heading">Who's in<br>the room?</h1>
    </div>

    <div class="form-pane">
      <div class="fields">
        <div class="field">
          <label class="lbl" for="f-name">Name</label>
          <input type="text" id="f-name"
            placeholder="First name"
            autocomplete="off" autocorrect="off" spellcheck="false" />
        </div>
        <div class="field">
          <label class="lbl" for="f-what">What world are you in?</label>
          <input type="text" id="f-what"
            placeholder="forensic accounting, design, weddings, architecture…"
            autocomplete="off" autocorrect="off" spellcheck="false" />
        </div>
        <div class="field">
          <label class="lbl" for="f-project">What's taking your attention lately?</label>
          <input type="text" id="f-project"
            placeholder="a launch, a studio, a product, a transition…"
            autocomplete="off" autocorrect="off" spellcheck="false" />
        </div>
        <div class="field">
          <label class="lbl" for="f-contact">How do people find you?</label>
          <input type="text" id="f-contact"
            placeholder="@handle, number, or email"
            autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
        </div>
      </div>
      <button class="submit" id="submit-btn" onclick="submitForm()">I'm here</button>
    </div>

  </div>
</div>

<!-- ── SUCCESS ── -->
<div class="page" id="pg-success">
  <div class="intake-shell">

    <div class="nav">
      <a class="wordmark" href="/">FORM</a>
    </div>

    <div class="success-left">
      <h2 class="success-heading">Good to<br>have you.</h2>
      <p class="success-sub">Hand it to someone new.</p>
    </div>

    <div class="success-right">
      <button class="submit" onclick="reset()">Pass it on</button>
      <span class="next-hint">Pass it along</span>
    </div>

  </div>
</div>

<!-- ── OVERLAY ── -->
<div class="overlay" id="overlay">
  <div class="ov-shell">
    <div class="ov-nav">
      <span class="ov-title" id="ov-title">Steward</span>
      <button class="close-btn" onclick="closeOverlay()">Close</button>
    </div>
    <div id="lock-panel">
      <label class="lock-lbl">Passphrase</label>
      <input class="lock-input" type="password" id="lock-input" placeholder="—"
             onkeydown="if(event.key==='Enter')checkLock()" />
      <button class="submit" style="width:160px" onclick="checkLock()">Enter</button>
      <div class="lock-err" id="lock-err">Not quite.</div>
    </div>
    <div id="people-panel" style="display:none">
      <span class="room-count" id="room-count">Loading…</span>
      <div id="people-list"><div class="p-empty">No one yet.</div></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL  = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON = 'YOUR_SUPABASE_ANON_KEY';
  const STEWARD_PASS  = 'village';

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
    document.getElementById(id).classList.add('on');
  }

  async function submitForm() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { document.getElementById('f-name').focus(); return; }
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '—';
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/village_people`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON,
          'Authorization': `Bearer ${SUPABASE_ANON}`,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          name,
          what:            document.getElementById('f-what').value.trim()    || null,
          contact:         document.getElementById('f-contact').value.trim() || null,
          current_project: document.getElementById('f-project').value.trim() || null,
          source:          'sunday_ipad',
          sunday_date:     getSunday(),
          created_at:      new Date().toISOString()
        })
      });
      if (!r.ok) throw new Error(await r.text());
      showPage('pg-success');
    } catch {
      alert('Something went wrong — check wifi and try again.');
      btn.disabled = false; btn.textContent = "I'm here";
    }
  }

  function reset() {
    ['f-name','f-what','f-contact','f-project'].forEach(id =>
      document.getElementById(id).value = '');
    const btn = document.getElementById('submit-btn');
    btn.disabled = false; btn.textContent = "I'm here";
    showPage('pg-form');
  }

  function openOverlay() {
    document.getElementById('overlay').classList.add('on');
    document.getElementById('lock-panel').style.display   = '';
    document.getElementById('people-panel').style.display = 'none';
    document.getElementById('ov-title').textContent = 'Steward';
    document.getElementById('lock-input').value = '';
    document.getElementById('lock-err').style.display = 'none';
    setTimeout(() => document.getElementById('lock-input').focus(), 80);
  }

  function closeOverlay() {
    document.getElementById('overlay').classList.remove('on');
  }

  function checkLock() {
    if (document.getElementById('lock-input').value === STEWARD_PASS) {
      document.getElementById('lock-panel').style.display   = 'none';
      document.getElementById('people-panel').style.display = '';
      document.getElementById('ov-title').textContent = 'The room';
      loadPeople();
    } else {
      document.getElementById('lock-err').style.display = 'block';
    }
  }

  async function loadPeople() {
    document.getElementById('room-count').textContent = 'Loading…';
    document.getElementById('people-list').innerHTML  = '';
    try {
      const r = await fetch(
        `${SUPABASE_URL}/rest/v1/village_people?sunday_date=eq.${getSunday()}&order=created_at.asc`,
        { headers: { 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}` } }
      );
      const data = await r.json();
      const s = new Date(); s.setDate(s.getDate() - s.getDay());
      const label = s.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
      document.getElementById('room-count').textContent =
        `${data.length} ${data.length === 1 ? 'person' : 'people'} · ${label}`;
      document.getElementById('people-list').innerHTML = data.length
        ? data.map(p => `
            <div class="p-row">
              <div class="p-name">${esc(p.name)}</div>
              ${p.what            ? `<div class="p-world">${esc(p.what)}</div>`               : ''}
              ${p.current_project ? `<div class="p-building">${esc(p.current_project)}</div>` : ''}
              ${p.contact         ? `<div class="p-contact">${esc(p.contact)}</div>`          : ''}
            </div>`).join('')
        : '<div class="p-empty">No one signed in yet.</div>';
    } catch {
      document.getElementById('room-count').textContent = 'Could not load.';
    }
  }

  function getSunday() {
    const d = new Date(), s = new Date(d);
    s.setDate(d.getDate() - d.getDay());
    return s.toISOString().split('T')[0];
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
