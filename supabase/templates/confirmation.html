<!doctype html>
<html>
<body style="margin:0;padding:0;background:#e8e3d9;color:#161916;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#e8e3d9;">
    <tr>
      <td align="center" style="padding:36px 20px 44px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
          <tr>
            <td style="padding:0 0 24px;border-bottom:1px solid rgba(22,25,22,.22);">
              <img src="https://speedandform.com/assets/brand/kit/emblem/sf-emblem-ink.png" width="92" alt="Speed &amp; Form" style="display:block;width:92px;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:42px 0 0;font-family:Arial,Helvetica,sans-serif;">
              <div style="font-family:'Courier New',Courier,monospace;font-size:11px;line-height:18px;letter-spacing:1px;color:#5e625b;">PRIVATE ACCESS</div>
              <h1 style="margin:18px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:42px;line-height:44px;font-weight:500;letter-spacing:-1.8px;color:#161916;">Confirm your email.</h1>
              <p style="margin:20px 0 0;max-width:460px;font-size:17px;line-height:27px;color:#5e625b;">Confirm this address to finish connecting it to FORM.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:30px;">
                <tr>
                  <td bgcolor="#161916" style="background:#161916;">
                    <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:15px 21px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#f1ede4;text-decoration:none;">Confirm email</a>
                  </td>
                </tr>
              </table>
              <p style="margin:30px 0 0;padding-top:22px;border-top:1px solid rgba(22,25,22,.22);font-family:'Courier New',Courier,monospace;font-size:11px;line-height:18px;color:#5e625b;">This link works once and expires shortly. If you did not request it, you can ignore this email.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
