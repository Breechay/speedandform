<!-- Speed & Form sign-in email · Nov 18 2026: the code first (the app asks for six digits), one tap to sign in on this phone second. Night, sans, no serif or typewriter type. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Your Speed &amp; Form code</title>
<style>
  :root { color-scheme: dark; supported-color-schemes: dark; }
  body { margin:0; padding:0; background:#0f1012; }
  a { color:#f2f0ec; }
</style>
</head>
<body style="margin:0;padding:0;background:#0f1012;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;line-height:1px;font-size:1px;">{{ .Token }} is your Speed &amp; Form code. It works once.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f1012" style="width:100%;margin:0;padding:0;background:#0f1012;">
  <tr>
    <td align="center" style="padding:44px 24px 48px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:520px;">
        <tr>
          <td style="padding:0 0 40px;">
            <img src="https://speedandform.com/assets/brand/kit/emblem/sf-emblem-bone.png" width="64" alt="Speed &amp; Form" style="display:block;width:64px;height:auto;border:0;outline:none;text-decoration:none;">
          </td>
        </tr>
        <tr>
          <td style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;color:#f2f0ec;">
            <div style="font-size:11px;line-height:16px;font-weight:600;letter-spacing:2.4px;color:#8d8f93;">YOUR CODE</div>
            <div style="margin-top:14px;font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace;font-size:44px;line-height:52px;font-weight:500;letter-spacing:10px;color:#ffffff;">{{ .Token }}</div>
            <div style="margin-top:16px;font-size:17px;line-height:26px;color:#c9c8c4;">Type it in FORM to sign in. It works once.</div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:36px;">
              <tr>
                <td bgcolor="#f2f0ec" style="background:#f2f0ec;border-radius:999px;">
                  <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:15px 26px;font-size:15px;line-height:20px;font-weight:600;color:#111214;text-decoration:none;border-radius:999px;">Sign in on this phone</a>
                </td>
              </tr>
            </table>
            <div style="margin-top:44px;height:1px;line-height:1px;font-size:1px;background:#26282b;">&nbsp;</div>
            <div style="margin-top:20px;font-size:13px;line-height:20px;color:#8d8f93;">Didn't ask for this? You can ignore it. Questions: <a href="mailto:support@speedandform.com" style="color:#c9c8c4;text-decoration:underline;">support@speedandform.com</a></div>
            <div style="margin-top:18px;font-size:11px;line-height:16px;font-weight:600;letter-spacing:2.4px;color:#5c5e62;">SPEED &amp; FORM · MIAMI</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
