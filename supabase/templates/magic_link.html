<!-- FORM sign-in link · Graphite.
     Email clients strip <style> and CSS variables, so every rule is inline and
     the layout is tables. Colours are the Graphite tokens written literally. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0;padding:0;background:#141718;">
  <tr>
    <td align="center" style="padding:56px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:392px;">

        <tr>
          <td align="center" style="padding-bottom:26px;">
            <span style="font-family:Georgia,'Times New Roman',serif;font-size:31px;letter-spacing:.3em;text-indent:.3em;color:#d8ff68;">FORM</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:34px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td style="width:26px;height:1px;background:#3b4346;font-size:0;line-height:0;">&nbsp;</td>
            </tr></table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#a8b0b2;">
            Your record is one tap away.
          </td>
        </tr>

        <tr>
          <td align="center" style="padding-bottom:26px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td align="center" style="border-radius:10px;background:#d8ff68;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;padding:15px 30px;border-radius:10px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;color:#11150f;text-decoration:none;">
                  Open my record &rarr;
                </a>
              </td>
            </tr></table>
          </td>
        </tr>

        <tr>
          <td align="center" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7f898c;">
            This link expires shortly and works once.<br>
            If you did not ask for it, ignore this email.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
