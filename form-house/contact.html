<script>(function(){"use strict";var BRICE="brice@speedandform.com",form=document.getElementById("house-form"),send=document.getElementById("send"),status=document.getElementById("status");function esc(s){return String(s).replace(/[<>&"]/g,"")}function fallback(d){var b=["Name: "+d.name,"Email: "+d.email,"",d.message].filter(Boolean).join("\n");var href="mailto:"+BRICE+"?subject="+encodeURIComponent("FORM House · "+d.name)+"&body="+encodeURIComponent(b);status.innerHTML='It did not send. <a href="'+href+'">Send it as an email instead</a>.';send.disabled=false;send.textContent="Try again →"}form.addEventListener("submit",function(e){e.preventDefault();if(form._honey.value)return;var d={name:form.name.value.trim(),email:form.email.value.trim(),message:form.message.value.trim()};if(!d.name||!d.email||!d.message||!form.email.checkValidity()){status.textContent="Add your name, a valid email and a message.";return}send.disabled=true;send.textContent="Sending…";status.textContent="";var fd=new FormData();fd.append("_subject","FORM House · "+d.name);fd.append("_template","table");fd.append("_captcha","false");fd.append("_replyto",d.email);fd.append("Name",d.name);fd.append("Email",d.email);fd.append("Message",d.message);fd.append("Page",location.href);fetch("https://formsubmit.co/ajax/"+encodeURIComponent(send.getAttribute("data-send-to")||BRICE),{method:"POST",body:fd,headers:{Accept:"application/json"}}).then(function(r){return r.json()}).then(function(j){if(String(j&&j.success)!=="true")return fallback(d);form.innerHTML='<div class="done"><h2>Sent.</h2><p>It went straight to Brice. He will reply to '+esc(d.email)+'.</p></div>'}).catch(function(){fallback(d)})})})();</script></body></html>
