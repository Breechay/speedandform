<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Run with FORM | Speed &amp; Form</title>
<meta name="description" content="Brice's running practice in Miami. Tuesdays and Thursdays at Flamingo Park, and the FORM app.">
<link rel="canonical" href="https://speedandform.com/run">
<meta name="theme-color" content="#F2EFE8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preload" as="font" type="font/woff2" href="/assets/site/fonts/inter-tight-latin-variable.woff2" crossorigin>
<style>
@font-face{font-family:"Inter Tight";src:url(/assets/site/fonts/inter-tight-latin-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F2EFE8;color:#121314;font-family:"Inter Tight",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;min-height:100svh}
.hero{position:relative;overflow:hidden;height:max(150px,calc(100svh - 440px));max-height:62svh;background:url(/assets/run/track-group-bw.webp) center 35%/cover}
.hero:after{content:none}
.body{padding:26px 28px 40px;position:relative}
.mark{display:block;width:64px;height:27px;background:#121314;-webkit-mask:url(/assets/brand/sf-seal.svg) left center/contain no-repeat;mask:url(/assets/brand/sf-seal.svg) left center/contain no-repeat}
@media (prefers-reduced-motion:no-preference){.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}.r1{animation-delay:.05s}.r2{animation-delay:.12s}.r3{animation-delay:.19s}.r4{animation-delay:.28s}.r5{animation-delay:.38s}@keyframes rise{from{opacity:0;transform:translateY(10px)}}.hero{animation:settle 1.4s ease-out both}@keyframes settle{from{transform:scale(1.04)}}}
h1{font:500 34px/1.08 "Inter Tight",sans-serif;letter-spacing:-.02em;color:#121314;margin-top:14px}
.lead{font:400 16px/1.4 "Inter Tight",sans-serif;color:#4E4D49;margin-top:8px}
.runs{margin-top:26px;border-top:.5px solid #DAD6CD}
.row{display:grid;grid-template-columns:48px 1fr;padding:14px 0;border-bottom:.5px solid #DAD6CD;font-size:16px;line-height:1.3}
.row b{font-weight:500;color:#3E6A8E;font-size:13px;letter-spacing:.08em;padding-top:2px}
.row em{font-style:normal;color:#6E6C67;font-size:14px;display:block;margin-top:3px}
.row.off span{color:#8c8a84}
.cta{display:flex;gap:12px;margin-top:26px}
.cta a{flex:1;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font:600 16px/1 "Inter Tight",sans-serif;text-decoration:none}
.text{background:#121314;color:#F2EFE8}
.save{flex:0 0 150px!important;border:1px solid #C9C5BC;color:#121314;font-weight:500!important}
.app{display:block;text-align:center;margin-top:18px;color:#3E6A8E;font:500 15px/1 "Inter Tight",sans-serif;text-decoration:none}
footer{margin-top:40px;font-size:12px;color:#8C8A84;text-align:center}
footer a{color:#6E6C67;text-decoration:none}
@media (max-height:620px){.body{padding-top:18px}h1{font-size:30px;margin-top:10px}.lead{margin-top:6px}.runs{margin-top:18px}.row{padding:10px 0}.app{margin-top:14px}}
</style>
</head>
<body>
<main>
 <div class="hero" role="img" aria-label="FORM runners on the Flamingo Park track"></div>
 <div class="body">
  <span class="mark rise r1" role="img" aria-label="Speed and Form"></span>
  <h1 class="rise r2">Train with direction.</h1>
  <p class="lead rise r3">Brice's running practice. Miami and online.</p>
  <div class="runs rise r4">
   <div class="row" id="tue"><b>TUE</b><span>Tuesdays · 6:15 AM · Flamingo Park<em>From Dec 8. Open to all.</em></span></div>
   <div class="row" id="thu"><b>THU</b><span>Thursdays · 6:15 AM · Flamingo Park<em>Speed with the group. Open to all.</em></span></div>
  </div>
  <div class="cta rise r5"><a class="text" id="text" href="#">Text Brice</a><a class="save" href="/run/brice.vcf">Save contact</a></div>
  <a class="app" id="app" href="https://apps.apple.com/us/app/form-practice/id6761313085">Get the app ›</a>
  <footer><a href="/">speedandform.com</a></footer>
 </div>
</main>
<script>
/* One place to edit. SECOND_LINE: the number Text Brice opens, with country code. OFF: set a day to a message to override it, e.g. OFF.tue = "No run this Tuesday." */
var SECOND_LINE = "+19144260409";
var OFF = { tue: "", thu: "" };
var LINES = {
  shirt: "Hi Brice, saw your shirt at the track.",
  flyer: "Hi Brice, got your flyer.",
  card:  "Hi Brice, you gave me your card.",
  ig:    "Hi Brice, found you on Instagram.",
  "":    "Hi Brice, found FORM at the track."
};
(function(){
  var src = (new URLSearchParams(location.search).get("src") || "").toLowerCase().replace(/[^a-z]/g, "");
  if (!(src in LINES)) src = "";
  var t = document.getElementById("text");
  if (SECOND_LINE) { t.href = "sms:" + SECOND_LINE + "&body=" + encodeURIComponent(LINES[src]); }
  else { t.style.display = "none"; }
  var app = document.getElementById("app");
  if (src) app.href += "?ct=" + src;
  ["tue", "thu"].forEach(function(d){
    if (OFF[d]) { var r = document.getElementById(d); r.classList.add("off"); r.querySelector("span").textContent = OFF[d]; }
  });
})();
</script>
</body>
</html>
