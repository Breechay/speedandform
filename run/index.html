<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Run with FORM | Speed &amp; Form</title>
<meta name="description" content="Brice's running practice in Miami. Thursdays at Flamingo Park, Saturday long runs, and the FORM app.">
<link rel="canonical" href="https://speedandform.com/run">
<meta name="theme-color" content="#0a0b0c">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preload" as="font" type="font/woff2" href="/assets/site/fonts/inter-tight-latin-variable.woff2" crossorigin>
<style>
@font-face{font-family:"Inter Tight";src:url(/assets/site/fonts/inter-tight-latin-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0b0c;color:#d9d6cf;font-family:"Inter Tight",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;min-height:100svh}
.hero{position:relative;height:58svh;min-height:360px;background:url(/assets/run/track-group-bw.webp) center 35%/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,12,0) 45%,#0a0b0c 100%)}
.body{padding:0 28px 40px;margin-top:-64px;position:relative}
.mark{font:700 italic 15px/1 "Inter Tight",sans-serif;letter-spacing:.02em}
h1{font:500 34px/1.08 "Inter Tight",sans-serif;letter-spacing:-.02em;color:#f1eee8;margin-top:14px}
.lead{font:400 16px/1.4 "Inter Tight",sans-serif;color:#9a978f;margin-top:8px}
.runs{margin-top:26px;border-top:.5px solid #2a2c2f}
.row{display:grid;grid-template-columns:48px 1fr;padding:14px 0;border-bottom:.5px solid #2a2c2f;font-size:16px;line-height:1.3}
.row b{font-weight:500;color:#89afeb;font-size:13px;letter-spacing:.08em;padding-top:2px}
.row em{font-style:normal;color:#8c8a84;font-size:14px;display:block;margin-top:3px}
.row.off span{color:#8c8a84}
.cta{display:flex;gap:12px;margin-top:26px}
.cta a{flex:1;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font:600 16px/1 "Inter Tight",sans-serif;text-decoration:none}
.text{background:#e9e5dd;color:#121314}
.save{flex:0 0 150px!important;border:1px solid #3a3d41;color:#d9d6cf;font-weight:500!important}
.app{display:block;text-align:center;margin-top:18px;color:#89afeb;font:500 15px/1 "Inter Tight",sans-serif;text-decoration:none}
footer{margin-top:40px;font-size:12px;color:#5e5c57;text-align:center}
footer a{color:#8c8a84;text-decoration:none}
</style>
</head>
<body>
<main>
 <div class="hero" role="img" aria-label="FORM runners on the Flamingo Park track"></div>
 <div class="body">
  <div class="mark">SF&nbsp; FORM</div>
  <h1>Train with direction.</h1>
  <p class="lead">Brice's running practice. Miami and online.</p>
  <div class="runs">
   <div class="row" id="thu"><b>THU</b><span>Thursdays · 6:00 AM · Flamingo Park<em>Speed with the group. Open to all.</em></span></div>
   <div class="row" id="sat"><b>SAT</b><span>Saturdays · Long run · The Labs<em>Easy miles, every pace.</em></span></div>
  </div>
  <div class="cta"><a class="text" id="text" href="#">Text Brice</a><a class="save" href="/run/brice.vcf">Save contact</a></div>
  <a class="app" id="app" href="https://apps.apple.com/us/app/form-practice/id6761313085">Get the app ›</a>
  <footer><a href="/">speedandform.com</a></footer>
 </div>
</main>
<script>
/* One place to edit. SECOND_LINE: the number Text Brice opens, with country code. OFF: set a day to a message to override it, e.g. OFF.thu = "No run this Thursday." */
var SECOND_LINE = "+19144260409";
var OFF = { thu: "", sat: "" };
var LINES = {
  shirt: "Hi Brice, saw your shirt at the track.",
  flyer: "Hi Brice, got your flyer.",
  card:  "Hi Brice, you gave me your card.",
  ig:    "Hi Brice, found you on Instagram.",
  "":    "Hi Brice, found FORM at the track."
};
(function(){
  var src = (new URLSearchParams(location.search).get("src") || "").toLowerCase().replace(/[^a-z]/g, "");
  if (!(src in LINES)) src = "";
  var t = document.getElementById("text");
  if (SECOND_LINE) { t.href = "sms:" + SECOND_LINE + "&body=" + encodeURIComponent(LINES[src]); }
  else { t.style.display = "none"; }
  var app = document.getElementById("app");
  if (src) app.href += "?ct=" + src;
  ["thu", "sat"].forEach(function(d){
    if (OFF[d]) { var r = document.getElementById(d); r.classList.add("off"); r.querySelector("span").textContent = OFF[d]; }
  });
})();
</script>
</body>
</html>
