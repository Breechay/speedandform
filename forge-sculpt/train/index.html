<script defer src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#090908;--bg-2:#0E0E0C;--surface:#10100E;--surface-2:#151512;--surface-3:#1A1916;
  --text:#F0ECE3;--text-2:rgba(240,236,227,.72);--text-3:rgba(240,236,227,.48);--text-4:rgba(240,236,227,.29);
  --line:rgba(240,236,227,.13);--line-2:rgba(240,236,227,.07);--line-strong:rgba(201,167,104,.38);
  --accent:#C9A768;--accent-2:#B08D4F;--accent-dim:rgba(176,141,79,.34);--accent-soft:rgba(201,167,104,.105);
  --btn-fill:#EEE8DC;--btn-text:#0A0A09;--nav-bg:rgba(9,9,8,.84);
  --panel-shadow:0 26px 70px rgba(0,0,0,.24);--panel-glow:inset 0 1px rgba(255,255,255,.025);
  --dot-ring:rgba(201,167,104,.17);--paper-grain:.035;
}
[data-theme="light"]{
  --bg:#F2EEE6;--bg-2:#EDE7DD;--surface:#F9F6F0;--surface-2:#F3EEE5;--surface-3:#EAE2D6;
  --text:#19150F;--text-2:rgba(25,21,15,.72);--text-3:rgba(25,21,15,.50);--text-4:rgba(25,21,15,.32);
  --line:rgba(62,48,31,.15);--line-2:rgba(62,48,31,.08);--line-strong:rgba(140,96,41,.34);
  --accent:#8C6029;--accent-2:#8C6029;--accent-dim:rgba(140,96,41,.25);--accent-soft:rgba(140,96,41,.075);
  --btn-fill:#1B1711;--btn-text:#F8F4EC;--nav-bg:rgba(242,238,230,.88);
  --panel-shadow:0 18px 42px rgba(61,45,26,.07),0 2px 8px rgba(61,45,26,.045);--panel-glow:inset 0 1px rgba(255,255,255,.72);
  --dot-ring:rgba(140,96,41,.16);--paper-grain:.018;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg);overflow-x:hidden}
body{background:
  radial-gradient(circle at 78% 6%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 31rem),
  linear-gradient(180deg,var(--bg),var(--bg-2) 115%);
  color:var(--text-2);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;padding-bottom:118px;min-height:100vh;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;transition:background .2s var(--ease),color .2s var(--ease)}
:root{--sans:'Jost',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --maxw:840px;--homew:1180px;--pad:clamp(20px,5vw,48px);--ease:cubic-bezier(.22,.61,.36,1)}
h1,h2,h3{font-weight:400;letter-spacing:-.025em;line-height:1.04;color:var(--text)}
h1{font-size:clamp(52px,8vw,104px);letter-spacing:-.052em}
h2{font-size:clamp(30px,5.5vw,48px);letter-spacing:-.038em}
h3{font-size:clamp(20px,3vw,26px)}
.serif{font-family:var(--serif);font-style:italic;letter-spacing:-.01em}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3)}
a{color:inherit;text-decoration:none}.hide{display:none!important}
.dark-only{display:initial}.light-only{display:none}
[data-theme="light"] .dark-only{display:none}[data-theme="light"] .light-only{display:initial}

/* chrome */
.nav{position:sticky;top:0;z-index:50;background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.12);border-bottom:1px solid var(--line-2)}
.nav-in{max-width:var(--homew);margin:0 auto;padding:0 var(--pad);height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.wordmark{font-family:var(--mono);font-size:13px;letter-spacing:.36em;color:var(--text);cursor:pointer;font-weight:500;background:none;border:none;min-height:44px;display:inline-flex;align-items:center;gap:10px}
/* The mark inherits --text via currentColor, so it inverts with the theme by
   itself — bone on ink in dark, ink on bone in light. No second asset, no
   dark-only/light-only pair to keep in sync. Never gold: gold marks crossings
   and seals, and a wordmark is neither. */
.anvil{height:11px;width:auto;flex:0 0 auto;margin-top:-1px}
.nav-right{display:flex;align-items:center;gap:7px}
.nav-link{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);padding:9px 12px;min-height:44px;display:inline-flex;align-items:center;cursor:pointer;transition:color .2s}
.nav-link:hover{color:var(--text)}.nav-link.active{color:var(--accent)}
.theme{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--text-2);
  background:color-mix(in srgb,var(--surface) 42%,transparent);border:1px solid var(--line);padding:10px 15px;min-height:44px;border-radius:999px;cursor:pointer;transition:.2s;margin-left:2px}
.theme:hover{border-color:var(--line-strong);color:var(--text);transform:translateY(-1px)}.theme .ic{font-size:11px;line-height:1}
.subnav{max-width:var(--maxw);margin:0 auto;padding:10px var(--pad);display:flex;align-items:center;gap:14px;border-top:1px solid var(--line-2)}
.subnav.hide{display:none}
.back{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);display:inline-flex;align-items:center;gap:7px;min-height:44px;cursor:pointer;background:none;border:none;transition:color .2s;padding:0 8px}
.back:hover{color:var(--text)}
.crumb{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-4)}
main{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) 48px;transition:max-width .2s var(--ease)}
main.portal-home{max-width:var(--homew)}
.stack>*+*{margin-top:var(--gap,18px)}
.lede{font-size:clamp(17px,2.2vw,21px);color:var(--text-2);line-height:1.58;max-width:670px}
.muted{color:var(--text-3);font-size:13px}
.fadein{animation:f .48s var(--ease)}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.execution .fadein{animation-duration:.2s}

/* home hero */
.hero{position:relative;padding:clamp(42px,7vw,88px) 0 26px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(260px,.78fr);gap:clamp(20px,5vw,72px);align-items:center;min-height:500px}
.hero-copy{position:relative;z-index:2;padding-bottom:20px}.hero-copy .eyebrow{margin-bottom:18px}.hero-copy .lede{margin-top:26px}
.hero-art{position:relative;min-height:470px;display:flex;justify-content:center;align-items:flex-end;isolation:isolate}
.hero-art:before{content:"";position:absolute;inset:12% 6% 4%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 11%,transparent),transparent 68%);filter:blur(14px);z-index:-1;opacity:.55}
.hero-fig{width:auto;max-width:100%;object-fit:contain;object-position:bottom center}
.hero-fig.dark-only{display:block;max-height:520px;-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent 100%);mask-image:linear-gradient(to bottom,#000 78%,transparent 100%)}
.hero-fig.light-only{display:none;max-height:520px;opacity:1;filter:none;-webkit-mask-image:none;mask-image:none}
[data-theme="light"] .hero-fig.dark-only{display:none}[data-theme="light"] .hero-fig.light-only{display:block}
[data-theme="light"] .hero-art:before{background:radial-gradient(circle,rgba(140,96,41,.08),transparent 67%);filter:blur(8px);opacity:.7}

/* home composition */
.home-stack{display:grid;gap:16px;padding-bottom:12px}
.resume-rail,.program-panel,.account-panel,.launch-panel{position:relative;overflow:hidden;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:var(--panel-shadow),var(--panel-glow)}
.resume-rail{display:grid;grid-template-columns:50px minmax(0,1fr) auto;align-items:center;gap:20px;padding:22px 24px;border-color:var(--line-strong);cursor:pointer;transition:transform .22s,border-color .22s,background .22s}
.resume-rail:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,var(--accent-soft),transparent 52%);pointer-events:none}
.resume-rail:hover{transform:translateY(-2px);border-color:var(--accent)}
.resume-mark{position:relative;width:42px;height:42px;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--accent);font-family:var(--mono);font-size:17px}
.resume-copy{position:relative;min-width:0}.resume-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.resume-title{font-size:clamp(19px,2.3vw,27px);color:var(--text);letter-spacing:-.026em;line-height:1.18;margin-top:5px;overflow-wrap:anywhere}
.resume-action{position:relative;display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.resume-arrow{font-size:19px;transition:transform .2s}.resume-rail:hover .resume-arrow{transform:translateX(4px)}

.program-panel{padding:clamp(24px,4vw,38px);display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,.72fr);gap:clamp(30px,5vw,70px);align-items:stretch}
.program-panel:after{content:"";position:absolute;right:-7%;bottom:-35%;width:52%;aspect-ratio:1;border:1px solid var(--line-2);border-radius:50%;box-shadow:0 0 0 28px var(--line-2),0 0 0 66px color-mix(in srgb,var(--line-2) 65%,transparent);opacity:.35;pointer-events:none}
.program-copy,.program-map{position:relative;z-index:1}
.program-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.program-title{font-size:clamp(30px,4vw,46px);color:var(--text);letter-spacing:-.038em;line-height:1.02}
.program-summary{margin-top:12px;color:var(--text-3);font-size:15px;max-width:470px}
.program-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.metric{padding:16px 12px 16px 0}.metric+.metric{border-left:1px solid var(--line);padding-left:18px}
.metric b{font-family:var(--mono);font-size:18px;font-weight:400;color:var(--text);display:block}.metric span{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-4);display:block;margin-top:3px}
.program-link{display:inline-flex;align-items:center;gap:10px;margin-top:22px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.program-map{border-left:1px solid var(--line);padding-left:clamp(24px,4vw,42px);display:flex;flex-direction:column;justify-content:center}
.phase-track{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-bottom:24px}.phase-track:before{content:"";position:absolute;top:9px;left:9px;right:9px;height:1px;background:var(--line)}
.phase-step{position:relative;z-index:1}.phase-step span{width:19px;height:19px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:7px;color:var(--text-4)}
.phase-step.done span{border-color:var(--accent-dim);background:var(--accent-soft);color:var(--accent)}.phase-step.current span{border-color:var(--accent);background:var(--accent);color:var(--btn-text);box-shadow:0 0 0 5px var(--dot-ring)}
.map-label{font-family:var(--mono);font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}
.map-title{font-size:24px;color:var(--text);margin-top:6px;letter-spacing:-.025em}.map-weeks{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-4);margin-top:5px}

.launch-panel{padding:22px 24px;display:grid;grid-template-columns:minmax(260px,.8fr) minmax(380px,1.2fr);gap:28px;align-items:center}
.launch-panel h3{font-size:21px;color:var(--text)}.launch-panel p{font-size:14px;color:var(--text-3);margin-top:5px;line-height:1.5}
.launch-panel .signup-row{margin-top:0;display:grid;grid-template-columns:1fr auto;gap:10px}.launch-panel .signup-done{grid-column:1/-1}
.account-panel{padding:22px 24px;display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:28px;align-items:center}
.account-panel h3{font-size:21px;color:var(--text)}.account-panel p{font-size:14px;color:var(--text-3);margin-top:5px;line-height:1.5;max-width:600px}
.account-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}.account-status{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);text-align:right}
.local-claim{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.local-claim .claim-facts{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);margin-top:5px}
.apple-wrap{min-width:220px}.apple-wrap #appleid-signin{width:220px;height:46px}.apple-error{margin-top:7px;text-align:center}
.signup{background:var(--surface);border:1px solid var(--line);padding:24px;margin-top:26px;box-shadow:var(--panel-shadow)}
.signup h3{font-size:20px;color:var(--text)}.signup p{font-size:14px;color:var(--text-3);margin-top:6px;line-height:1.5}
.signup-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.signup input{flex:1;min-width:180px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:var(--sans);font-size:14px;padding:14px 15px;border-radius:0;transition:border-color .2s,background .2s}
.signup input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.signup .btn{width:auto;flex:none}.signup-done{color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.ext{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);display:inline-flex;gap:7px;align-items:center}.ext:hover{color:var(--text)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:11px;font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;background:var(--btn-fill);color:var(--btn-text);padding:15px 22px;border-radius:0;border:1px solid var(--btn-fill);cursor:pointer;transition:.2s;width:100%}
.btn:hover{transform:translateY(-1px);filter:brightness(.96)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn-ghost{background:transparent;color:var(--text-2);border-color:var(--line)}.btn-ghost:hover{background:transparent;color:var(--text);border-color:var(--line-strong)}

/* program navigation */
.phase{display:grid;grid-template-columns:72px 1fr auto;gap:20px;align-items:center;padding:22px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .22s,padding .22s}
.phase:first-child{border-top:1px solid var(--line)}.phase:hover{background:var(--accent-soft);padding-left:20px;padding-right:20px}
.phase.locked{cursor:default;opacity:.55}.phase.locked:hover{background:transparent;padding-left:14px;padding-right:14px}
.p-art{width:66px;height:78px;display:flex;align-items:center;justify-content:center}.p-art img{width:100%;height:100%;object-fit:contain;object-position:center;-webkit-mask-image:radial-gradient(ellipse at center,#000 67%,transparent 97%);mask-image:radial-gradient(ellipse at center,#000 67%,transparent 97%)}
.p-art.crop img{opacity:.68}.p-num{font-family:var(--serif);font-style:italic;font-size:42px;color:var(--accent);line-height:1}
.phase .pt{font-size:21px;color:var(--text);letter-spacing:-.02em;display:flex;align-items:center;gap:9px}.phase .ps{font-size:13px;color:var(--text-3);margin-top:3px}
.phase .pw{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-4);text-align:right;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.dot.done{background:var(--accent-2)}.dot.now{background:var(--accent);box-shadow:0 0 0 4px var(--dot-ring)}.dot.next{background:var(--line)}

.wkrail{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:8px}.wk{background:var(--surface);border:1px solid var(--line);padding:18px;cursor:pointer;transition:border-color .22s,transform .2s,background .2s;box-shadow:var(--panel-glow);position:relative;min-height:126px}
.wk:hover{border-color:var(--line-strong);transform:translateY(-2px);background:var(--surface-2)}.wk .wn{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3)}.wk .wt{font-size:16px;color:var(--text);margin-top:10px;line-height:1.3}.wk .ws{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:12px;color:var(--accent)}.wk .check{position:absolute;top:14px;right:14px;color:var(--accent);font-size:12px}
.readbox{background:var(--accent-soft);border-left:2px solid var(--accent);padding:16px 18px;font-size:14.5px;color:var(--text-2);line-height:1.5}
.sess{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:16px;padding:18px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .22s,padding .22s}.sess:first-child{border-top:1px solid var(--line)}.sess:hover{background:var(--accent-soft);padding-left:18px}.sess.rest{opacity:.43;cursor:default}.sess.rest:hover{background:transparent;padding-left:12px}.sess .sd{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}.sess .sn{font-size:18px;color:var(--text);letter-spacing:-.015em}.sess .sg{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-4);margin-top:3px}
.tag{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--text-3);white-space:nowrap}.tag.next{border-color:var(--accent-dim);color:var(--accent)}.tag.done{border-color:transparent;color:var(--text-4)}

/* session sheet */
.sheet-head{display:flex;align-items:center;gap:18px;margin-top:6px}.chapter{width:66px;height:66px;flex:none;display:flex;align-items:center;justify-content:center}.chapter img{width:100%;height:100%;object-fit:contain;-webkit-mask-image:radial-gradient(circle,#000 67%,transparent 96%);mask-image:radial-gradient(circle,#000 67%,transparent 96%)}
.statrow{display:flex;gap:0;margin-top:24px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.stat{padding:15px 26px 15px 0}.stat+.stat{border-left:1px solid var(--line);padding-left:26px}.stat b{font-family:var(--mono);font-size:21px;color:var(--text);font-weight:400;display:block}.stat span{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-4)}
.keylifts{margin-top:17px;font-size:13.5px;color:var(--text-3)}.keylifts b{color:var(--accent);font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;display:block;margin-bottom:5px}
.ex{border-bottom:1px solid var(--line);padding:23px 0}.ex.prime{position:relative;background:linear-gradient(90deg,var(--accent-soft),transparent 78%);margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);border-bottom:1px solid var(--line)}.ex.prime:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}

/* ---- data: single source of truth is ./data/forge-portal-programs.json ---- */

function stableStringify(value){if(Array.isArray(value))return`[${value.map(stableStringify).join(',')}]`;if(value&&typeof value==='object')return`{${Object.keys(value).sort().map(key=>`${JSON.stringify(key)}:${stableStringify(value[key])}`).join(',')}}`;return JSON.stringify(value);}
async function contentHash(value){const bytes=new TextEncoder().encode(stableStringify(value));const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');}
function adaptSet(item,exerciseId,index){return{id:`${exerciseId}:set-${index+1}`,sequence:index+1,reps:item.reps||null,seconds:item.seconds??null,targetWeightPounds:item.targetWeightPounds??null,rir:item.rir||null};}
function adaptEx(e,sessionVersion,prescriptionHash,exerciseIndex){
  const exerciseId=`${sessionVersion}:${prescriptionHash.slice(0,12)}:movement-${exerciseIndex+1}:${e.movementId||'unknown'}`;
  const sets=(e.sets||[]).map((item,index)=>adaptSet(item,exerciseId,index));
  const o={id:exerciseId,mid:e.movementId||'',n:e.name,rest:e.restSeconds||0,prime:!!e.isPrimeMover,intent:e.movementIntent,lat:e.laterality,cue:e.cue||'',sc:sets.length,sets};
  const s0=sets[0]||{};if(s0.reps&&typeof s0.reps==='object'){o.rmin=s0.reps.min;o.rmax=s0.reps.max;}else if(s0.seconds!=null){o.sec=s0.seconds;}if(s0.targetWeightPounds!=null)o.load=s0.targetWeightPounds;

function adaptDay(s,programId,programVersion,prescriptionHash){const sessionVersion=`${programVersion}:${s.id}`;return{id:s.id||'',version:sessionVersion,programId,programVersion,prescriptionHash,t:s.title,wd:s.weekday,kind:s.kind,fin:!!s.isFinishDay,ex:(s.exercises||[]).map((exercise,index)=>adaptEx(exercise,sessionVersion,prescriptionHash,index))};}
function adaptWeeks(weeks,programId,programVersion,prescriptionHash){return(weeks||[]).map(w=>({num:w.weekNumber,label:w.label||'',days:(w.days||[]).map(day=>adaptDay(day,programId,programVersion,prescriptionHash))}));}
const EXPECTED_COUNTS={forge_sculpt:[15,90,519,1520],rod:[6,12,72,252]};
const FORBIDDEN_TERMS=['tibia','accountability','alcohol','medication','waist','protein','judgment','mania','depression'];
function programCounts(parts){let weeks=0,sessions=0,exercises=0,sets=0;parts.forEach(part=>(part.weeks||[]).forEach(w=>{weeks++;(w.days||[]).forEach(d=>{if(d.kind==='rest'){if((d.exercises||[]).length)throw new Error('rest day contains exercises');return;}if(!(d.exercises||[]).length)throw new Error('training day has no exercises');sessions++;exercises+=d.exercises.length;d.exercises.forEach(e=>{if(!e.id&&!e.movementId)throw new Error('exercise identity missing');if(!(e.sets||[]).length)throw new Error('exercise prescription missing');sets+=e.sets.length;});});}));return[weeks,sessions,exercises,sets];}
function validatePortalData(raw){
  if(!raw||raw.schemaVersion!=='1.0.0'||!Array.isArray(raw.programs))throw new Error('unsupported portal data');
  const byId=Object.fromEntries(raw.programs.map(p=>[p.id,p]));
  if(raw.programs.length!==2||!byId.forge_sculpt||!byId.rod)throw new Error('program allowlist mismatch');
  if(byId.forge_sculpt.kind!=='phased'||byId.forge_sculpt.phases.length!==4)throw new Error('Forge Sculpt phase mismatch');
  if(byId.rod.kind!=='weekly')throw new Error('Rod program shape mismatch');
  const sculptCounts=programCounts(byId.forge_sculpt.phases),rodCounts=programCounts([byId.rod]);
  if(sculptCounts.some((n,i)=>n!==EXPECTED_COUNTS.forge_sculpt[i]))throw new Error('Forge Sculpt census mismatch');
  if(rodCounts.some((n,i)=>n!==EXPECTED_COUNTS.rod[i]))throw new Error('Rod census mismatch');
  const serialized=JSON.stringify(raw).toLowerCase();
  FORBIDDEN_TERMS.forEach(term=>{if(new RegExp(`\\b${term}\\b`,'i').test(serialized))throw new Error(`forbidden term: ${term}`);});
  return byId;

async function buildData(raw){
  const byId=validatePortalData(raw),fr=byId.forge_sculpt;
  const phases=await Promise.all(fr.phases.map(async ph=>{const prescriptionHash=await contentHash(ph);return{n:ph.phaseNumber,version:ph.programId,prescriptionHash,title:ph.displayName,sub:'',weeks:adaptWeeks(ph.weeks,fr.id,ph.programId,prescriptionHash)}}));
  const fs={id:'forge_sculpt',name:fr.displayName,phases};
  const rr=byId.rod,rodHash=await contentHash(rr),rod={id:'rod',version:ROD_PROGRAM_VERSION,prescriptionHash:rodHash,name:rr.displayName,weeks:adaptWeeks(rr.weeks,rr.id,ROD_PROGRAM_VERSION,rodHash)};
  return{programs:{forge_sculpt:fs,rod}};
}

/* ---- durable local continuity ---- */
const defaultState=()=>({storageRevision:0,done:{},sets:{},sessions:{},email:null,mode:'session'});
let LEGACY_STATE=defaultState();
try{const value=localStorage.getItem('forge_portal_v2');if(value)LEGACY_STATE=Object.assign(defaultState(),JSON.parse(value));}catch(_){}
let STATE=defaultState(),LOCAL_DB=null,CURRENT_NAMESPACE=null,ANONYMOUS_STATE=defaultState(),LOCAL_SAVE_STATUS='notConfirmed',LOCAL_STORE_ERROR='';
let LOCAL_WRITE_CHAIN=Promise.resolve();
const NAMESPACE_REVISIONS=new Map();
function normalizedState(value){const state=Object.assign(defaultState(),value||{});if(!Number.isInteger(state.storageRevision))state.storageRevision=0;if(!state.done)state.done={};if(!state.sets)state.sets={};if(!state.sessions)state.sessions={};if(!state.mode)state.mode='session';return state;}
function queueLocalWrite(operation){const pending=LOCAL_WRITE_CHAIN.then(operation,operation);LOCAL_WRITE_CHAIN=pending.catch(()=>{});return pending;}
async function initContinuityStore(){
  try{
    LOCAL_DB=await ForgeContinuityStore.open();
    CURRENT_NAMESPACE=LOCAL_DB.anonymousNamespace();
    ANONYMOUS_STATE=normalizedState(await LOCAL_DB.migrateLegacyAnonymous(LEGACY_STATE));
    STATE=normalizedState(ANONYMOUS_STATE);
    NAMESPACE_REVISIONS.set(CURRENT_NAMESPACE,STATE.storageRevision);
    LOCAL_SAVE_STATUS='saved';
  }catch(error){
    LOCAL_STORE_ERROR='Training storage is unavailable on this browser.';
    STATE=normalizedState(LEGACY_STATE);
    console.error('[FORGE portal] continuity store unavailable:',error);
  }
}
async function activateUserNamespace(userId){
  if(!LOCAL_DB)return;
  const namespace=LOCAL_DB.userNamespace(userId);
  CURRENT_NAMESPACE=namespace;
  const snapshot=await LOCAL_DB.snapshot(namespace);
  if(CURRENT_NAMESPACE!==namespace)return;
  STATE=normalizedState(snapshot);
  NAMESPACE_REVISIONS.set(namespace,STATE.storageRevision);
  LOCAL_SAVE_STATUS='saved';
}
async function activateAnonymousNamespace(){
  if(!LOCAL_DB)return;
  const namespace=LOCAL_DB.anonymousNamespace();
  CURRENT_NAMESPACE=namespace;
  const snapshot=await LOCAL_DB.snapshot(namespace);
  if(CURRENT_NAMESPACE!==namespace)return;
  STATE=normalizedState(snapshot||ANONYMOUS_STATE);
  NAMESPACE_REVISIONS.set(namespace,STATE.storageRevision);
  LOCAL_SAVE_STATUS='saved';
}
function save(){
  if(!LOCAL_DB||!CURRENT_NAMESPACE){LOCAL_SAVE_STATUS='notConfirmed';return Promise.resolve(false);}
  const namespace=CURRENT_NAMESPACE;
  LOCAL_SAVE_STATUS='saving';
  const snapshot=normalizedState(JSON.parse(JSON.stringify(STATE)));
  return queueLocalWrite(()=>LOCAL_DB.saveSnapshot(namespace,snapshot)).then(committed=>{NAMESPACE_REVISIONS.set(namespace,committed.storageRevision);if(CURRENT_NAMESPACE===namespace){STATE.storageRevision=committed.storageRevision;LOCAL_SAVE_STATUS='saved';if(namespace===LOCAL_DB.anonymousNamespace()){ANONYMOUS_STATE=normalizedState(JSON.parse(JSON.stringify(STATE)));}}return true;}).catch(error=>{if(CURRENT_NAMESPACE===namespace){LOCAL_SAVE_STATUS='notConfirmed';LOCAL_STORE_ERROR='This change could not be confirmed on this device.';}console.error('[FORGE portal] local save failed:',error);return false;});
}
/* stable identity: program + session id; focus tick = session + movement + set */
const fsKey=(pn,day)=>`fs:p${pn}:${day.id}`;
const rodKey=(wn,day)=>`rod:w${wn}:${day.id}`;
const completionKey=(legacyKey,day)=>`${legacyKey}:${day.prescriptionHash}`;
function isSessionDone(legacyKey,day){const versioned=completionKey(legacyKey,day);return Object.prototype.hasOwnProperty.call(STATE.done,versioned)?!!STATE.done[versioned]:!!STATE.done[legacyKey];}
const legacySetKey=(dkey,ex,k)=>`${dkey}::${ex.mid}::${k}`;
const setKey=(dkey,ex,k)=>ex.sets?.[k-1]?.id||legacySetKey(dkey,ex,k);
const sessionStateKey=day=>`${day.version}:${day.prescriptionHash}`;
function migrateLegacySetKeys(){
  let changed=false;
  const migrateDay=(doneKey,day)=>{
    const versionedDone=completionKey(doneKey,day);
    if(Object.prototype.hasOwnProperty.call(STATE.done,doneKey)&&!Object.prototype.hasOwnProperty.call(STATE.done,versionedDone)){STATE.done[versionedDone]=STATE.done[doneKey];STATE.done[doneKey]=false;changed=true;}
    day.ex.forEach(ex=>{for(let k=1;k<=ex.sc;k++){const legacy=legacySetKey(doneKey,ex,k),stable=setKey(doneKey,ex,k);if(Object.prototype.hasOwnProperty.call(STATE.sets,legacy)&&!Object.prototype.hasOwnProperty.call(STATE.sets,stable)){STATE.sets[stable]=STATE.sets[legacy];delete STATE.sets[legacy];changed=true;}}});
  };
  FS.phases.forEach(ph=>ph.weeks.forEach(week=>week.days.filter(hasEx).forEach(day=>migrateDay(fsKey(ph.n,day),day))));
  ROD.weeks.forEach(week=>week.days.filter(hasEx).forEach(day=>migrateDay(rodKey(week.num,day),day)));
  return changed;
}
function importedFocusDraft(day,doneKey){
  const stateKey=sessionStateKey(day);
  let draft=STATE.sessions[stateKey];
  if(draft)return draft;
  draft=ForgeSessionModel.createFocusDraft(day,{id:crypto.randomUUID(),now:new Date()});
  day.ex.forEach(ex=>{for(let k=1;k<=ex.sc;k++){const setId=setKey(doneKey,ex,k);if(STATE.sets[setId])draft=ForgeSessionModel.confirmFocusSet(draft,setId,true,{now:new Date()});}});
  STATE.sessions[stateKey]=draft;
  return draft;
}
function adoptCommittedState(next){STATE=normalizedState(next);if(CURRENT_NAMESPACE)NAMESPACE_REVISIONS.set(CURRENT_NAMESPACE,STATE.storageRevision);if(LOCAL_DB&&CURRENT_NAMESPACE===LOCAL_DB.anonymousNamespace())ANONYMOUS_STATE=normalizedState(JSON.parse(JSON.stringify(STATE)));LOCAL_SAVE_STATUS='saved';}
async function commitFocusSet(day,doneKey,setId,confirmed){
  await LOCAL_WRITE_CHAIN;
  const stateKey=sessionStateKey(day),namespace=CURRENT_NAMESPACE;
  const current=importedFocusDraft(day,doneKey);
  const draft=ForgeSessionModel.confirmFocusSet(current,setId,confirmed,{now:new Date()});
  const next=normalizedState(JSON.parse(JSON.stringify(STATE)));
  next.sessions[stateKey]=draft;
  if(confirmed)next.sets[setId]=true;else delete next.sets[setId];
  const event={id:crypto.randomUUID(),type:confirmed?'set_checked':'set_unchecked',entityId:stateKey,payload:{draftId:draft.id,setId,prescriptionHash:day.prescriptionHash,truth:confirmed?'confirmedAsDisplayed':null,revision:draft.revision}};
  next.storageRevision=NAMESPACE_REVISIONS.get(namespace)??next.storageRevision;
  try{const committed=await queueLocalWrite(()=>LOCAL_DB.commitStateMutation(namespace,next,event));NAMESPACE_REVISIONS.set(namespace,committed.storageRevision);if(CURRENT_NAMESPACE===namespace)adoptCommittedState(committed);return true;}catch(error){if(CURRENT_NAMESPACE===namespace){try{const current=normalizedState(await LOCAL_DB.snapshot(namespace));adoptCommittedState(current);}catch(_){LOCAL_SAVE_STATUS='notConfirmed';}LOCAL_STORE_ERROR='This set could not be confirmed on this device.';}console.error('[FORGE portal] Focus set commit failed:',error);return false;}
}
async function closeOrReopenFocus(day,doneKey){
  await LOCAL_WRITE_CHAIN;
  const stateKey=sessionStateKey(day),doneStateKey=completionKey(doneKey,day),existing=STATE.sessions[stateKey],namespace=CURRENT_NAMESPACE;
  if(!existing&&isSessionDone(doneKey,day)){
    const next=normalizedState(JSON.parse(JSON.stringify(STATE)));
    next.done[doneStateKey]=false;
    next.done[doneKey]=false;
    let draft=ForgeSessionModel.createFocusDraft(day,{id:crypto.randomUUID(),now:new Date()});
    day.ex.forEach(ex=>{for(let k=1;k<=ex.sc;k++){const setId=setKey(doneKey,ex,k);if(next.sets[setId])draft=ForgeSessionModel.confirmFocusSet(draft,setId,true,{now:new Date()});}});
    next.sessions[stateKey]=draft;
    const event={id:crypto.randomUUID(),type:'session_reopened',entityId:stateKey,payload:{draftId:draft.id,prescriptionHash:day.prescriptionHash,source:'legacyLocalCompletion'}};
    next.storageRevision=NAMESPACE_REVISIONS.get(namespace)??next.storageRevision;
    const committed=await queueLocalWrite(()=>LOCAL_DB.commitStateMutation(namespace,next,event));NAMESPACE_REVISIONS.set(namespace,committed.storageRevision);if(CURRENT_NAMESPACE===namespace)adoptCommittedState(committed);return true;
  }
  const current=existing||importedFocusDraft(day,doneKey);
  const next=normalizedState(JSON.parse(JSON.stringify(STATE)));
  if(current.status==='completed'){
    const clientEventId=crypto.randomUUID();
    const reopened=ForgeSessionModel.reopenDraft(current,{clientEventId,now:new Date()});
    next.sessions[stateKey]=reopened.draft;next.done[doneStateKey]=false;
    next.storageRevision=NAMESPACE_REVISIONS.get(namespace)??next.storageRevision;
    const committed=await queueLocalWrite(()=>LOCAL_DB.commitStateMutation(namespace,next,{...reopened.event,entityId:stateKey,payload:{...reopened.event,prescriptionHash:day.prescriptionHash}}));
    next.storageRevision=committed.storageRevision;
  }else{
    const receiptId=crypto.randomUUID(),clientEventId=crypto.randomUUID();
    const completion=ForgeSessionModel.completeFocusDraft(current,{receiptId,clientEventId,now:new Date()});
    next.sessions[stateKey]=completion.draft;next.done[doneStateKey]=true;
    next.storageRevision=NAMESPACE_REVISIONS.get(namespace)??next.storageRevision;
    const committed=await queueLocalWrite(()=>LOCAL_DB.commitCompletion(namespace,next,completion.receipt,{id:clientEventId,type:'session_completed',entityId:stateKey,payload:{receiptId,prescriptionHash:day.prescriptionHash,revision:completion.draft.revision}}));
    next.storageRevision=committed.storageRevision;
  }
  NAMESPACE_REVISIONS.set(namespace,next.storageRevision);
  if(CURRENT_NAMESPACE===namespace)adoptCommittedState(next);return true;
}

/* ---- shared account identity (progress remains local during open preview) ---- */
let AUTH=null,ACCOUNT_USER=null,ACCOUNT_READY=false,ACCOUNT_BUSY=false,ACCOUNT_ERROR='';
let APPLE_TRANSACTION=null,APPLE_ERROR_NODE=null,APPLE_LISTENERS_INSTALLED=false;
function secureToken(){if(crypto.randomUUID)return crypto.randomUUID();const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');}
function installAppleListeners(){
  if(APPLE_LISTENERS_INSTALLED)return;
  document.addEventListener('AppleIDSignInOnSuccess',handleAppleSuccess);
  document.addEventListener('AppleIDSignInOnFailure',handleAppleFailure);
  APPLE_LISTENERS_INSTALLED=true;
}
async function initAccount(){
  if(!window.supabase||!window.AppleID){ACCOUNT_ERROR='Apple sign-in is unavailable right now.';return;}
  AUTH=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data,error}=await AUTH.auth.getSession();
  if(error){ACCOUNT_ERROR='Apple sign-in is unavailable right now.';return;}
  ACCOUNT_USER=data.session?.user||null;
  if(ACCOUNT_USER)await activateUserNamespace(ACCOUNT_USER.id);
  ACCOUNT_READY=true;
  installAppleListeners();
  AUTH.auth.onAuthStateChange((event,session)=>{if(event!=='SIGNED_IN'&&event!=='SIGNED_OUT')return;setTimeout(async()=>{ACCOUNT_USER=session?.user||null;if(ACCOUNT_USER)await activateUserNamespace(ACCOUNT_USER.id);else await activateAnonymousNamespace();const h=location.hash.replace(/^#/,'')||'/';if(h==='/')entry();else go('/');},0);});
}
function prepareAppleControl(errorNode){
  if(!AUTH||!window.AppleID||ACCOUNT_BUSY)return;
  ACCOUNT_ERROR='';APPLE_ERROR_NODE=errorNode;errorNode.textContent='';
  APPLE_TRANSACTION={nonce:secureToken(),state:secureToken()};
  AppleID.auth.init({clientId:APPLE_CLIENT_ID,scope:'name email',redirectURI:APPLE_REDIRECT_URI,state:APPLE_TRANSACTION.state,nonce:APPLE_TRANSACTION.nonce,usePopup:true});
  if(typeof AppleID.auth.renderButton==='function')AppleID.auth.renderButton();
}
async function handleAppleSuccess(event){
  if(!AUTH||!APPLE_TRANSACTION||ACCOUNT_BUSY)return;
  ACCOUNT_BUSY=true;ACCOUNT_ERROR='';
  try{
    const apple=event.detail||{};
    const authorization=apple.authorization||{};
    if(authorization.state!==APPLE_TRANSACTION.state)throw new Error('Apple state mismatch');
    const token=authorization.id_token||apple.id_token;
    if(!token)throw new Error('Apple identity token missing');
    const {data,error}=await AUTH.auth.signInWithIdToken({provider:'apple',token,nonce:APPLE_TRANSACTION.nonce});
    if(error)throw error;
    const person=apple?.user?.name;
    if(person&&(person.firstName||person.lastName)){
      const fullName=[person.firstName,person.middleName,person.lastName].filter(Boolean).join(' ');
      await AUTH.auth.updateUser({data:{full_name:fullName,given_name:person.firstName||null,family_name:person.lastName||null}});
    }
    ACCOUNT_USER=data.user;await activateUserNamespace(data.user.id);entry();
  }catch(error){
    ACCOUNT_ERROR="Couldn't connect with Apple. Try again.";
    if(APPLE_ERROR_NODE)APPLE_ERROR_NODE.textContent=ACCOUNT_ERROR;
  }finally{
    ACCOUNT_BUSY=false;APPLE_TRANSACTION=null;
    if(!ACCOUNT_USER&&document.getElementById('appleid-signin'))requestAnimationFrame(()=>prepareAppleControl(APPLE_ERROR_NODE));
  }
}
function handleAppleFailure(event){
  const reason=event?.detail?.error;
  if(reason!=='popup_closed_by_user'){
    ACCOUNT_ERROR="Couldn't connect with Apple. Try again.";
    if(APPLE_ERROR_NODE)APPLE_ERROR_NODE.textContent=ACCOUNT_ERROR;
  }
  APPLE_TRANSACTION=null;ACCOUNT_BUSY=false;
  if(document.getElementById('appleid-signin'))prepareAppleControl(APPLE_ERROR_NODE);
}
async function useAnonymousTrainingWhileSignedIn(){
  if(!LOCAL_DB||!ACCOUNT_USER)return;
  const userId=ACCOUNT_USER.id;
  try{
    const claimed=normalizedState(await LOCAL_DB.claimAnonymousLocally(userId));
    if(ACCOUNT_USER?.id!==userId)return;
    STATE=claimed;
    CURRENT_NAMESPACE=LOCAL_DB.userNamespace(userId);
    ANONYMOUS_STATE=defaultState();
    NAMESPACE_REVISIONS.set(CURRENT_NAMESPACE,STATE.storageRevision);
    NAMESPACE_REVISIONS.delete(LOCAL_DB.anonymousNamespace());
    if(migrateLegacySetKeys())await save();
    entry();
  }catch(error){
    ACCOUNT_ERROR=error?.message==='target_namespace_not_empty'?'Training already exists for this account on this device.':'This device training could not be opened.';
    entry();
  }
}
async function signOutAccount(){if(!AUTH)return;await AUTH.auth.signOut();ACCOUNT_USER=null;await activateAnonymousNamespace();entry();}

const ACCESS_CODE='forge2026'; /* demo only for shared-code-demo; not authentication */
const SAMPLE={pn:1,wn:1}; /* free public sample: Phase 1 · Week 1 · Pull */
function sampleDi(){const w=FS.phases[0].weeks.find(x=>x.num===SAMPLE.wn);return w?w.days.findIndex(d=>/pull/i.test(d.t)):-1;}
function isSample(pn,wn,di){return pn===SAMPLE.pn&&wn===SAMPLE.wn&&di===sampleDi();}
const unlocked=()=>ACCESS_MODE==='open-preview'||!!STATE.unlocked;

/* ---- helpers ---- */
const hasEx=d=>d.ex&&d.ex.length>0;
const isRest=d=>d.kind==='rest'||!hasEx(d);
function setTarget(set){if(set.seconds!=null)return`${set.seconds}s`;if(!set.reps)return'—';return set.reps.min===set.reps.max?`${set.reps.min}`:`${set.reps.min}–${set.reps.max}`;}
function prescriptionSummary(e){const values=e.sets.map(setTarget);if(!values.length)return'—';return values.every(value=>value===values[0])?`${values.length}×${values[0]}`:values.join(' / ');}
function prescriptionLabel(e){if(e.sets.every(set=>set.seconds!=null))return e.sets.every(set=>set.seconds===e.sets[0].seconds)?'Sets × Time':'Time by set';return e.sets.every(set=>set.reps&&set.reps.min===e.sets[0]?.reps?.min&&set.reps.max===e.sets[0]?.reps?.max)?'Sets × Reps':'Reps by set';}
function setValue(set,laterality){const side=laterality&&laterality!=='bilateral'?' / side':'';const load=set.targetWeightPounds!=null?` × ${set.targetWeightPounds} lb`:'';return`${setTarget(set)}${side}${load}`;}
function loadSummary(e){const values=e.sets.map(set=>set.targetWeightPounds).filter(value=>value!=null);if(!values.length)return null;return values.every(value=>value===values[0])?`${values[0]}`:values.join(' / ');}
function repStr(e){return prescriptionSummary(e);}
function stats(d){let sets=0,rest=0;d.ex.forEach(e=>{sets+=e.sc;if(e.rest>rest)rest=e.rest;});return{moves:d.ex.length,sets,rest};}
/* flat ordered training sessions across non-locked phases (1-3) for resume */
function flatFS(){const out=[];FS.phases.forEach(ph=>{if(phaseLocked(ph.n))return;ph.weeks.forEach(w=>{w.days.forEach((d,di)=>{if(hasEx(d))out.push({ph:ph.n,w:w.num,di,d});});});});return out;}
function nextIncomplete(){const f=flatFS();for(const s of f){if(!isSessionDone(fsKey(s.ph,s.d),s.d))return s;}return null;}
function phaseState(n){if(phaseLocked(n))return'next';const ni=nextIncomplete();if(!ni)return n<4?'done':'next';if(n<ni.ph)return'done';if(n===ni.ph)return'now';return'next';}
function weekDone(phn,w){return w.days.every(d=>isRest(d)||isSessionDone(fsKey(phn,d),d));}

/* ---- session sheet (shared) ---- */
function chapterArt(title){if(/pull/i.test(title))return ASSET.pull;return null;}
function setsChecked(doneKey,day){let n=0;day.ex.forEach(e=>{for(let k=1;k<=e.sc;k++){if(STATE.sets[setKey(doneKey,e,k)])n++;}});return n;}

/* FOCUS — execution surface. Mirrors the app: per-set square marks, values always
   shown (a tick asserts them), cues one tap away, no timer, completion never automatic. */
function focusBody(title,eyebrow,day,doneKey,draft,legacyCompleted){
  view.appendChild(el(`<div class="fx-head-wrap fadein"><div class="fx-coord">${esc(eyebrow)}</div>
    <div class="fx-title"><h2>${esc(title)}</h2><span class="fxlabel">Focus</span></div></div>`));
  const box=el(`<div class="fadein" style="margin-top:16px"></div>`);
  day.ex.forEach((e,i)=>{
    const side=(e.lat&&e.lat!=='bilateral')?' / side':'';
    const rx=`${prescriptionSummary(e)}${side} · ${e.rest}s rest`;
    const canHelp=!!(e.cue||(e.subs&&e.subs.length));
    const mv=el(`<div class="fx-mv" data-movement-index="${i}">
      <button class="fx-head"><div class="fx-name">${esc(e.n)}${e.prime?'<span class="ex-badge">Key lift</span>':''}${canHelp?'<span class="fx-q">?</span>':''}</div>
      <div class="fx-rx">${rx}</div></button>
      ${canHelp?`<div class="fx-help">${e.cue?`<div>${esc(e.cue)}</div>`:''}${(e.subs&&e.subs.length)?`<div style="margin-top:8px"><span style="font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-4)">Sub${e.subs.length>1?'s':''}</span> ${e.subs.map(esc).join(' · ')}</div>`:''}</div>`:''}</div>`);
    if(canHelp){const hb=mv.querySelector('.fx-head'),hp=mv.querySelector('.fx-help');hb.onclick=()=>hp.classList.toggle('open');}
    for(let k=1;k<=e.sc;k++){
      const sk=setKey(doneKey,e,k);
      const confirmed=!!draft?.setConfirmations?.[sk]||!!STATE.sets[sk],locked=legacyCompleted||draft?.status==='completed'||!LOCAL_DB;
      const btn=el(`<button class="fx-set ${confirmed?'done':''}" aria-pressed="${confirmed?'true':'false'}"><span class="fx-mark"></span><span class="fx-idx">Set ${k} of ${e.sc}</span><span class="fx-val">${setValue(e.sets[k-1],e.lat)}</span></button>`);
      btn.disabled=locked;
      btn.onclick=async()=>{btn.disabled=true;await commitFocusSet(day,doneKey,sk,!confirmed);render();};
      mv.appendChild(btn);
    }
    box.appendChild(mv);});
  view.appendChild(box);
}

let MOVEMENT_OBSERVER=null;
function installExerciseNavigator(anchor){
  if(MOVEMENT_OBSERVER){MOVEMENT_OBSERVER.disconnect();MOVEMENT_OBSERVER=null;}
  const targets=[...view.querySelectorAll('[data-movement-index]')];
  if(targets.length<2)return;
  const nav=el(`<div class="exercise-nav" aria-label="Exercise navigation"><button type="button" aria-label="Previous exercise">↑</button><div class="exercise-position"></div><button type="button" aria-label="Next exercise">↓</button></div>`);
  const buttons=nav.querySelectorAll('button'),position=nav.querySelector('.exercise-position');
  let current=0;
  const update=index=>{current=Math.max(0,Math.min(targets.length-1,index));position.textContent=`Exercise ${current+1} of ${targets.length}`;buttons[0].disabled=current===0;buttons[1].disabled=current===targets.length-1;};
  const move=delta=>{update(current+delta);targets[current].scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});};
  buttons[0].onclick=()=>move(-1);buttons[1].onclick=()=>move(1);update(0);anchor.after(nav);
  MOVEMENT_OBSERVER=new IntersectionObserver(entries=>{const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(visible.length)update(Number(visible[0].target.dataset.movementIndex));},{rootMargin:'-142px 0px -55% 0px',threshold:0});
  targets.forEach(target=>MOVEMENT_OBSERVER.observe(target));
}

function renderSession(prog,title,eyebrow,day,doneKey,backLabel){
  view.innerHTML='';
  view.className='execution';
  view.appendChild(el(`<button class="back" style="margin:6px 0 12px" onclick="history.back()">‹ ${esc(backLabel)}</button>`));
  const mode=STATE.mode||'session';
  document.title=`${title} — FORGE Sculpt`;
  const bar=el(`<div class="modebar"><button data-m="session" class="${mode==='session'?'on':''}">Session</button><button data-m="focus" class="${mode==='focus'?'on':''}">Focus</button></div>`);
  bar.querySelectorAll('button').forEach(b=>b.onclick=async()=>{await LOCAL_WRITE_CHAIN;STATE.mode=b.dataset.m;await save();render();});
  const share=el(`<button class="sharebtn">↗ Share</button>`);
  share.onclick=async()=>{const url=location.href,text=`FORGE Sculpt — ${eyebrow} — ${title}`;const copied=()=>{share.textContent='✓ Link copied';setTimeout(()=>share.textContent='↗ Share',2000);};try{if(navigator.share){await navigator.share({title:'FORGE Sculpt',text,url});}else{await navigator.clipboard.writeText(`${text}\n${url}`);copied();}}catch(e){try{await navigator.clipboard.writeText(`${text}\n${url}`);copied();}catch(_){}}};
  const barrow=el(`<div class="barrow fadein"></div>`);barrow.appendChild(bar);barrow.appendChild(share);view.appendChild(barrow);
  const stateKey=sessionStateKey(day),legacyCompleted=mode==='focus'&&!STATE.sessions[stateKey]&&isSessionDone(doneKey,day);
  const draft=mode==='focus'&&!legacyCompleted?importedFocusDraft(day,doneKey):STATE.sessions[stateKey]||null;
  if(mode==='focus')focusBody(title,eyebrow,day,doneKey,draft,legacyCompleted);else sessionBody(title,eyebrow,day);
  installExerciseNavigator(barrow);
  // sticky — explicit session close, never automatic
  sticky.classList.remove('hide');
  const s=stats(day),doneBtn=document.getElementById('s-done'),progEl=document.getElementById('s-prog');
  document.getElementById('s-back').onclick=()=>history.back();
  const refresh=()=>{const d=isSessionDone(doneKey,day),current=STATE.sessions[stateKey]||draft;
    progEl.textContent=mode==='focus'?`${setsChecked(doneKey,day)}/${s.sets} sets ticked`:`${s.moves} movements · ${s.sets} sets`;
    if(mode!=='focus'){doneBtn.textContent='Open Focus';doneBtn.disabled=false;}
    else if(legacyCompleted||current?.status==='completed'){doneBtn.textContent='Reopen session';doneBtn.disabled=!LOCAL_DB;}
    else if(current&&ForgeSessionModel.canComplete(current)){doneBtn.textContent='Finish session';doneBtn.disabled=!LOCAL_DB;}
    else{doneBtn.textContent='Confirm every set';doneBtn.disabled=true;}
    doneBtn.classList.toggle('done-state',!!d);};
  renderSession._refresh=refresh;refresh();
  doneBtn.onclick=async()=>{if(mode!=='focus'){await LOCAL_WRITE_CHAIN;STATE.mode='focus';await save();return render();}const namespace=CURRENT_NAMESPACE;doneBtn.disabled=true;try{await closeOrReopenFocus(day,doneKey);render();}catch(error){LOCAL_SAVE_STATUS='notConfirmed';LOCAL_STORE_ERROR='This session change could not be confirmed on this device.';console.error('[FORGE portal] session commit failed:',error);try{if(CURRENT_NAMESPACE===namespace){STATE=normalizedState(await LOCAL_DB.snapshot(namespace));NAMESPACE_REVISIONS.set(namespace,STATE.storageRevision);return render();}}catch(reloadError){console.error('[FORGE portal] session reload failed:',reloadError);}refresh();}};
}
function sessionSheet(prog,pn,wn,di){const ph=FS.phases.find(x=>x.n===pn);const w=ph&&ph.weeks.find(x=>x.num===wn);const day=w&&w.days[di];
  if(!day)return go('/sculpt');chrome(false,'','sculpt');
  renderSession('fs',day.t,`${ph.title} · Week ${wn} · ${day.wd}`,day,fsKey(pn,day),`Week ${wn}`);}

function unavailable(err){try{sticky.classList.add('hide');}catch(e){}view.innerHTML='';
  view.appendChild(el(`<div class="stack" style="--gap:12px;padding-top:44px"><span class="eyebrow">Temporarily unavailable</span><h2>Training isn't loading right now.</h2><p class="lede">The program data didn't load. Refresh in a moment — if it keeps happening, let Brice know.</p></div>`));
  console.error('[FORGE portal] data load failed:',err);}
async function loadPortalPayload(){
  const cacheKey='portal-programs:1.0.0';
  let raw;
  try{
    const response=await fetch('./data/forge-portal-programs.json',{cache:'no-cache'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    raw=await response.json();
    validatePortalData(raw);
  }catch(networkError){
    const cached=LOCAL_DB?await LOCAL_DB.cachedProgram(cacheKey):null;
    if(cached){validatePortalData(cached.payload);console.warn('[FORGE portal] using validated cached program:',networkError);return cached.payload;}
    throw networkError;
  }
  if(LOCAL_DB){try{await LOCAL_DB.cacheProgram(cacheKey,raw,await contentHash(raw));}catch(cacheError){LOCAL_STORE_ERROR='This program could not be saved for offline use.';console.error('[FORGE portal] program cache failed:',cacheError);}}
  return raw;
}
async function boot(){await initContinuityStore();try{const raw=await loadPortalPayload();DATA=await buildData(raw);FS=DATA.programs.forge_sculpt;ROD=DATA.programs.rod;}catch(err){return unavailable(err);}try{await initAccount();}catch(error){ACCOUNT_ERROR='Apple sign-in is unavailable right now.';console.error('[FORGE portal] account init failed:',error);}if(migrateLegacySetKeys())await save();window.addEventListener('hashchange',render);render();}
window.addEventListener('DOMContentLoaded',boot);
