name: Prepare bounded coaching copy
on:
  push:
    branches: [work/coaching-message-match-20260917]
    paths: [.github/workflows/coaching-copy-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply only the approved copy patch to its exact baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const baseline = '780f409ed521f3c6290c19e0d80279331bf4eecc';
            let html = cp.execFileSync('git', ['show', baseline + ':index.html'], {encoding:'utf8'});
            const changes = [
              ['<body>', '<body data-coaching-copy="20260917-coaching-clarity">'],
              ['For your next race, stronger running for HYROX, or simply more ease and endurance. Individual coaching built around you.', 'I watch you run, build your plan, and coach you through it. Weekly track coaching in Miami, with adjustments as you develop.'],
              ['<span>Start with a conversation.</span>', '<span class="hero-reassurance">Your first Miami track assessment is complimentary.<br>Start with a conversation.</span>'],
              ['      <p>Tell me about your running and what you want to change. I read every inquiry myself.</p>', '      <p>Tell me about your running and what you want to change. I read every inquiry myself.</p>\n      <p class="review-note" id="inquiry-reassurance">An inquiry only. No payment or booking yet.</p>']
            ];
            for (const [from,to] of changes) {
              if (html.split(from).length !== 2) throw Error('Copy baseline is not unique');
              html = html.replace(from,to);
            }
            const params = {...context.repo, path:'index.html', ref:'work/coaching-message-match-20260917'};
            const current = await github.rest.repos.getContent(params);
            if (current.data.sha !== 'e049cd9c19c498f379a7f5d9e7abb437889387ea') throw Error('Concurrent homepage edit; stop without writing');
            const result = await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, path:'index.html', branch:'work/coaching-message-match-20260917',
              sha: current.data.sha, content:Buffer.from(html).toString('base64'),
              message:'Apply exact approved copy patch; preserve all baseline HTML and scripts'
            });
            core.notice('Prepared source commit: '+result.data.commit.sha);
            core.notice('Prepared index blob: '+result.data.content.sha);
