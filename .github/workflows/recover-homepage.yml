name: Recover homepage
on:
  push:
    paths:
      - '.github/workflows/recover-homepage.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore homepage from last known good commit
        run: |
          git show 559a7b4ac99f3d4c2d69046a05877d123c671b5a:index.html > index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore homepage after connector overwrite"
          git push
