name: RPD story and week-share acceptance
on:
  push:
    branches: [work/rpd-story-share-20260917]
  pull_request:
    paths:
      - 'plans/race-pace-durability/**'
      - 'es/plans/race-pace-durability/**'
      - 'tests/rpd-story-share*'
      - '.github/workflows/rpd-story-share.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpd-story-share-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Story, sharing and access source checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/rpd-pass2
          node tests/rpd-story-share.cjs | tee /tmp/rpd-pass2/source-tests.txt
          node tests/athlete-access.cjs | tee -a /tmp/rpd-pass2/source-tests.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Chromium story and week-share journeys
        env:
          BROWSER: chromium
          RPD_PASS2_ARTIFACTS: /tmp/rpd-pass2/chromium
        run: python tests/rpd-story-share-browser.py
      - name: WebKit story and week-share journeys
        env:
          BROWSER: webkit
          RPD_PASS2_ARTIFACTS: /tmp/rpd-pass2/webkit
        run: python tests/rpd-story-share-browser.py
      - name: Preserve exact source and receipt
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > /tmp/rpd-pass2/commit.txt
          git archive --format=zip HEAD -- plans/race-pace-durability es/plans/race-pace-durability tests/rpd-story-share.cjs tests/rpd-story-share-browser.py .github/workflows/rpd-story-share.yml docs > /tmp/rpd-pass2/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpd-story-share-acceptance
          path: /tmp/rpd-pass2/
          retention-days: 7
