name: Export FORM strategy pack
on:
  push:
    paths:
      - '.github/workflows/export-form-strategy-pack.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pack
        run: |
          mkdir -p FORM_2026-09-16_strategy_pack/docs/marketing
          cp docs/marketing/FORM_COACHING_OFFER_VISION_2026-09-16.md FORM_2026-09-16_strategy_pack/docs/marketing/
          cp docs/marketing/FORM_REFERRAL_CREATIVE_BRIEF_2026-09-16.md FORM_2026-09-16_strategy_pack/docs/marketing/
          cp docs/marketing/ATHLETE_LANGUAGE_RULE.md FORM_2026-09-16_strategy_pack/docs/marketing/
          cp FORM_ACQUISITION_ROADMAP.md FORM_2026-09-16_strategy_pack/
          cp AGENTS.md FORM_2026-09-16_strategy_pack/
          cat > FORM_2026-09-16_strategy_pack/README.md <<'EOF'
          # FORM September 16 Strategy Pack

          This export collects the briefs and ecosystem documents created or materially updated during the September 16, 2026 coaching / referral / FORM Analysis session.

          Included:
          - `docs/marketing/FORM_REFERRAL_CREATIVE_BRIEF_2026-09-16.md` — current self-contained creative + offer brief (v3.1)
          - `docs/marketing/FORM_COACHING_OFFER_VISION_2026-09-16.md` — two-offer architecture, coaching doctrine, selective-intervention principle, external-eyes/game-plan/data+feel model
          - `FORM_ACQUISITION_ROADMAP.md` — acquisition paths, creative hypotheses, Analysis validation gates, measurement
          - `docs/marketing/ATHLETE_LANGUAGE_RULE.md` — declarative FORM voice, evidence rule, no-decoding standard
          - `AGENTS.md` — repo-wide downstream instructions carrying the September 16 decisions

          Core decisions captured in this pack include:
          - Run Development remains the flagship managed 8-week relationship.
          - FORM Analysis is a distinct bounded job: understand your running, not cheaper coaching.
          - Not everything needs fixing. Some things just cost you more.
          - FORM is an external pair of eyes plus an individualized game plan.
          - Data tells us what happened. How it felt tells us how you absorbed it.
          - Three acquisition mechanisms: direct recognition, referral recognition, value first.
          - Three creative hypotheses: Run Development recognition, FORM Analysis coaching value, referral-native.
          - Ochy / analysis software is an instrument, not the authority.
          - Public FORM voice is direct and declarative when supported by evidence.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: FORM_2026-09-16_strategy_pack
          path: FORM_2026-09-16_strategy_pack
          retention-days: 1
