name: Athlete ecosystem acceptance
on:
  push:
    branches: [work/athlete-ecosystem-20260917]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: athlete-ecosystem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate exact source edits on this isolated branch
        if: github.ref_name == 'work/athlete-ecosystem-20260917'
        run: |
          if [ -f .harness/apply-athlete-access.py ]; then
            python .harness/apply-athlete-access.py
            git rm .harness/apply-athlete-access.py
            git add index.html private/auth.js plans/race-pace-durability/index.html plans/race-pace-durability/plan.js plans/race-pace-durability/gate.js docs/roadmap/FORM-ROADMAP.md
            git -c user.name='FORM release' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate verified account access into existing public surfaces'
            git push origin HEAD:work/athlete-ecosystem-20260917
          fi
      - name: Access tests and acquisition protections
        run: |
          mkdir -p /tmp/athlete-access
          git rev-parse HEAD > /tmp/athlete-access/commit.txt
          set -o pipefail
          for name in athlete-access homepage-metadata homepage-release coaching-measurement coaching-copy; do node tests/$name.cjs; done | tee /tmp/athlete-access/source-tests.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Chromium account and access journeys
        run: BROWSER=chromium ACCESS_ARTIFACTS=/tmp/athlete-access/chromium python tests/athlete-access-browser.py
      - name: WebKit account and access journeys
        run: BROWSER=webkit ACCESS_ARTIFACTS=/tmp/athlete-access/webkit python tests/athlete-access-browser.py
      - name: Preserve source and receipt
        if: always()
        run: |
          mkdir -p /tmp/athlete-access
          git rev-parse HEAD > /tmp/athlete-access/commit.txt
          git archive --format=zip HEAD -- index.html private athlete plans css js tests docs supabase .github/workflows > /tmp/athlete-access/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athlete-access-acceptance
          path: /tmp/athlete-access/
          retention-days: 7
