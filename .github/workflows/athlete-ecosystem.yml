name: Athlete ecosystem acceptance
on:
  push:
    branches: [work/athlete-ecosystem-20260917, main]
    paths: ['index.html','private/auth.js','private/plan-access.js','private/account-navigation.js','plans/race-pace-durability/**','supabase/migrations/*rpd_account_access*','tests/athlete-access*','scripts/verify-athlete-access-production.cjs','.github/workflows/athlete-ecosystem.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: athlete-ecosystem-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Access tests and acquisition protections
        run: |
          mkdir -p /tmp/athlete-access
          git rev-parse HEAD > /tmp/athlete-access/commit.txt
          set -o pipefail
          for name in athlete-access homepage-metadata homepage-release coaching-measurement coaching-copy; do node tests/$name.cjs; done | tee /tmp/athlete-access/source-tests.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Chromium account and access journeys
        run: BROWSER=chromium ACCESS_ARTIFACTS=/tmp/athlete-access/chromium python tests/athlete-access-browser.py
      - name: WebKit account and access journeys
        run: BROWSER=webkit ACCESS_ARTIFACTS=/tmp/athlete-access/webkit python tests/athlete-access-browser.py
      - name: Published assets and anonymous server boundaries
        if: github.ref_name == 'main'
        run: node scripts/verify-athlete-access-production.cjs /tmp/athlete-access/production.json
      - name: Actual anonymous production journey in both engines
        if: github.ref_name == 'main'
        run: |
          BROWSER=chromium ACCESS_ARTIFACTS=/tmp/athlete-access/live-chromium python tests/athlete-access-live.py
          BROWSER=webkit ACCESS_ARTIFACTS=/tmp/athlete-access/live-webkit python tests/athlete-access-live.py
      - name: Preserve exact source and receipt
        if: always()
        run: |
          mkdir -p /tmp/athlete-access
          git rev-parse HEAD > /tmp/athlete-access/commit.txt
          git archive --format=zip HEAD -- index.html private athlete plans css js tests docs supabase scripts .github/workflows > /tmp/athlete-access/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athlete-access-acceptance
          path: /tmp/athlete-access/
          retention-days: 7
