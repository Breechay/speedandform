name: Apply homepage coaching copy
on:
  push:
    paths:
      - '.github/workflows/homepage-coaching-copy.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded homepage copy edits
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
          '''<div class="argument"><b>01</b><div><strong>Find your starting point.</strong><p>I watch you run, try a few cues, and see how you respond. We discuss your training and what you want to achieve.</p></div></div>''': '''<div class="argument"><b>01</b><div><strong>An external pair of eyes.</strong><p>I watch you run and listen to how it feels. The first job is knowing what actually matters.</p></div></div>''',
          '''<div class="argument"><b>02</b><div><strong>Build the week around you.</strong><p>Each session has a purpose. We work on running comfortably, recovering well, and progressing without rushing.</p></div></div>''': '''<div class="argument"><b>02</b><div><strong>Build the game plan.</strong><p>Your week is built around your fitness, goal, schedule, other training, and how you respond.</p></div></div>''',
          '''<div class="argument"><b>03</b><div><strong>See what changes.</strong><p>We stay in touch between sessions. I check how you respond, change one thing at a time, and decide what comes next.</p></div></div>''': '''<div class="argument"><b>03</b><div><strong>See what changes.</strong><p>Data tells me what happened. How it felt tells me how you absorbed it. I adjust what needs adjusting and leave alone what doesn’t.</p></div></div>''',
          '''<div class="quote">You work with me. I set the training, read your feedback, and decide what changes.</div>''': '''<div class="quote form-principle"><span>Not everything needs fixing.</span><span>Some things just cost you more.</span><small>I look for what is making the run harder than it needs to be, change what matters, and see how you respond.</small></div>''',
          '''.quote{padding-top:24px;margin-top:28px;border-top:1px solid var(--drule);font-family:var(--serif);font-size:31px;line-height:1.16;color:var(--bone)}''': '''.quote{padding-top:24px;margin-top:28px;border-top:1px solid var(--drule);font-family:var(--serif);font-size:31px;line-height:1.16;color:var(--bone)}\n.form-principle span{display:block}.form-principle small{display:block;margin-top:18px;max-width:500px;font-family:var(--sans);font-size:14px;line-height:1.58;color:#aaa59c}'''
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected homepage source not found; aborting without write: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -F "An external pair of eyes." index.html
          grep -F "Some things just cost you more." index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sharpen homepage coaching philosophy"
          git push
