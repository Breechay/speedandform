name: Adrian strength fallback acceptance
on:
  push:
    branches: [work/adrian-strength-fallback-20260917, work/adrian-developed-runner-2026-20260918]
  pull_request:
    paths:
      - 'athlete/**'
      - 'plans/adrian-runner-mass-phase-01/**'
      - 'plans/adrian-developed-runner-2026/**'
      - 'supabase/migrations/20260918142106_adrian_developed_runner_2026.sql'
      - 'tests/adrian-strength-fallback*'
      - '.github/workflows/adrian-strength-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adrian-strength-fallback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fallback truth checks
        run: |
          node tests/adrian-strength-fallback.mjs
          node tests/athlete-access.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Chromium fallback journeys
        env:
          BROWSER: chromium
          ADRIAN_FALLBACK_ARTIFACTS: /tmp/adrian-fallback/chromium
        run: python tests/adrian-strength-fallback-browser.py
      - name: WebKit fallback journeys
        env:
          BROWSER: webkit
          ADRIAN_FALLBACK_ARTIFACTS: /tmp/adrian-fallback/webkit
        run: python tests/adrian-strength-fallback-browser.py
      - name: Preserve exact review source
        if: always()
        run: |
          mkdir -p /tmp/adrian-fallback
          git rev-parse HEAD > /tmp/adrian-fallback/commit.txt
          git archive --format=zip HEAD -- athlete plans/adrian-runner-mass-phase-01 plans/adrian-developed-runner-2026 supabase/migrations/20260918142106_adrian_developed_runner_2026.sql tests/adrian-strength-fallback.mjs tests/adrian-strength-fallback-browser.py .github/workflows/adrian-strength-fallback.yml > /tmp/adrian-fallback/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adrian-strength-fallback-review
          path: /tmp/adrian-fallback/
          retention-days: 5
