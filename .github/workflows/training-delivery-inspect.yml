name: Inspect training guide delivery
on:
  push:
    branches: [work/guide-training-pass4b]
    paths: [.github/workflows/training-delivery-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e997c3bd893fe673ba5ff49e01242ce3a59d80a2
          persist-credentials: false
      - name: Capture exact public responses and diff against the released source
        run: |
          mkdir -p /tmp/training-delivery
          node - <<'JS'
          const fs=require('fs');
          (async()=>{for(const p of ['training-week','strength','recovery','fueling']){
            const r=await fetch('https://speedandform.com/'+p,{headers:{'Cache-Control':'no-cache','User-Agent':'FORM-Guide-Release-Verification/1.0'},signal:AbortSignal.timeout(20000)});
            if(r.status!==200)throw Error(p+' '+r.status);
            fs.writeFileSync('/tmp/training-delivery/'+p+'-actual.html',await r.text());
            fs.copyFileSync(p+'.html','/tmp/training-delivery/'+p+'-expected.html');
          }})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          for p in training-week strength recovery fueling; do
            diff -u /tmp/training-delivery/$p-expected.html /tmp/training-delivery/$p-actual.html > /tmp/training-delivery/$p.diff || test $? -eq 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-delivery-inspection
          path: /tmp/training-delivery/
          retention-days: 2
