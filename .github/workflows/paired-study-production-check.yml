name: Production paired study smoke
on:
  push:
    branches: [work/paired-study-20261004]
    paths: ['.github/workflows/paired-study-production-check.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - name: Test actual production, without mocked network responses
        shell: python
        run: |
          import json,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('/tmp/live-study');out.mkdir()
          checks=[];errors=[]
          def check(name,condition):
            assert condition,name
            checks.append(name)
          with sync_playwright() as p:
            b=p.chromium.launch()
            page=b.new_page(viewport={'width':1440,'height':1050},reduced_motion='reduce')
            page.on('pageerror',lambda e:errors.append(str(e)))
            response=page.goto('https://speedandform.com/labs/same-pace-different-problem/',wait_until='networkidle')
            check('paired page HTTP200',response.status==200)
            page.wait_for_function("document.querySelectorAll('.cs-plan[data-state=live]').length===2",timeout=30000)
            check('both live plan states',page.locator('.cs-plan[data-state=live]').count()==2)
            el=page.locator('[data-plan-athlete=elijah]');si=page.locator('[data-plan-athlete=simon]')
            check('Elijah V5',el.get_attribute('data-plan-version')=='5')
            check('Simon V4',si.get_attribute('data-plan-version')=='4')
            check('Savannah race date, not week start','Nov 14, 2026' in el.locator('.cs-plan-heading').inner_text())
            page.locator('[data-cs-unit=mi]').click()
            el.locator('details').evaluate_all("els=>els.forEach(x=>x.open=true)")
            check('Elijah real Tuesday 3x2','3 × 2 mi · HM calibration' in el.inner_text())
            check('Elijah real pace band','6:08–6:12' in el.inner_text())
            check('race Saturday actual session','Race · Savannah Half Marathon' in el.inner_text())
            page.locator('[data-cs-unit=km]').click()
            si.locator('details').evaluate_all("els=>els.forEach(x=>x.open=true)")
            check('Simon Tuesday 4x2km','4 × 2 km · working development' in si.inner_text())
            check('Simon working band','3:49–3:52/km' in si.inner_text())
            page.locator('[data-cs-filter=elijah]').click()
            check('athlete filter',page.locator('[data-cs-journal] [data-entry-id=simon-2026-10-01]').count()==0)
            page.locator('[data-cs-filter=simon]').click();page.locator('[data-cs-kind=decision]').click()
            check('decision filter',page.locator('[data-cs-journal] [data-entry-id=simon-make-thursday-support]').count()==1)
            page.locator('[data-cs-filter=all]').click() if page.locator('[data-cs-filter=all]').count() else None
            page.screenshot(path=str(out/'paired-desktop.png'),full_page=True)
            page.set_viewport_size({'width':390,'height':844})
            check('production mobile no overflow',page.evaluate('document.documentElement.scrollWidth<=innerWidth'))
            page.screenshot(path=str(out/'paired-mobile.png'),full_page=True)
            for route,name in [('/labs/the-two-curves/','simon'),('/plans/elijah-savannah-half/','elijah')]:
              r=page.goto('https://speedandform.com'+route,wait_until='networkidle')
              check(name+' HTTP200',r.status==200)
              page.wait_for_selector('.cs-plan[data-state=live]',timeout=30000)
              check(name+' individual live state',page.locator('.cs-plan[data-state=live]').count()==1)
              check(name+' shared journal',page.locator('[data-entry-id]').count()>0)
              check(name+' mobile no overflow',page.evaluate('document.documentElement.scrollWidth<=innerWidth'))
              if name=='simon':
                check('French button exists',page.locator('[data-lang=fr]').count()>0)
                page.locator('[data-lang=fr]').first.click();page.wait_for_timeout(300)
                check('French module responds',page.locator('.cs-state').inner_text().startswith('Plan publié'))
                page.locator('[data-lang=en]').first.click();page.wait_for_timeout(300)
              else:
                check('Elijah page race is Nov14','Nov 14, 2026' in page.locator('.cs-plan-heading').inner_text())
              page.screenshot(path=str(out/(name+'-mobile.png')),full_page=True)
            r=page.goto('https://speedandform.com/labs/same-pace-different-problem/entries/simon-make-thursday-support/',wait_until='networkidle')
            check('entry HTTP200',r.status==200)
            check('stable entry identity',page.locator('[data-entry-id=simon-make-thursday-support]').count()==1)
            href=page.locator('.cs-relations a[href*="entries/simon-2026-10-01"]').first.get_attribute('href')
            check('decision links actual observation',bool(href))
            r=page.goto('https://speedandform.com'+href,wait_until='networkidle')
            check('source observation HTTP200',r.status==200)
            check('observation backlink',page.locator('.cs-relations a[href*="entries/simon-make-thursday-support"]').count()>0)
            check('no runtime errors',not errors)
            b.close()
          (out/'report.json').write_text(json.dumps({'status':'passed','checks':checks,'errors':errors},indent=2))
          print(str(len(checks))+' live production checks passed')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-connected-study
          path: /tmp/live-study
          retention-days: 7
