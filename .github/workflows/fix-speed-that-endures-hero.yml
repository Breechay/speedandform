name: Fix Speed That Endures hero offset

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary hero offset fix workflow [skip netlify]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply hero offset fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('labs/speed-that-endures/index.html')
          text = path.read_text()
          old = '.hero-shell{padding-top:78px}'
          new = '.hero{padding-top:78px}'

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one {old!r} rule, found {count}')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/speed-that-endures/index.html
          git diff --cached --check
          git commit -m "Fix Speed That Endures hero header offset"
          git push
