name: Coaching funnel release checks
on:
  push:
    branches: [work/coaching-funnel-measurement-20260917, work/coaching-message-match-20260917, work/run-development-method-20260917, main]
    paths: ['index.html','js/coaching-measurement.js','js/coaching-choice.js','css/homepage.css','css/coaching-choice.css','css/meta-landing.css','tests/coaching-funnel-browser.py','tests/coaching-measurement.cjs','tests/coaching-copy.cjs','tests/coaching-copy-browser.py','tests/meta-landing-browser.py','tests/homepage-release.cjs','tests/homepage-browser.py','the-method.html','css/method.css','tests/run-development-method.cjs','tests/run-development-method-browser.py','.github/workflows/coaching-funnel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing source and delivery contracts
        run: |
          node --check js/coaching-measurement.js
          node --check js/coaching-choice.js
          node tests/coaching-measurement.cjs
          node tests/homepage-release.cjs
          node tests/homepage-metadata.cjs
          node tests/coaching-copy.cjs
          node tests/run-development-method.cjs
      - name: Prove this release changes only approved homepage copy
        if: github.ref_name == 'work/coaching-message-match-20260917'
        env:
          FORM_COPY_BASELINE: 780f409ed521f3c6290c19e0d80279331bf4eecc
        run: node tests/coaching-copy.cjs
      - name: Install isolated browser runtime
        run: |
          python -m pip install playwright==1.58.0 Pillow==11.3.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Exact homepage funnel, copy and paid-social continuation
        env:
          FORM_QA_BROWSER: ${{ matrix.browser }}
          FORM_QA_ARTIFACTS: /tmp/coaching-funnel-receipt
        run: |
          python tests/coaching-copy-browser.py
          python tests/coaching-funnel-browser.py
          python tests/meta-landing-browser.py
          python tests/run-development-method-browser.py
      - name: Existing homepage layout and functionality regression
        if: matrix.browser == 'chromium'
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/homepage-browser.py
      - name: Preserve revision and evidence
        if: always()
        run: |
          mkdir -p /tmp/coaching-funnel-receipt
          git rev-parse HEAD > /tmp/coaching-funnel-receipt/commit.txt
          git hash-object index.html > /tmp/coaching-funnel-receipt/index-blob.txt
          if [ -d .homepage-qa ]; then cp -R .homepage-qa /tmp/coaching-funnel-receipt/homepage; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coaching-funnel-${{ matrix.browser }}
          path: /tmp/coaching-funnel-receipt/
          retention-days: 14
