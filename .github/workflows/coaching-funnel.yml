name: Coaching funnel release checks
on:
  push:
    branches: [main, work/commercial-home-20260930]
    paths: ['index.html','labs/speed-that-endures/**','data/public-studies/**','scripts/public-study-preview.cjs','tests/public-study-preview.cjs','thursday.html','miami-running-training.html','js/thursday-gathering.js','js/community-schedule.js','coaching/**','analysis/**','work/**','js/coaching-measurement.js','js/commercial-inquiry.js','js/coaching-choice.js','css/home*.css','css/public-finish.css','js/home-settle.js','form-house.html','form-house/contact.html','contact.html','tests/public-finish-browser.cjs','css/commercial.css','css/sf-brand.css','scripts/build-commercial.cjs','scripts/build-sf-brand.cjs','tests/commercial*','tests/coaching-measurement.cjs','.github/workflows/coaching-funnel.yml']
  pull_request:
    paths: ['index.html','labs/speed-that-endures/**','data/public-studies/**','scripts/public-study-preview.cjs','tests/public-study-preview.cjs','thursday.html','miami-running-training.html','js/thursday-gathering.js','js/community-schedule.js','coaching/**','analysis/**','work/**','js/commercial-inquiry.js','css/commercial.css','css/home-commercial.css','css/home-settle.css','css/public-finish.css','js/home-settle.js','form-house.html','form-house/contact.html','contact.html','tests/public-finish-browser.cjs','.github/workflows/coaching-funnel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public source and delivery contracts
        run: |
          node --check js/coaching-measurement.js
          node --check js/commercial-inquiry.js
          node --check js/coaching-choice.js
          node tests/coaching-measurement.cjs
          node tests/homepage-metadata.cjs
          node tests/public-study-preview.cjs
          node tests/cream-reading.cjs
          node --check js/home-settle.js
          node --check tests/public-finish-browser.cjs
      - name: Build the public pages as deployed
        run: node scripts/build-cream-reading.cjs && node scripts/build-commercial.cjs && node scripts/build-sf-brand.cjs
      - name: Install isolated browser runtime
        run: |
          npm install --prefix /tmp/sf-browser-check --no-audit --no-fund playwright@1.58.2
          /tmp/sf-browser-check/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Responsive pages and inquiry behavior with all traffic intercepted
        env:
          SF_QA_BRAND_BUILD: "1"
          FORM_QA_BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_MODULE: /tmp/sf-browser-check/node_modules/playwright
          SF_QA_ARTIFACTS: /tmp/sf-commercial-qa
        run: node tests/public-finish-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-pages-${{ matrix.browser }}
          path: /tmp/sf-commercial-qa/
          retention-days: 14
