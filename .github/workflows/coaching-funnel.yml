name: Coaching funnel release checks
on:
  push:
    branches: [main, work/commercial-home-20260930]
    paths: ['index.html','coaching/**','analysis/**','work/**','js/coaching-measurement.js','js/commercial-inquiry.js','js/coaching-choice.js','css/home*.css','css/commercial.css','css/sf-brand.css','scripts/build-commercial.cjs','scripts/build-sf-brand.cjs','tests/commercial*','tests/coaching-measurement.cjs','.github/workflows/coaching-funnel.yml']
  pull_request:
    paths: ['index.html','coaching/**','analysis/**','work/**','js/commercial-inquiry.js','css/commercial.css','css/home-commercial.css','.github/workflows/coaching-funnel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public source and delivery contracts
        run: |
          node --check js/coaching-measurement.js
          node --check js/commercial-inquiry.js
          node --check js/coaching-choice.js
          node tests/coaching-measurement.cjs
          node tests/commercial-release.cjs
          node tests/homepage-metadata.cjs
          node tests/homepage-release.cjs
          node tests/coaching-copy.cjs
          node tests/athlete-access.cjs
          node tests/run-development-method.cjs
          node tests/cream-reading.cjs
      - name: Install isolated browser runtime
        run: |
          npm install --prefix /tmp/sf-browser-check --no-audit --no-fund playwright@1.58.2
          /tmp/sf-browser-check/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Responsive pages and inquiry behavior with all traffic intercepted
        env:
          FORM_QA_BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_MODULE: /tmp/sf-browser-check/node_modules/playwright
          SF_QA_ARTIFACTS: /tmp/sf-commercial-qa
        run: node tests/commercial-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-pages-${{ matrix.browser }}
          path: /tmp/sf-commercial-qa/
          retention-days: 14
