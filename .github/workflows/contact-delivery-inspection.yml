name: Inspect contact page delivery
on:
  push:
    branches: [work/contact-delivery-verification]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect the actual public email response
        run: |
          mkdir -p /tmp/contact-delivery
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          const m=require('./docs/audits/CONTACT-NOTES-MANIFEST-20260917.json');
          (async()=>{const rows=[];for(const p of m.pages){const u=p.file==='404.html'?'https://speedandform.com/404.html':p.url;const r=await fetch(u,{headers:{'User-Agent':'FORM-Delivery-Inspection/1.0','Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});assert.equal(new URL(r.url).origin,'https://speedandform.com');const h=await r.text();fs.writeFileSync('/tmp/contact-delivery/'+p.file.replaceAll('/','_'),h);const row={file:p.file,status:r.status,url:r.url,type:r.headers.get('content-type'),cacheControl:r.headers.get('cache-control'),referrerPolicy:r.headers.get('referrer-policy'),emailObfuscation:h.includes('email-protection')};rows.push(row);console.log(JSON.stringify(row));}fs.writeFileSync('/tmp/contact-delivery/responses.json',JSON.stringify(rows,null,2));})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          python - <<'PY'
          from pathlib import Path
          import json,difflib
          out=Path('/tmp/contact-delivery');parts=[]
          for p in json.loads((out/'responses.json').read_text()):
              expected=Path(p['file']).read_text();actual=(out/p['file'].replace('/','_')).read_text()
              parts.extend(difflib.unified_diff(expected.splitlines(True),actual.splitlines(True),fromfile=p['file']+' source',tofile=p['file']+' delivered'))
          (out/'exact-differences.txt').write_text(''.join(parts))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-delivery-inspection
          path: /tmp/contact-delivery/
          retention-days: 2
