name: Apply FORM manifesto downstream
on:
  push:
    branches:
      - work/mobile-hero-cut-20260917
    paths:
      - .github/workflows/apply-form-manifesto-20260917.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mobile-hero-cut-20260917
      - name: Apply doctrine
        run: python scripts/apply-form-manifesto-20260917.py
      - name: Verify source contracts
        run: |
          node --check js/coaching-choice.js
          node --check js/coaching-measurement.js
          node tests/coaching-measurement.cjs
          node tests/homepage-release.cjs
          node tests/homepage-metadata.cjs
          node tests/coaching-copy.cjs
      - name: Commit downstream doctrine
        run: |
          git config user.name "Breechay"
          git config user.email "briceikouebe@gmail.com"
          git add index.html css/homepage.css tests/homepage-release.cjs tests/meta-landing-browser.py tests/coaching-copy.cjs docs/marketing/FORM_COACHING_OFFER_VISION_2026-09-16.md docs/marketing/CURRENT_COMMERCIAL_EXECUTION.md docs/roadmap/FORM-ROADMAP.md docs/ATHLETE_COACHING_SYSTEM.md docs/CURSOR_CONTEXT.md FORM_ACQUISITION_ROADMAP.md docs/marketing/FORM_REFERRAL_CREATIVE_BRIEF_2026-09-16.md docs/audits/HOME-SINGLE-RUNNER-20260916.md docs/audits/HOME-COACHING-FLOW-AUDIT.md
          git commit -m "Align FORM surfaces with run development manifesto"
          git push origin HEAD:work/mobile-hero-cut-20260917
