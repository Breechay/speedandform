name: Discovery release checks
on:
  push:
    branches: [work/site-discovery-pass2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply inspected mobile refinements on isolated branch
        run: |
          test "$GITHUB_REF_NAME" = work/site-discovery-pass2
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-discovery.cjs');s=p.read_text()
          s=s.replace('href="/plans/">Training plans</a>','href="/plans/">Plans</a>')
          s=s.replace('Try easy running, race pace, strength…','Try easy running…')
          s=s.replace('${esc(title)}</a>`).join(\'\')}</nav>`+GROUPS', '${esc(({start:"Start here",training:"Pace & training",movement:"Form & strength",race:"Race preparation",recovery:"Recovery",practice:"Plans & studies"})[id])}</a>`).join(\'\')}</nav>`+GROUPS')
          old="if(['library.html','search.html','404.html'].includes(file)||h.includes('class=\"site-wayfinding\"'))continue;"
          new="if(['library.html','search.html','404.html'].includes(file))continue;\n  if(h.includes('class=\"site-wayfinding\"')){h=h.replace(/<nav class=\"site-wayfinding\"[\\s\\S]*?<\\/nav>/,wayfinding);change(file,h,'Public wayfinding; original navigation, article content, IDs and scripts retained');continue;}"
          assert old in s or new in s
          s=s.replace(old,new);p.write_text(s)
          p=Path('css/discovery.css');s=p.read_text();extra='@media(max-width:767px){.discovery-topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}.discovery-nav{gap:4px 16px}.site-wayfinding{gap:4px 16px}}\n'
          if extra not in s:s+='\n'+extra
          p.write_text(s)
          p=Path('tests/discovery-browser.py');s=p.read_text();old="                check(f'{route} contained at {width}',page.evaluate('document.documentElement.scrollWidth <= innerWidth+1'))"
          extra="\n                if route=='/library':\n                    ys=page.locator('.discovery-nav a').evaluate_all('(links)=>links.map(a=>Math.round(a.getBoundingClientRect().top))')\n                    check(f'Navigation stays on one row at {width}',len(set(ys))==1)\n                    if width==390:check('First useful guide reaches the first mobile screen',page.locator('.discovery-link').first.bounding_box()['y']<960)"
          if extra not in s:s=s.replace(old,old+extra)
          p.write_text(s)
          PY
          node scripts/build-discovery.cjs
      - name: Source and critical-flow regression checks
        run: |
          set -o pipefail
          mkdir -p /tmp/discovery-receipt
          {
            node tests/discovery.cjs
            node tests/share-metadata.cjs
            node tests/homepage-metadata.cjs
            node tests/homepage-release.cjs
            node tests/coaching-measurement.cjs
            node tests/cream-reading.cjs
            node labs/track/track.test.cjs
            node tests/thursday-schedule.cjs
          } | tee /tmp/discovery-receipt/source-tests.txt
      - name: Save validated generated files on isolated branch
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('docs/audits/DISCOVERY-MANIFEST-20260916.json').read_text())
          allowed={r['file'] for r in m['changedHtml']}|{'search-index.json','sitemap.xml','robots.txt','_headers','_redirects','docs/audits/DISCOVERY-MANIFEST-20260916.json','css/discovery.css','scripts/build-discovery.cjs','tests/discovery-browser.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed, changed-allowed
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'refine: compact public navigation and mobile Library topic links'
            git push origin HEAD:work/site-discovery-pass2
          fi
          git rev-parse HEAD > /tmp/discovery-receipt/commit.txt
          node scripts/build-discovery.cjs
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Discovery browser acceptance
        env:
          DISCOVERY_ARTIFACTS: /tmp/discovery-receipt/screens
        run: python tests/discovery-browser.py
      - name: Existing homepage interaction and intake acceptance
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/homepage-browser.py
          cp .homepage-qa/browser-qa.json /tmp/discovery-receipt/homepage-browser.json
      - name: Source receipt
        if: always()
        run: |
          mkdir -p /tmp/discovery-receipt
          git rev-parse HEAD > /tmp/discovery-receipt/commit.txt
          cp docs/audits/DISCOVERY-MANIFEST-20260916.json /tmp/discovery-receipt/ || true
          tar --exclude=.git --exclude=node_modules --exclude=.homepage-qa -czf /tmp/discovery-receipt/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-receipt
          path: /tmp/discovery-receipt/
          retention-days: 7
