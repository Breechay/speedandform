name: Discovery release checks
on:
  push:
    branches: [work/site-discovery-pass2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Close explicit-canonical acceptance and link the single register
        run: |
          test "$GITHUB_REF_NAME" = work/site-discovery-pass2
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-discovery.cjs');s=p.read_text().replace("baseCommit:'d86ee61739de9ad3c97515bd64b9a9409c8dd89c'", "baseCommit:'05b76ab2b08cfc37f448f637f19e3aa0c9c3d03a'")
          s=s.replace("entries.filter(e=>e.file.startsWith('library/'))", "entries.filter(e=>e.file.startsWith('library/')||e.file==='forge-sculpt/index.html')")
          p.write_text(s)
          p=Path('tests/discovery.cjs');s=p.read_text();needle="assert.equal(s.canonical(read(file),file),url);"
          check="assert.equal([...s.head(read(file)).matchAll(/<link\\b[^>]*>/gi)].filter(x=>s.attrs(x[0]).rel==='canonical').length,1,file+' explicit canonical');"
          if check not in s:s=s.replace(needle,needle+check)
          p.write_text(s)
          p=Path('scripts/verify-discovery-production.cjs');s=p.read_text();needle="assert.equal(s.canonical(h,file),url,url+' canonical');"
          check="assert.equal([...s.head(h).matchAll(/<link\\b[^>]*>/gi)].filter(x=>s.attrs(x[0]).rel==='canonical').length,1,url+' explicit canonical');"
          if check not in s:s=s.replace(needle,needle+check)
          p.write_text(s)
          p=Path('docs/roadmap/FORM-ROADMAP.md');s=p.read_text();line='\nWebsite ecosystem release status and the single checklist: [bounded release passes](SITE-ECOSYSTEM-PASSES-20260916.md). Pass 1 is live; Pass 2 source and browser acceptance is recorded in [discovery release](../audits/DISCOVERY-RELEASE-20260916.md). That receipt owns production status.\n'
          if line not in s:s=s.replace('\n## Current checkpoint',line+'\n## Current checkpoint',1)
          p.write_text(s)
          p=Path('docs/roadmap/SITE-ECOSYSTEM-PASSES-20260916.md');s=p.read_text().replace('| 2 | Public navigation, Library discovery, and technical SEO | NEXT | None yet |','| 2 | Public navigation, Library discovery, and technical SEO | IMPLEMENTED; production pending | [Discovery release and acceptance](../audits/DISCOVERY-RELEASE-20260916.md). Final commit, deployment and live checks pending. |').replace('Passes 2–6 remain queued; no background execution is implied. The next implementation scope is Pass 2.', 'Pass 2 is implemented on the isolated branch; its release receipt owns the pending final verification and production status. Passes 3–6 remain queued; no background execution is implied.')
          p.write_text(s)
          PY
          node scripts/build-discovery.cjs
      - name: Source and critical-flow regression checks
        run: |
          set -o pipefail
          mkdir -p /tmp/discovery-receipt
          {
            node tests/discovery.cjs
            node tests/share-metadata.cjs
            node tests/homepage-metadata.cjs
            node tests/homepage-release.cjs
            node tests/coaching-measurement.cjs
            node tests/cream-reading.cjs
            node labs/track/track.test.cjs
            node tests/thursday-schedule.cjs
          } | tee /tmp/discovery-receipt/source-tests.txt
      - name: Save validated generated files on isolated branch
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('docs/audits/DISCOVERY-MANIFEST-20260916.json').read_text())
          allowed={r['file'] for r in m['changedHtml']}|{'search-index.json','sitemap.xml','robots.txt','_headers','_redirects','docs/audits/DISCOVERY-MANIFEST-20260916.json','scripts/build-discovery.cjs','tests/discovery.cjs','scripts/verify-discovery-production.cjs','docs/roadmap/FORM-ROADMAP.md','docs/roadmap/SITE-ECOSYSTEM-PASSES-20260916.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed, changed-allowed
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: require explicit canonical tags and preserve a stable release baseline'
            git push origin HEAD:work/site-discovery-pass2
          fi
          git rev-parse HEAD > /tmp/discovery-receipt/commit.txt
          node scripts/build-discovery.cjs
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Discovery browser acceptance
        env:
          DISCOVERY_ARTIFACTS: /tmp/discovery-receipt/screens
        run: python tests/discovery-browser.py
      - name: Existing homepage interaction and intake acceptance
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/homepage-browser.py
          cp .homepage-qa/browser-qa.json /tmp/discovery-receipt/homepage-browser.json
      - name: Source receipt
        if: always()
        run: |
          mkdir -p /tmp/discovery-receipt
          git rev-parse HEAD > /tmp/discovery-receipt/commit.txt
          cp docs/audits/DISCOVERY-MANIFEST-20260916.json /tmp/discovery-receipt/ || true
          tar --exclude=.git --exclude=node_modules --exclude=.homepage-qa -czf /tmp/discovery-receipt/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-receipt
          path: /tmp/discovery-receipt/
          retention-days: 7
