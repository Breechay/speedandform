name: Discovery release checks
on:
  push:
    branches: [work/site-discovery-pass2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare bounded public discovery
        run: |
          test "$GITHUB_REF_NAME" = work/site-discovery-pass2
          python - <<'PY'
          from pathlib import Path
          p=Path('css/discovery.css')
          s=p.read_text().replace('.discovery-field:focus-within{outline:2px solid var(--ink);outline-offset:3px}', '.discovery-field:focus-within{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}')
          p.write_text(s)
          PY
          node scripts/build-discovery.cjs
      - name: Source and critical-flow regression checks
        run: |
          set -o pipefail
          mkdir -p /tmp/discovery-receipt
          {
            node tests/discovery.cjs
            node tests/share-metadata.cjs
            node tests/homepage-metadata.cjs
            node tests/homepage-release.cjs
            node tests/coaching-measurement.cjs
            node tests/cream-reading.cjs
            node labs/track/track.test.cjs
            node tests/thursday-schedule.cjs
          } | tee /tmp/discovery-receipt/source-tests.txt
      - name: Save validated generated files on isolated branch
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('docs/audits/DISCOVERY-MANIFEST-20260916.json').read_text())
          allowed={r['file'] for r in m['changedHtml']}|{'search-index.json','sitemap.xml','robots.txt','_headers','_redirects','docs/audits/DISCOVERY-MANIFEST-20260916.json','css/discovery.css'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed, changed-allowed
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: apply scoped discovery pages, navigation and search foundation'
            git push origin HEAD:work/site-discovery-pass2
          fi
          git rev-parse HEAD > /tmp/discovery-receipt/commit.txt
          node scripts/build-discovery.cjs
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Discovery browser acceptance
        env:
          DISCOVERY_ARTIFACTS: /tmp/discovery-receipt/screens
        run: python tests/discovery-browser.py
      - name: Existing homepage interaction and intake acceptance
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/homepage-browser.py
          cp .homepage-qa/browser-qa.json /tmp/discovery-receipt/homepage-browser.json
      - name: Source receipt
        if: always()
        run: |
          mkdir -p /tmp/discovery-receipt
          git rev-parse HEAD > /tmp/discovery-receipt/commit.txt
          cp docs/audits/DISCOVERY-MANIFEST-20260916.json /tmp/discovery-receipt/ || true
          tar --exclude=.git --exclude=node_modules --exclude=.homepage-qa -czf /tmp/discovery-receipt/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-receipt
          path: /tmp/discovery-receipt/
          retention-days: 7
