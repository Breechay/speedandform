name: Discovery source review
on:
  push:
    branches: [work/site-discovery-pass2]
    paths: ['.github/workflows/discovery-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/discovery-review
          git rev-parse HEAD > /tmp/discovery-review/commit.txt
          tar --exclude=.git --exclude=node_modules -czf /tmp/discovery-review/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-source
          path: /tmp/discovery-review/
          retention-days: 2
