name: Recovered track selection
on:
  push:
    branches: [work/recover-track-selection-20261015]
  pull_request:
    paths: ['track/**', 'js/session-film-muted.js', 'tests/track-recovery-browser.py']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false playwright@1.58.0
          sudo apt-get install -y qpdf
      - name: Build parity and browser review
        run: |
          python - <<'PY'
          import tomllib,subprocess
          subprocess.run(tomllib.load(open('netlify.toml','rb'))['build']['command'],shell=True,check=True)
          PY
          python tests/track-recovery-browser.py
          node tests/visual-theater-contract.cjs
          node scripts/build-brand-kit.cjs
          node scripts/render-brand-kit.cjs
          node tests/brand-kit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-track-review
          path: |
            /tmp/recovery-review
            assets/brand/kit
