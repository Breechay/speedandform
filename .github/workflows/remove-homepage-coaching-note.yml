name: Remove homepage coaching note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-homepage-coaching-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove note
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '    <p class="coaching-note">Already lifting or working with a trainer? Choose Run. Session arrangements are agreed before you commit.</p>\n'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one coaching note, found {s.count(old)}')
          p.write_text(s.replace(old, ''))
          PY
      - name: Commit change and remove workflow
        shell: bash
        run: |
          git config user.name "FORM release bot"
          git config user.email "brice@speedandform.com"
          git rm .github/workflows/remove-homepage-coaching-note.yml
          git add index.html
          git commit -m "Remove redundant homepage coaching note"
          git push origin HEAD:main
