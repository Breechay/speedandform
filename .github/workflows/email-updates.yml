name: Email updates acceptance
on:
  push:
    branches: [work/email-updates-pass6b]
    paths: ['newsletter/**','updates/**','supabase/functions/email-updates/**','supabase/migrations/20260917181000_email_updates.sql','tests/email-updates.cjs','tests/newsletter/**','.github/workflows/email-updates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: newsletter_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEWSLETTER_TEST_DATABASE_URL: postgresql://postgres:fixture-password@127.0.0.1:5432/newsletter_test
      NODE_PATH: /tmp/newsletter-deps/node_modules
      NEWSLETTER_ARTIFACTS: /tmp/newsletter-receipt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable database test dependency
        run: npm install --prefix /tmp/newsletter-deps pg@8.16.3
      - name: Real database and isolated provider acceptance
        run: node tests/email-updates.cjs
      - name: Protect every earlier release
        run: |
          set -o pipefail
          for name in app-preview-polish sculpt-landing form-landing contact-notes ask-header training-guides guide-foundations track-gallery discovery share-metadata homepage-metadata homepage-release coaching-measurement cream-reading thursday-schedule; do node tests/$name.cjs; done | tee /tmp/newsletter-receipt/regressions.txt
          node labs/track/track.test.cjs | tee -a /tmp/newsletter-receipt/regressions.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser runtime
        run: |
          python -m pip install playwright==1.58.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Staged reading, consent and recovery in both engines
        run: |
          node tests/newsletter/server.cjs > /tmp/newsletter-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill $FIXTURE_PID || true' EXIT
          for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:4179/updates/ > /dev/null; then break; fi; sleep 1; done
          python tests/newsletter/browser.py
      - name: Record exact tested source, never production credentials
        if: always()
        run: |
          mkdir -p /tmp/newsletter-receipt
          git rev-parse HEAD > /tmp/newsletter-receipt/commit.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-updates-receipt
          path: /tmp/newsletter-receipt/
          retention-days: 14
