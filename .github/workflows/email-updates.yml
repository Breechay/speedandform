name: Email updates acceptance
on:
  push:
    branches: [work/email-updates-pass6b]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: newsletter_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEWSLETTER_TEST_DATABASE_URL: postgresql://postgres:fixture-password@127.0.0.1:5432/newsletter_test
      NODE_PATH: /tmp/newsletter-deps/node_modules
      NEWSLETTER_ARTIFACTS: /tmp/newsletter-receipt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save the exact staged source on this isolated branch
        run: |
          test "$GITHUB_REF_NAME" = work/email-updates-pass6b
          python - <<'PY'
          import json,lzma,base64,hashlib,subprocess
          from pathlib import Path
          allowed={'.github/workflows/email-updates.yml','docs/audits/EMAIL-UPDATES-20260917.md','docs/publishing/EMAIL-UPDATES.md','newsletter/activation-headers.toml','newsletter/config.example.env','newsletter/updates.css','newsletter/updates.js','supabase/functions/email-updates/core.mjs','supabase/functions/email-updates/deno.json','supabase/functions/email-updates/email.mjs','supabase/functions/email-updates/index.ts','supabase/migrations/20260917181000_email_updates.sql','tests/email-updates.cjs','tests/newsletter/browser.py','tests/newsletter/helpers.cjs','tests/newsletter/server.cjs','updates/index.html'}
          transfer={f'.github/email-transfer/{i}.b64' for i in range(3)}
          packed=base64.b64decode(''.join(Path(f'.github/email-transfer/{i}.b64').read_text() for i in range(3)),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='0dce6fd7763f6b8f867109a80adc6c547822dc585ff2bcee1e6a2920a0756cd6'
          data=json.loads(lzma.decompress(packed,memlimit=134217728));assert set(data)==allowed
          for f,text in data.items():
              p=Path(f)
              if f!='.github/workflows/email-updates.yml':assert not p.exists(),f
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text,encoding='utf-8')
          for f in transfer:Path(f).unlink()
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed<=allowed|transfer,changed-(allowed|transfer)
          subprocess.run(['git','add','-A','--',*sorted(allowed|transfer)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: stage opt-in email confirmation, unsubscribe, secure state and browser recovery'
          git push origin HEAD:work/email-updates-pass6b
      - name: Disposable database test dependency
        run: npm install --prefix /tmp/newsletter-deps pg@8.16.3
      - name: Real database and isolated provider acceptance
        run: node tests/email-updates.cjs
      - name: Protect every earlier release
        run: |
          set -o pipefail
          for name in app-preview-polish sculpt-landing form-landing contact-notes ask-header training-guides guide-foundations track-gallery discovery share-metadata homepage-metadata homepage-release coaching-measurement cream-reading thursday-schedule; do node tests/$name.cjs; done | tee /tmp/newsletter-receipt/regressions.txt
          node labs/track/track.test.cjs | tee -a /tmp/newsletter-receipt/regressions.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser runtime
        run: |
          python -m pip install playwright==1.58.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Staged reading, consent and recovery in both engines
        run: |
          node tests/newsletter/server.cjs > /tmp/newsletter-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill $FIXTURE_PID || true' EXIT
          for i in $(seq 1 20); do if curl -fsS http://127.0.0.1:4179/updates/ > /dev/null; then break; fi; sleep 1; done
          python tests/newsletter/browser.py
      - name: Record exact tested source, never production credentials
        if: always()
        run: |
          mkdir -p /tmp/newsletter-receipt
          git rev-parse HEAD > /tmp/newsletter-receipt/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-updates-receipt
          path: /tmp/newsletter-receipt/
          retention-days: 14
