name: One-off Speed That Endures W3 update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-speed-endures-sep11.yml

permissions:
  contents: write

jobs:
  update-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch living study from W3 evidence
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('labs/speed-that-endures/index.html')
          s = path.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {n}')
              s = s.replace(old, new, 1)

          # Freshness + study version.
          one('meta content="2026-09-08" property="article:modified_time"/',
              'meta content="2026-09-11" property="article:modified_time"/', 'article modified date')
          one('"dateModified":"2026-09-07"', '"dateModified":"2026-09-11"', 'json-ld modified date')
          one('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5', 'css version')
          one('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5', 'js version')

          # The number is not the method.
          one(
              '<p class="scene-copy">José and Hope are working at 6:30–6:45. Your pace might be 9:00, 8:00 or 7:00. The idea is the same: choose a pace you can already reach, then teach yourself to stay there longer and with less friction.</p>',
              '<p class="scene-copy">José is working at 6:30–6:45. Hope is now working at 6:45–7:00. Your pace might be 9:00, 8:00 or 7:00. The number is not the method: choose a pace you can already reach, then teach yourself to stay there longer and with less friction.</p>',
              'athlete-relative method copy')

          one(
              '<p>Keep some faster running in the week. It makes race pace sit below your ceiling instead of becoming the hardest speed you ever touch.</p>',
              '<p>Progress threshold time and continuity so race pace keeps sitting below the athlete’s sustainable ceiling. Faster work supports the spine; it does not replace it.</p>',
              'ceiling method copy')

          # Two athletes: preserve W2 as the historical shared prescription, then file W3.
          one(
              '<p>Same target. Same race. Same progression. <span>Two different humans meeting the same work.</span></p>',
              '<p>Same method. Same race. <span>Two athletes now carrying different race-pace bands.</span></p>',
              'cases poster')

          one(
              '<p>Both athletes reached the target band in broken work. José finished with his fastest rep and reported reserve. Hope held the first two reps, then faded late. That is not a ranking. It is the reason the evidence has to belong to the athlete.</p>',
              '<p>Both athletes reached the shared band in W2. José finished with his fastest rep and reported reserve. Hope held the first two reps, then faded late. That was not a ranking; it was the first signal that one shared number might not be the right long-term prescription.</p>',
              'first read')

          old_current = '''<div class="current-read-v73" aria-label="Current study read">
  <div class="cr-head">
    <span>CURRENT READ · SEP 08</span>
    <h3>EIGHT MILES FILED.<br/><em>THE PACE HELD.</em></h3>
  </div>
  <div class="cr-grid">
    <div><small>JOSÉ · W3</small><b>6:42 · 6:43 · 6:43 · 6:43</b><p>Four 2-mile reps. Eight race-pace miles. One second per mile of spread.</p></div>
    <div><small>SESSION</small><b>12.33 miles total.</b><p>2.31 mi warm up · 3 × 3:00 floats · 1.08 mi cool down.</p></div>
    <div><small>ATHLETE</small><b>“I swear I’ve never done a workout like that.”</b><p>He called it hard, said it passed quickly, and described it as his longest interval workout to date.</p></div>
    <div class="next"><small>W3 STILL OPEN · HOPE RUNS SEP 09</small><b>THE SHARED READ WAITS.</b><p>José is filed. Hope completes the same 4 × 2-mile exposure next.</p></div>
  </div>
</div>'''
          new_current = '''<div class="current-read-v73" aria-label="Current study read">
  <div class="cr-head">
    <span>CURRENT READ · SEP 11</span>
    <h3>SAME METHOD.<br/><em>TWO PACES.</em></h3>
  </div>
  <div class="cr-grid">
    <div><small>JOSÉ · W3</small><b>6:42 · 6:43 · 6:43 · 6:43</b><p>Eight broken race-pace miles at his 6:30–6:45 band. One second per mile of spread.</p></div>
    <div><small>HOPE · W3</small><b>6:50 · 6:50 · 6:53 · 6:50</b><p>Eight broken miles with no late fade. Three seconds per mile of spread.</p></div>
    <div><small>CEILING CHECK · 2 × 10 MIN</small><b>José 6:15 · 6:14<br/>Hope 6:22 · 6:24</b><p>The threshold work preserves roughly the same separation seen in the race-pace sessions. The plan now progresses that ceiling deliberately rather than touching it at random.</p></div>
    <div class="next"><small>DECISION · SEP 11</small><b>HOPE → 6:45–7:00 /MI</b><p>José stays 6:30–6:45. W4 removes the reset: five continuous miles at each athlete’s own band.</p></div>
  </div>
</div>'''
          one(old_current, new_current, 'current read')

          # Season and experiment now describe athlete-relative bands.
          one(
              '<p class="small">Orlando asks whether 6:30–6:45/mi can stay economical under continuous exposure. Donna asks whether that economy is still there deep into a marathon.</p>',
              '<p class="small">Orlando asks whether each athlete’s race pace can stay economical under continuous exposure — José at 6:30–6:45/mi, Hope at 6:45–7:00/mi. Donna asks whether that economy is still there deep into a marathon.</p>',
              'season test copy')
          one('<div class="nm">Make 6:30–6:45 economical for longer.</div>',
              '<div class="nm">Make each athlete’s race pace economical for longer.</div>', 'season phase')
          one('<h2 class="experiment-claim display-claim" id="exp-h">SAME PACE.<br/>DIFFERENT CONTEXTS.<br/><span>ONE SYSTEM.</span></h2>',
              '<h2 class="experiment-claim display-claim" id="exp-h">SAME METHOD.<br/>TWO PACES.<br/><span>ONE SYSTEM.</span></h2>', 'experiment claim')

          one(
              '<p>The band stays 6:30–6:45/mi. What grows is the time spent there without a break. The weeks between the big asks build the system instead of testing it every Tuesday.</p>',
              '<p>Each athlete’s band stays fixed while the uninterrupted exposure grows: José 6:30–6:45/mi, Hope 6:45–7:00/mi. The weeks between the big asks build the system instead of testing it every Tuesday.</p>',
              'continuous ladder copy')

          # Thursday is now an explicit ceiling progression.
          pattern = re.compile(
              r'<div class="cal-col">\n<header>Ceiling and complementary · Thu</header>.*?</div>\n<div class="cal-col">\n<header>Late-run durability · Sat</header>',
              re.S)
          replacement = '''<div class="cal-col">
<header>Ceiling progression · Thu</header>
<div class="ev"><div class="d">Sep 10 / 11<br/>W3</div><div><b>2 × 10 min threshold</b><small>Filed: José 6:15 · 6:14 · Hope 6:22 · 6:24. The first paired ceiling read.</small></div></div>
<div class="ev"><div class="d">Sep 24<br/>W5</div><div><b>3 × 10 min threshold</b><small>Add threshold time without making the pace faster.</small></div></div>
<div class="ev"><div class="d">Oct 08<br/>W7</div><div><b>VO₂ · 5 × 3 min</b><small>One controlled higher-ceiling session between threshold steps.</small></div></div>
<div class="ev"><div class="d">Oct 15<br/>W8</div><div><b>2 × 15 min threshold</b><small>Thirty minutes again, this time with one fewer reset.</small></div></div>
<div class="ev"><div class="d">Oct 29<br/>W10</div><div><b>3 × 10 min threshold</b><small>Re-establish the ceiling after the eight-mile race-pace ask.</small></div></div>
<div class="ev"><div class="d">Nov 19<br/>W13</div><div><b>2 × 8 min threshold</b><small>Keep the ceiling present while the block tapers.</small></div></div>
</div>
<div class="cal-col">
<header>Late-run durability · Sat</header>'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Thursday calendar: expected 1 block, found {n}')

          # W3 evidence object: replace the complete W3 record, leaving W2 historical.
          w3_pattern = re.compile(r'  w3:\{.*?\n  \},\n  w4:\{', re.S)
          w3 = '''  w3:{
    title:"Sep 08 · W3 · 4 × 2 mi at race pace",
    q:"Can eight broken race-pace miles stay organised, and does the paired response still justify one shared band?",
    pr:"4 × 2 mi · 3 min float · shared 6:30–6:45 prescription entering W3",
    prs:"Eight miles of broken race-pace exposure. W3 becomes the decision point for whether one shared target still fits both athletes.",
    j:{out:"6:42 · 6:43 · 6:43 · 6:43",outs:"Four 2-mile reps inside José's 6:30–6:45 band with one second per mile of spread.",
       cost:"Hard · controlled",costs:"More race-pace volume did not require more speed. José reported the workout as hard but repeatable and did not need to press below the band.",
       read:"Eight broken miles established",reads:"Access stayed organised across all four reps. The next useful question is continuous exposure, not a faster band.",
       next:"5 mi continuous @ 6:30–6:45",nexts:"Sep 15 removes the reset; José keeps the same band for the first continuous ask.",
       effort:"Hard",limiter:"Not isolated",reserve:"Chose not to push faster"},
    h:{out:"6:50 · 6:50 · 6:53 · 6:50",outs:"Four 2-mile reps with three seconds per mile of spread and no late fade.",
       cost:"Controlled enough to repeat",costs:"Hope did not reproduce the W2 late fade. The work sat around 6:50 without needing to chase the faster edge of the old shared band.",
       read:"Band adjusted",reads:"Paired with 2 × 10 threshold work at 6:22 · 6:24, the evidence supports 6:45–7:00 as Hope's working race-pace band instead of forcing José's 6:30–6:45 band.",
       next:"5 mi continuous @ 6:45–7:00",nexts:"First uninterrupted ask at Hope's own band. Let roughly 6:50 feel ordinary; there is no need to chase 6:45.",
       effort:"Not reported",limiter:"Not isolated",reserve:"Not reported"}
  },
  w4:{'''
          s, n = w3_pattern.subn(w3, s, count=1)
          if n != 1:
              raise SystemExit(f'W3 evidence: expected 1 block, found {n}')

          # Future asks resolve through each athlete's band.
          s = s.replace('pr:"5 mi continuous @ 6:30–6:45",',
                        'pr:"5 mi continuous · José 6:30–6:45 · Hope 6:45–7:00",', 1)
          s = s.replace('pr:"6 mi continuous @ 6:30–6:45",',
                        'pr:"6 mi continuous · José 6:30–6:45 · Hope 6:45–7:00",', 1)
          s = s.replace('pr:"Tue: 8 mi continuous @ 6:30–6:45 · Sat: 17 total, last 4 @ RP",',
                        'pr:"Tue: 8 mi continuous at athlete band · Sat: 17 total, last 4 @ RP · José 6:30–6:45 · Hope 6:45–7:00",', 1)
          s = s.replace('pr:"16 mi total · final 12 continuous @ 6:30–6:45",',
                        'pr:"16 mi total · final 12 continuous @ athlete band · José 6:30–6:45 · Hope 6:45–7:00",', 1)
          s = s.replace('pr:"13.1 mi · Orlando Half · 6:30–6:45",',
                        'pr:"13.1 mi · Orlando Half · José 6:30–6:45 · Hope 6:45–7:00",', 1)

          # Orlando visible target table: José remains 6:30–6:45; Hope gets 6:45–7:00.
          one('<div class="test-meta"><span>Dec 05 · 2026</span><span>13.1 mi</span><span>Target · 6:30–6:45</span></div>',
              '<div class="test-meta"><span>Dec 05 · 2026</span><span>13.1 mi</span><span>José 6:30–6:45 · Hope 6:45–7:00</span></div>', 'Orlando meta')

          hope_anchor = '<summary><b>Hope</b><span>Awaiting data</span><i aria-hidden="true">+</i></summary>'
          if hope_anchor not in s:
              raise SystemExit('Hope Orlando result not found')
          before, after = s.split(hope_anchor, 1)
          result_end = after.find('</details>')
          if result_end < 0:
              raise SystemExit('Hope Orlando result end not found')
          hope = after[:result_end]
          hope = hope.replace('<span>6:30–6:45</span>', '<span>6:45–7:00</span>')
          after = hope + after[result_end:]
          s = before + hope_anchor + after

          # Status line / file commentary.
          s = s.replace('last updated Sep 08 2026', 'last updated Sep 11 2026')

          checks = [
              'HOPE → 6:45–7:00 /MI',
              '6:50 · 6:50 · 6:53 · 6:50',
              'José 6:15 · 6:14<br/>Hope 6:22 · 6:24',
              'Ceiling progression · Thu',
              '3 × 10 min threshold',
              '2 × 15 min threshold',
              'SAME METHOD.<br/>TWO PACES.',
          ]
          for check in checks:
              if check not in s:
                  raise SystemExit(f'missing proof string: {check}')

          path.write_text(s)
          PY

      - name: Verify only intended study changed
        shell: bash
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | grep -v '^.github/workflows/update-speed-endures-sep11.yml$' | wc -l | tr -d ' ')" = "1"
          git diff --name-only | grep -qx 'labs/speed-that-endures/index.html'

      - name: Commit study and remove one-off workflow
        shell: bash
        run: |
          git config user.name "Brice Ikouebe"
          git config user.email "noreply@speedandform.com"
          git rm .github/workflows/update-speed-endures-sep11.yml
          git add labs/speed-that-endures/index.html
          git commit -m "Study: file Hope W3 and progress the ceiling [skip ci]"
          git push origin HEAD:main
