name: Athlete workspace acceptance
on:
  push:
    branches: [work/athlete-workspace-20260917, work/roster-athlete-experiences-20260917]
  pull_request:
    paths:
      - 'athlete/**'
      - 'tests/athlete-workspace.mjs'
      - 'tests/athlete-workspace-browser.py'
      - 'tests/roster-athlete-experience.mjs'
      - '.github/workflows/athlete-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: athlete-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workspace source and renderer checks
        run: |
          node tests/athlete-workspace.mjs
          node tests/roster-athlete-experience.mjs
          node tests/athlete-access.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Chromium workspace journeys
        env:
          BROWSER: chromium
          ATHLETE_WORKSPACE_ARTIFACTS: /tmp/athlete-workspace/chromium
        run: python tests/athlete-workspace-browser.py
      - name: WebKit workspace journeys
        env:
          BROWSER: webkit
          ATHLETE_WORKSPACE_ARTIFACTS: /tmp/athlete-workspace/webkit
        run: python tests/athlete-workspace-browser.py
      - name: Preserve exact review source
        if: always()
        run: |
          mkdir -p /tmp/athlete-workspace
          git rev-parse HEAD > /tmp/athlete-workspace/commit.txt
          git archive --format=zip HEAD -- athlete private tests/athlete-workspace.mjs tests/roster-athlete-experience.mjs tests/athlete-workspace-browser.py .github/workflows/athlete-workspace.yml > /tmp/athlete-workspace/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athlete-workspace-review
          path: /tmp/athlete-workspace/
          retention-days: 5
