name: Share preview release checks
on:
  push:
    branches: [work/site-ecosystem-2026-09-16, main]
    paths:
      - index.html
      - scripts/*share*.cjs
      - scripts/guide-state.cjs
      - scripts/rpd-story-state.cjs
      - scripts/protected-site-baseline.cjs
      - tests/share-metadata.cjs
      - tests/homepage-metadata.cjs
      - docs/audits/HOME-DOCTRINE-RECEIPT-20260917.json
      - docs/audits/RPD-STORY-SHARE-RECEIPT-20260917.json
      - docs/audits/LATER-EXCLUDED-SITE-RECEIPT-20260917.json
      - og/form-share-20260916.jpg
      - .github/workflows/share-previews.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the committed source without rewriting it
        run: |
          set -o pipefail
          mkdir -p /tmp/share-receipt
          {
            node tests/share-metadata.cjs
            node tests/homepage-metadata.cjs
            node tests/homepage-release.cjs
            node tests/coaching-measurement.cjs
            node tests/cream-reading.cjs
            node labs/track/track.test.cjs
            node tests/thursday-schedule.cjs
          } | tee /tmp/share-receipt/tests.txt
          test ! -d .github/share-image
          git diff --exit-code
          git rev-parse HEAD > /tmp/share-receipt/commit.txt
          cp og/form-share-20260916.jpg /tmp/share-receipt/
          cp docs/audits/SHARE-METADATA-MANIFEST-20260916.json /tmp/share-receipt/
          cp docs/audits/HOME-DOCTRINE-RECEIPT-20260917.json /tmp/share-receipt/
          cp docs/audits/RPD-STORY-SHARE-RECEIPT-20260917.json /tmp/share-receipt/
          cp docs/audits/LATER-EXCLUDED-SITE-RECEIPT-20260917.json /tmp/share-receipt/
      - name: Verify the actual public release after main reaches production
        if: github.ref_name == 'main'
        run: node scripts/verify-share-production.cjs /tmp/share-receipt/production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: share-preview-receipt
          path: /tmp/share-receipt/
          retention-days: 14
