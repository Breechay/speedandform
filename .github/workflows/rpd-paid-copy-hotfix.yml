name: RPD paid copy hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rpd-paid-copy-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch paid-plan copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          # Speed That Endures: the study stays public; the training plan no longer does after W4.
          replace('labs/speed-that-endures/index.html',
                  '<h3>Race Pace Durability · free 15-week plan.</h3>',
                  '<h3>Race Pace Durability · Weeks 1–4 open.</h3>')
          replace('labs/speed-that-endures/index.html',
                  '<p>The free plan shows the published fifteen-week progression. José and Hope’s individual assignments can change as we learn from their work. The study records those decisions alongside the results.</p>',
                  '<p>The opening four weeks are free to run. The complete 15-week plan is $79 one time. José and Hope’s individual assignments can change as we learn from their work. The study records those decisions alongside the results.</p>')
          replace('labs/speed-that-endures/index.html',
                  '<p class="plate-alt">Or take the <a href="/plans/race-pace-durability/race-pace-durability.pdf">PDF</a> with you.</p>',
                  '<p class="plate-alt">Preview Weeks 1–4, then unlock the complete progression if you want to continue.</p>')
          replace('labs/speed-that-endures/index.html',
                  '<a class="go" href="/plans/race-pace-durability/">Open the plan</a>',
                  '<a class="go" href="/plans/race-pace-durability/">Preview the plan</a>')

          # The Bridge: make the commercial state visible without turning the study into a sales page.
          replace('labs/index.html',
                  '<div class="meta"><span>Inspect the plan</span><span>15 weeks ↗</span></div>',
                  '<div class="meta"><span>Weeks 1–4 open</span><span>$79 full ↗</span></div>')

          # Keep the preview-card generator from recreating stale “all plans are free” language later.
          replace('scripts/build-ecosystem-previews.mjs',
                  "['plans', 'PLANS', ['See how the', 'work builds.'], 'Free to read. Free to run.', 'Training with purpose, in sequence.', true],",
                  "['plans', 'PLANS', ['See how the', 'work builds.'], 'Preview the work. Follow the progression.', 'Training with purpose, in sequence.', true],")
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "FORM release bot"
          git config user.email "brice@speedandform.com"
          git rm .github/workflows/rpd-paid-copy-hotfix.yml
          git add labs/speed-that-endures/index.html labs/index.html scripts/build-ecosystem-previews.mjs
          git commit -m "Align Labs with paid Race Pace Durability offer"
          git push origin HEAD:main
