name: App preview polish
on:
  push:
    branches: [work/app-preview-polish]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align the reviewed circle to the lettering baseline
        run: |
          test "$GITHUB_REF_NAME" = work/app-preview-polish
          node scripts/app-preview-polish.cjs --apply
          node tests/app-preview-polish.cjs
          python - <<'PY'
          import subprocess
          allowed={'css/form-landing.css','docs/audits/FORM-LANDING-MANIFEST-20260917.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines());assert changed<=allowed,changed-allowed
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align the circular FORM period to the lettering baseline'
          git push origin HEAD:work/app-preview-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser runtime
        run: |
          python -m pip install playwright==1.58.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Review shape and optical baseline in both engines
        run: |
          BROWSER=chromium APP_POLISH_ARTIFACTS=/tmp/app-polish-receipt/chromium python tests/app-preview-polish-browser.py
          BROWSER=webkit APP_POLISH_ARTIFACTS=/tmp/app-polish-receipt/webkit python tests/app-preview-polish-browser.py
      - name: Save tested source
        if: always()
        run: |
          mkdir -p /tmp/app-polish-receipt
          git rev-parse HEAD > /tmp/app-polish-receipt/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-polish-receipt
          path: /tmp/app-polish-receipt/
          retention-days: 14
