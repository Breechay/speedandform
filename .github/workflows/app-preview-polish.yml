name: App preview polish
on:
  push:
    branches: [work/app-preview-polish, main]
    paths: ['forge-sculpt/index.html','form/index.html','css/sculpt-landing.css','css/form-landing.css','scripts/app-preview-polish.cjs','tests/app-preview-polish*','.github/workflows/app-preview-polish.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and earlier-release protections
        run: |
          set -o pipefail
          mkdir -p /tmp/app-polish-receipt
          for name in app-preview-polish sculpt-landing form-landing contact-notes ask-header training-guides guide-foundations track-gallery discovery share-metadata homepage-metadata homepage-release coaching-measurement cream-reading thursday-schedule; do node tests/$name.cjs; done | tee /tmp/app-polish-receipt/source-tests.txt
          node labs/track/track.test.cjs | tee -a /tmp/app-polish-receipt/source-tests.txt
          node scripts/build-discovery.cjs
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser runtime
        run: |
          python -m pip install playwright==1.58.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium webkit
      - name: Visual corrections in both engines and existing app interactions
        run: |
          BROWSER=chromium APP_POLISH_ARTIFACTS=/tmp/app-polish-receipt/chromium python tests/app-preview-polish-browser.py
          BROWSER=webkit APP_POLISH_ARTIFACTS=/tmp/app-polish-receipt/webkit python tests/app-preview-polish-browser.py
          SCULPT_ARTIFACTS=/tmp/app-polish-receipt/sculpt python tests/sculpt-landing-browser.py
          FORM_LANDING_ARTIFACTS=/tmp/app-polish-receipt/form python tests/form-landing-browser.py
      - name: Verify published app HTML and assets
        if: github.ref_name == 'main'
        run: |
          node scripts/verify-sculpt-production.cjs /tmp/app-polish-receipt/sculpt-production.json
          node scripts/verify-form-landing-production.cjs /tmp/app-polish-receipt/form-production.json
      - name: Verify actual live shapes and type in both engines
        if: github.ref_name == 'main'
        run: |
          APP_POLISH_LIVE=1 BROWSER=chromium APP_POLISH_ARTIFACTS=/tmp/app-polish-receipt/live-chromium python tests/app-preview-polish-browser.py
          APP_POLISH_LIVE=1 BROWSER=webkit APP_POLISH_ARTIFACTS=/tmp/app-polish-receipt/live-webkit python tests/app-preview-polish-browser.py
      - name: Save tested source
        if: always()
        run: |
          mkdir -p /tmp/app-polish-receipt
          git rev-parse HEAD > /tmp/app-polish-receipt/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-polish-receipt
          path: /tmp/app-polish-receipt/
          retention-days: 14
