name: Evidence review instruction acceptance
on:
  push:
    branches: [work/evidence-review-instruction-20260917]
  pull_request:
    paths:
      - 'coach/**'
      - 'athlete/**'
      - 'private/**'
      - 'supabase/migrations/20260918002500_evidence_review_instruction_chain.sql'
      - 'tests/evidence-review-instruction*'
      - '.github/workflows/evidence-review-instruction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-review-instruction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Review chain source checks
        run: |
          node tests/evidence-review-instruction.mjs
          node tests/console-delivery-overview.mjs
          node tests/four-runner-reconciliation.mjs
          node tests/athlete-access.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Chromium review journeys
        env:
          BROWSER: chromium
          REVIEW_CHAIN_ARTIFACTS: /tmp/review-chain/chromium
        run: python tests/evidence-review-instruction-browser.py
      - name: WebKit review journeys
        env:
          BROWSER: webkit
          REVIEW_CHAIN_ARTIFACTS: /tmp/review-chain/webkit
        run: python tests/evidence-review-instruction-browser.py
      - name: Preserve review source
        if: always()
        run: |
          mkdir -p /tmp/review-chain
          git rev-parse HEAD > /tmp/review-chain/commit.txt
          git archive --format=zip HEAD -- coach athlete private supabase/migrations/20260918002500_evidence_review_instruction_chain.sql tests/evidence-review-instruction.mjs tests/evidence-review-instruction-browser.py .github/workflows/evidence-review-instruction.yml > /tmp/review-chain/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-review-instruction-review
          path: /tmp/review-chain/
          retention-days: 5
