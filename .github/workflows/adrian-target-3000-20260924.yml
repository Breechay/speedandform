name: Adrian working 3000 kcal target acceptance
on:
  push:
    branches: [work/adrian-target-3000-20260924]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare validated food-day base
        run: |
          cp scripts/set-adrian-energy-target-20260924.py /tmp/adrian-target.py
          cp tests/adrian-nutrition-target.py /tmp/adrian-target-test.py
          git fetch origin work/validated-adrian-foodday-20260923
          git switch --detach origin/work/validated-adrian-foodday-20260923
          test "$(git rev-parse HEAD)" = a08e0e17283d263ba4834440738fd11faf257e99
          cp /tmp/adrian-target-test.py tests/adrian-nutrition-target.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acceptance dependencies
        run: |
          pip install playwright==1.58.0 beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Apply target and run scoped checks
        run: |
          python /tmp/adrian-target.py
          git diff > /tmp/first.diff
          python /tmp/adrian-target.py
          git diff > /tmp/second.diff
          cmp /tmp/first.diff /tmp/second.diff
          python tests/adrian-nutrition-target.py
          python tests/adrian-nutrition-foodday.py
          python tests/adrian-nutrition-labels.py
          python tests/adrian-nutrition-timing.py
      - name: Six-width browser acceptance
        run: python tests/adrian-nutrition-v15.py
      - name: Publish validated combined release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/studies/ADRIAN-NUTRITION-DECISION-20260924.json docs/studies/ADRIAN-NUTRITION-HOLD-20260923.md docs/roadmap/FORM-ROADMAP.md plans/adrian-nutrition-phase-01/index.html plans/adrian-nutrition-phase-01/review-context.json tests/adrian-nutrition-target.py tests/adrian-nutrition-foodday.py tests/adrian-nutrition-labels.py tests/adrian-nutrition-timing.py
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git diff --cached --check
          git commit -m 'Adrian v1.5.7: set approximate 3000 kcal working target'
          git push origin HEAD:refs/heads/work/validated-adrian-target-3000-20260924
          echo "VALIDATED_COMMIT=$(git rev-parse HEAD)"
