name: Materialize website consolidation artifacts
on:
  push:
    branches:
      - release/cinematic-site-consolidation-20261014
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cinematic-site-consolidation-20261014
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild reviewed static projections
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/build-running-lessons.cjs
          node scripts/build-discovery.cjs
          node scripts/build-public-share.cjs
          node scripts/build-site-menu.cjs
          # Start only from the last owner-reviewed source, then materialize the
          # already-authored Oct 13 result before Netlify builds its public pages.
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto');
          const sha=s=>crypto.createHash('sha256').update(s).digest('hex');
          const file='labs/speed-that-endures/index.html',proj='data/public-studies/speed-that-endures.json';
          const original=cp.execFileSync('git',['show','HEAD:'+file],{encoding:'utf8'});
          const snapshot=JSON.parse(cp.execFileSync('git',['show','HEAD:'+proj],{encoding:'utf8'}));
          if(sha(original)!==snapshot.source_sha256)throw Error('The tracked athlete study changed outside approved evidence review');
          if(snapshot.latest_completed.date!=='2026-09-29'||snapshot.latest_completed.distance_mi!==6)
            throw Error('Wrong completed shared race-pace milestone');
          NODE
          node scripts/studies/apply-jose-oct13.cjs
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const {transformHtml}=require('./scripts/build-site-menu.cjs');
          const file='labs/speed-that-endures/index.html',proj='data/public-studies/speed-that-endures.json';
          const fresh=fs.readFileSync(file,'utf8'),snapshot=JSON.parse(fs.readFileSync(proj,'utf8'));
          const hash=crypto.createHash('sha256').update(fresh).digest('hex');
          if(!fresh.includes('id="oct13-jose"')||!fresh.includes('id="rhythm-read"'))
            throw Error('Approved study evidence anchors are missing');
          if(snapshot.latest_support?.date!=='2026-10-13'||snapshot.source_sha256!==hash)
            throw Error('Oct 13 observation and public checksum must be reviewed together');
          if(transformHtml(fresh,file)!==fresh)throw Error('Study menu projection is not idempotent');
          NODE
          node tests/public-study-preview.cjs
          node tests/public-share.cjs
          node tests/site-menu.cjs
          node tests/running-library.cjs
          node tests/homepage-release.cjs
          node tests/form-landing.cjs
          node tests/sculpt-landing.cjs
      - name: Commit canonical generated pages only
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Materialize cinematic public pages and discovery with canonical shared menu"
            git push origin HEAD:release/cinematic-site-consolidation-20261014
          fi
