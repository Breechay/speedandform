name: Speed That Endures Sep 11 patch
on:
  push:
    branches:
      - chatgpt/rpd-w3-threshold-spine
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make patch script version-safe
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/update_speed_endures_sep11.py')
          s = p.read_text()
          old = """one('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5', 'css version')
one('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5', 'js version')"""
          new = """n = s.count('FORM LABS. SPEED THAT ENDURES · v7.4')
if n < 1:
    raise SystemExit('study version: no v7.4 marker found')
s = s.replace('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5')"""
          if old not in s:
              raise SystemExit('version patch block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Patch study
        run: python scripts/update_speed_endures_sep11.py
      - name: Verify scope
        shell: bash
        run: |
          git checkout -- scripts/update_speed_endures_sep11.py
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          git diff --name-only | grep -qx 'labs/speed-that-endures/index.html'
      - name: Commit to main
        shell: bash
        run: |
          git config user.name "Brice Ikouebe"
          git config user.email "briceikouebe@gmail.com"
          git rm scripts/update_speed_endures_sep11.py
          git add labs/speed-that-endures/index.html
          git commit -m "Study: file Hope W3 and progress the ceiling [skip ci]"
          git push origin HEAD:main
