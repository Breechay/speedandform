name: One-off Speed That Endures W3 update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneoff-speed-endures-sep11.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make patch script version-safe
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('scripts/update_speed_endures_sep11.py')
          s = p.read_text()
          old = """one('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5', 'css version')
one('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5', 'js version')"""
          new = """n = s.count('FORM LABS. SPEED THAT ENDURES · v7.4')
if n < 1:
    raise SystemExit('study version: no v7.4 marker found')
s = s.replace('FORM LABS. SPEED THAT ENDURES · v7.4', 'FORM LABS. SPEED THAT ENDURES · v7.5')"""
          if old not in s:
              raise SystemExit('version patch block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Patch study
        run: python scripts/update_speed_endures_sep11.py
      - name: Verify output
        shell: bash
        run: |
          git checkout -- scripts/update_speed_endures_sep11.py
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          git diff --name-only | grep -qx 'labs/speed-that-endures/index.html'
          grep -q 'HOPE → 6:45–7:00 /MI' labs/speed-that-endures/index.html
          grep -q '6:50 · 6:50 · 6:53 · 6:50' labs/speed-that-endures/index.html
          grep -q 'Ceiling progression · Thu' labs/speed-that-endures/index.html
          grep -q '3 × 10 min threshold' labs/speed-that-endures/index.html
          grep -q '2 × 15 min threshold' labs/speed-that-endures/index.html
      - name: Commit study and remove one-off helpers
        shell: bash
        run: |
          git config user.name 'Breechay'
          git config user.email 'briceikouebe@gmail.com'
          git add labs/speed-that-endures/index.html
          git rm scripts/update_speed_endures_sep11.py
          git rm .github/workflows/oneoff-speed-endures-sep11.yml
          git commit -m 'Labs: file paired W3 and add threshold spine'
          git push origin HEAD:main
