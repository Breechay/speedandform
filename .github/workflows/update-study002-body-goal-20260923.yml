name: Update Study 002 body goal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/update-study002-body-goal-20260923.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read current goal anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('labs/rebuilt-athlete/index.html')
          text = path.read_text()
          text = re.sub(r'data:image/[^\s\"\'<>]+', '[EMBEDDED_IMAGE]', text)
          print('STUDY_GOAL_SOURCE_BEGIN')
          lines = text.splitlines()
          targets = set()
          for n, line in enumerate(lines):
              if re.search(r'180|185|8.{0,6}10|goal|target|body.?fat|body.?comp', line, re.I) and len(line) < 3000:
                  targets.update(range(max(0,n-1),min(len(lines),n+2)))
          for n in sorted(targets):
              print(f'{n+1}: {lines[n]}')
          print('STUDY_GOAL_SOURCE_END')
          print('STUDY_RELATED_FILES')
          for root in ['docs/studies','assets/data']:
              for f in Path(root).glob('*'):
                  if any(s in f.name.lower() for s in ['rebuilt','brice','002']):
                      print(f)
          PY
