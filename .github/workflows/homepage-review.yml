name: Homepage reviewed release
on:
  push:
    branches: [work/homepage-single-runner-20260916]
    paths: [.github/workflows/homepage-review.yml]
permissions:
  contents: write
jobs:
  reviewed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/homepage-single-runner-20260916
      - name: Import only the approved public release files
        env:
          RELEASE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-7cc8-81f5-8753-386ce92fcbce/raw?se=2026-09-16T18%3A01%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=5eaca0f2-62b1-5acb-9955-7fc1707176e3&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T13%3A04%3A04Z&ske=2026-09-17T13%3A04%3A04Z&sks=b&skv=2026-02-06&sig=9XX9xcY4BIcZOhXwFdRgUyxGRoa43yX5cBhO4dHtrsU%3D'
        run: |
          echo "::add-mask::$RELEASE_URL"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '996b879d7ae2b8a4538feaa9e1d8d14e021efe71'
          test "$(git hash-object index.html)" = '8460342e2959fa121652d6883ec6d0633a3222dd'
          curl --fail --silent --show-error --max-time 60 "$RELEASE_URL" -o /tmp/home-release.zip
          echo '45850b91296b8939486269b270579d31646e5b9290e3abb29516d8f5337c2d34  /tmp/home-release.zip' | sha256sum --check
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          allowed=set('index.html css/homepage.css js/homepage-motion.js js/coaching-measurement.js media/form-analysis-track-square.mp4 media/form-analysis-track-poster.jpg tests/homepage-metadata.cjs tests/homepage-release.cjs tests/homepage-browser.py tests/homepage_render.py docs/audits/HOME-SINGLE-RUNNER-20260916.md docs/roadmap/FORM-ROADMAP.md'.split())
          with zipfile.ZipFile('/tmp/home-release.zip') as z:
              assert set(z.namelist())==allowed|{'release-manifest.json'}
              manifest=json.loads(z.read('release-manifest.json'))
              assert set(manifest)==allowed
              for name in sorted(allowed):
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==manifest[name], name
                  p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          Path('/tmp/release-paths.txt').write_text('\n'.join(sorted(allowed))+'\n')
          PY
      - name: Verify existing and new release invariants
        run: |
          node --check js/homepage-motion.js
          node --check js/coaching-measurement.js
          node tests/coaching-measurement.cjs
          node tests/homepage-metadata.cjs
          node tests/homepage-release.cjs
      - name: Browser regression checks with synthetic requests only
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          python -m pip install --quiet playwright
          python tests/homepage-browser.py
      - name: Commit only the reviewed paths to the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < /tmp/release-paths.txt
          git diff --cached --check
          git commit -m 'feat: publish single-runner coaching and coherent homepage [skip netlify]'
          git push origin HEAD:work/homepage-single-runner-20260916
          echo "TESTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat HEAD^ HEAD >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-release-browser-qa
          path: .homepage-qa/
          retention-days: 3
          if-no-files-found: ignore
