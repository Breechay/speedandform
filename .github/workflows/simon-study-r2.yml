name: Simon Study 003 R2
on:
  push:
    branches: [work/simon-evidence-hardening-20260923]
    paths:
      - scripts/studies/build-simon-r2.cjs
      - labs/the-two-curves/plan-projection.js
      - labs/the-two-curves/evidence.json
      - tests/simon-study-r2.cjs
      - tests/simon-study-browser.py
      - .github/workflows/simon-study-r2.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: simon-study-r2-review
  cancel-in-progress: false
jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build from the approved publication
        run: |
          mkdir -p /tmp/simon-study-qa
          node --check scripts/studies/build-simon-r2.cjs
          node --check labs/the-two-curves/plan-projection.js
          node scripts/studies/build-simon-r2.cjs | tee /tmp/simon-study-qa/build.json
          node tests/simon-study-r2.cjs /tmp/simon-study-qa/contract.json
          node tests/cream-reading.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Responsive and failure-state acceptance
        run: |
          python -m http.server 8765 >/tmp/simon-study-server.log 2>&1 &
          python tests/simon-study-browser.py
      - name: Public access contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const api='https://pbgsjjegycacodiltbhn.supabase.co/rest/v1/rpc/';
          const headers={apikey:'sb_publishable_5Dg5TUvnh2mEo-zCYAbgmw_WHNXKDqj','Content-Type':'application/json'};
          (async()=>{
            const r=await fetch(api+'study_003_plan',{method:'POST',headers,body:'{}'});assert.equal(r.status,200);const p=await r.json();assert.equal(p.state,'published');assert.equal(p.payload.version.number,2);
            const denied=await fetch(api+'public_plan',{method:'POST',headers,body:JSON.stringify({p_slug:'race-pace-durability'})});assert.ok([401,403,404].includes(denied.status));
            const arbitrary=await fetch(api+'study_003_plan',{method:'POST',headers,body:JSON.stringify({p_slug:'race-pace-durability'})});assert.ok([400,404].includes(arbitrary.status));
            fs.writeFileSync('/tmp/simon-study-qa/access.json',JSON.stringify({approved_projection:r.status,version:p.payload.version.number,paid_plan_denied:denied.status,arbitrary_slug_denied:arbitrary.status},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Commit only generated study projections and pointers
        run: |
          git config user.name 'FORM Study Review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/the-two-curves/index.html labs/the-two-curves/published-plan.json labs/the-two-curves/published-plan.js AGENTS.md docs/roadmap/FORM-ROADMAP.md
          if ! git diff --cached --quiet; then
            git commit -m 'Study 003: publish reviewed evidence, recovery-led plan and agent protocol'
            git push origin HEAD:${{ github.ref_name }}
          fi
          git rev-parse HEAD > /tmp/simon-study-qa/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simon-study-r2-acceptance
          path: /tmp/simon-study-qa/
          retention-days: 14
