name: Simon Study 003
on:
  pull_request:
    paths:
      - 'scripts/studies/*simon*'
      - scripts/form-observation-continuity-20261006.cjs
      - 'labs/the-two-curves/**'
      - 'tests/simon-study*'
      - docs/studies/SIMON-STUDY-003.md
      - .github/workflows/simon-study-r2.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simon-study-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the committed approved publication
        run: |
          mkdir -p /tmp/simon-study-qa
          node --check scripts/studies/build-simon-r2.cjs
          node --check labs/the-two-curves/plan-projection.js
          node scripts/studies/build-simon-r2.cjs --refresh-only --publication-file labs/the-two-curves/published-plan.json | tee /tmp/simon-study-qa/build.json
          git diff --exit-code -- labs/the-two-curves/
          node tests/simon-study-r2.cjs /tmp/simon-study-qa/contract.json
          node tests/cream-reading.cjs
      - name: Browser tooling
        run: |
          npm install --prefix /tmp/simon-browser-check --no-audit --no-fund playwright@1.55.0
          /tmp/simon-browser-check/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Responsive, refresh and failure-state acceptance
        env:
          PLAYWRIGHT_MODULE: /tmp/simon-browser-check/node_modules/playwright
        run: |
          python -m http.server 8765 >/tmp/simon-study-server.log 2>&1 &
          node tests/simon-study-browser.cjs
      - name: Public access contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const saved=require('./labs/the-two-curves/published-plan.json');
          const api='https://pbgsjjegycacodiltbhn.supabase.co/rest/v1/rpc/';
          const headers={apikey:'sb_publishable_5Dg5TUvnh2mEo-zCYAbgmw_WHNXKDqj','Content-Type':'application/json'};
          (async()=>{
            const r=await fetch(api+'study_003_plan',{method:'POST',headers,body:'{}'});assert.equal(r.status,200);const p=await r.json();assert.equal(p.state,'published');assert.equal(p.revision,saved.revision);assert.equal(p.payload.version.number,saved.payload.version.number);
            const denied=await fetch(api+'public_plan',{method:'POST',headers,body:JSON.stringify({p_slug:'race-pace-durability'})});assert.ok([401,403,404].includes(denied.status));
            const arbitrary=await fetch(api+'study_003_plan',{method:'POST',headers,body:JSON.stringify({p_slug:'race-pace-durability'})});assert.ok([400,404].includes(arbitrary.status));
            fs.writeFileSync('/tmp/simon-study-qa/access.json',JSON.stringify({approved_projection:r.status,version:p.payload.version.number,paid_plan_denied:denied.status,arbitrary_slug_denied:arbitrary.status},null,2));
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Record tested source
        run: git rev-parse HEAD > /tmp/simon-study-qa/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simon-study-acceptance
          path: /tmp/simon-study-qa/
          retention-days: 14
