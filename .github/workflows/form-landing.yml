name: FORM landing release checks
on:
  push:
    branches: [work/form-landing-pass5a]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export source delta from previous verified review
        run: |
          mkdir -p /tmp/form-landing-source
          git bundle create /tmp/form-landing-source/source.bundle HEAD ^c1cf76da68a64e6b06e2f4fcd008f6c288b811c2
          git rev-parse HEAD > /tmp/form-landing-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: form-landing-source
          path: /tmp/form-landing-source/
          retention-days: 2
