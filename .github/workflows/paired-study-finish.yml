name: Finish connected study source
on:
  push:
    branches: [work/paired-study-20261004]
    paths: ['.github/workflows/paired-study-finish.yml']
permissions:
  contents: write
jobs:
  finish:
    if: github.repository == 'Breechay/speedandform' && github.ref == 'refs/heads/work/paired-study-20261004'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml playwright && python -m playwright install --with-deps chromium
      - name: Repeat source assembly and verification, leaving workflows untouched
        shell: python
        env:
          FORM_BROWSER_NETWORK: '1'
          FORM_SCREENSHOTS: /tmp/paired-qa
        run: |
          import pathlib,subprocess,yaml
          d=yaml.safe_load(pathlib.Path('.github/workflows/paired-study-install.yml').read_text())
          steps=d['jobs']['assemble']['steps']
          wanted=['Apply exact locally verified source changes','Capture matched public plans and build all connected views','Source and privacy contracts','Build existing site pipeline','Real browser layouts, filters, units, privacy and offline tests','Create reproducible study share-card renderer','Render share card']
          for name in wanted:
            step=next(x for x in steps if x.get('name')==name)
            if step.get('shell')=='python': exec(compile(step['run'],name,'exec'),{})
            else: subprocess.run(['bash','-e','-c',step['run']],check=True)
          commit=next(x for x in steps if x.get('name')=='Commit only the verified study scope to its branch')['run']
          commit=commit.replace(' .github/workflows/paired-study.yml','').replace('git add -u .github/workflows .paired-source','')
          subprocess.run(['bash','-e','-c',commit],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-study-final-verification
          path: /tmp/paired-qa
          retention-days: 7
