name: Materialize reviewed track album
on:
  push:
    branches:
      - design/album-editorial-originals-20261015
permissions:
  contents: write
jobs:
  album:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/album-editorial-originals-20261015
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install genuine media tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow==11.3.0
      - name: Generate and verify approved album
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/prepare-track-media.py
          node scripts/build-track-gallery.cjs
          node scripts/build-photo-library.cjs
          node scripts/build-site-menu.cjs
          node tests/photo-editorial.cjs
          node tests/site-menu.cjs
          node tests/track-gallery.cjs
      - name: Commit exact generated photographs and static pages
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add -A -- media/track track/media-manifest.json track/index.html track/from-practice track/track-practice photos/index.html
          git add -u -- ':!track/albums.json'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Materialize eight approved track frames, full-resolution viewers and FORM photo index'
            git push origin HEAD:design/album-editorial-originals-20261015
          fi
