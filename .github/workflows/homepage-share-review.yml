name: Homepage share image review
on:
  push:
    branches: [chatgpt/homepage-share-20260916]
    paths: [.github/workflows/homepage-share-review.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard concurrent production work
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git show origin/main:index.html > /tmp/original-homepage.html
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-croscore
          python -m pip install 'Pillow==11.3.0'
      - name: Render the reviewed film frame
        run: |
          sed -i 's/\.st_size():/\.st_size:/' scripts/render_homepage_share.py
          python scripts/render_homepage_share.py
      - name: Update metadata only and record scope
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape
          import json
          import subprocess
          file=Path('index.html')
          old=file.read_text()
          prefix, separator, rest=old.partition('<style>')
          assert separator and '<meta property="og:title"' in prefix
          assert '<script type="application/ld+json"' not in old
          url='https://speedandform.com/'
          image=url+'og/homepage-run-development-20260916.jpg'
          seo_title='Running Coach in Miami & Online | Speed & Form'
          seo_description='Run better, get faster, and run farther with Brice. Individual running plans, track coaching in Miami, and remote feedback. Start with eight weeks.'
          share_title='Run better. Get faster. Run farther. | FORM'
          share_description='Individual running coaching with Brice. A plan built around your fitness, your goal, and your week. Miami + remote. Eight weeks to begin.'
          alt='Two runners mid-stride in a monochrome frame from the homepage film beside Run Development, with Brice, Miami + Remote.'
          lines=['<!doctype html>','<html lang="en">','<head>','<meta charset="utf-8">','<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',f'<title>{escape(seo_title)}</title>']
          def meta(attr, name, value):
              lines.append(f'<meta {attr}="{name}" content="{escape(value, quote=True)}">')
          meta('name','description',seo_description)
          meta('name','robots','index,follow,max-image-preview:large')
          lines += ['<link rel="canonical" href="https://speedandform.com/">','<link rel="icon" href="/favicon.ico">','<link rel="apple-touch-icon" href="/apple-touch-icon.png">']
          meta('name','theme-color','#020806')
          for key,value in [('type','website'),('title',share_title),('description',share_description),('url',url),('site_name','Speed & Form'),('locale','en_US'),('image',image),('image:secure_url',image),('image:type','image/jpeg'),('image:width','1200'),('image:height','630'),('image:alt',alt)]:
              meta('property','og:'+key,value)
          for key,value in [('card','summary_large_image'),('title',share_title),('description',share_description),('image',image),('image:alt',alt)]:
              meta('name','twitter:'+key,value)
          lines += ['<link rel="preload" as="image" href="/media/run-development.jpg?v=rd26" fetchpriority="high">']
          schema={'@context':'https://schema.org','@graph':[
              {'@type':'Organization','@id':url+'#organization','name':'Speed & Form','alternateName':'FORM','url':url},
              {'@type':'WebSite','@id':url+'#website','url':url,'name':'Speed & Form','alternateName':'FORM','inLanguage':'en-US','publisher':{'@id':url+'#organization'}},
              {'@type':'WebPage','@id':url+'#webpage','url':url,'name':seo_title,'description':seo_description,'inLanguage':'en-US','isPartOf':{'@id':url+'#website'},'mainEntity':{'@id':url+'#run-development'},'primaryImageOfPage':{'@type':'ImageObject','url':image,'width':1200,'height':630}},
              {'@type':'Service','@id':url+'#run-development','name':'Run Development','serviceType':'Individual running coaching','description':'Individual running plans, weekly track coaching in Miami, and remote coaching with video feedback and adjustments.','url':url,'provider':{'@id':url+'#organization'},'areaServed':[{'@type':'City','name':'Miami'},'Online']}
          ]}
          lines += ['<script type="application/ld+json">',json.dumps(schema,ensure_ascii=False,indent=2),'</script>']
          new='\n'.join(lines)+'\n<style>'+rest
          assert new.partition('<style>')[2] == old.partition('<style>')[2]
          assert new.partition('<style>')[2] == Path('/tmp/original-homepage.html').read_text().partition('<style>')[2]
          file.write_text(new)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          Path('docs/audits/HOME-SHARE-SEO-20260916.md').write_text(f'''# Homepage share image and SEO
          
          Date: September 16, 2026. Owner: Brice. Scope: homepage metadata and its dedicated social image only.
          
          ## Implementation
          
          - Real existing film: `media/run-development.mp4`, 1080 x 1920, 20.5 seconds. Selected frame: 6.300 seconds.
          - New JPEG: `og/homepage-run-development-20260916.jpg`, 1200 x 630, approximately 76 KB. The vertical source is cropped without stretching, converted to monochrome and set beside the homepage's editorial Run Development heading.
          - No generated athletes, altered bodies, fabricated results, fake buttons or new claims. Existing `og/default.jpg` remains unchanged for other pages.
          - Search title: Running Coach in Miami & Online | Speed & Form.
          - Shared-link title: Run better. Get faster. Run farther. | FORM.
          - Added explicit Twitter title/description/image/alt, image MIME/secure URL, locale, large-image preview permission and Organization/WebSite/WebPage/Service JSON-LD. Canonical remains the root homepage.
          - Page CSS, body, original hero film, intake, pricing, offer, measurement, auth links and page scripts are byte-for-byte unchanged from the current main source.
          
          ## Verification
          
          - Film inspected as a 20-frame contact sheet; six exact candidate timestamps compared; selected frame and full-size card inspected.
          - Typography corrected to a common baseline; no duplicate dividers. Card checked at full resolution and small preview size.
          - `node tests/homepage-metadata.cjs` verifies unique head tags, canonical, JSON parsing, image dimensions/MIME signature/size, original film and measurement reference.
          - Build source: `{source}`. The one-off review workflow is removed from the final tree. No hosting/build configuration is changed.
          
          ## Release checklist
          
          - [x] Metadata/source checks and real-film render.
          - [x] Existing page CSS/body/scripts preserved exactly.
          - [ ] Verify production HTML and dedicated JPEG after release. Production was not yet verified at this implementation checkpoint.
          - [ ] Fresh iMessage/WhatsApp native previews on a physical phone. Browser/metadata checks are not a native device test; previous sent cards and third-party caches can retain older metadata.
          
          Reproduce: install ffmpeg, Pillow and fonts-croscore; run `python scripts/render_homepage_share.py`, then `node tests/homepage-metadata.cjs`. Do not distribute font files. Make a new image filename when artwork changes.
          
          No search ranking or click-through uplift is claimed. Google determines its rendered search title/snippet and must recrawl changes.
          '''.replace('\n          ','\n'))
          roadmap=Path('docs/roadmap/FORM-ROADMAP.md')
          text=roadmap.read_text()
          marker='| --- | --- | --- |'
          assert marker in text and 'Homepage film share image' not in text
          row='| Homepage film share image + SEO | IMPLEMENTED; native preview OPEN | September 16: real 6.300s hero-film frame, dedicated 1200 x 630 JPEG, benefit-led shared-link title, search metadata and structured data. Layout, intake and offer unchanged. Tests: `node tests/homepage-metadata.cjs`. Production verification and the single release checklist are in [homepage share audit](../audits/HOME-SHARE-SEO-20260916.md). |'
          roadmap.write_text(text.replace(marker,marker+'\n'+row,1))
          print('PASS: metadata only; all CSS/body/intake/pricing/scripts unchanged.')
          PY
      - name: Validate and commit only the scoped change to the work branch
        run: |
          node tests/homepage-metadata.cjs
          git rm .github/workflows/homepage-share-review.yml
          git add index.html og/homepage-run-development-20260916.jpg scripts/render_homepage_share.py tests/homepage-metadata.cjs docs/audits/HOME-SHARE-SEO-20260916.md docs/roadmap/FORM-ROADMAP.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare verified homepage film share image and SEO [skip netlify]'
          git push origin HEAD:chatgpt/homepage-share-20260916
          mkdir -p /tmp/homepage-result/og
          cp index.html /tmp/homepage-result/
          cp og/homepage-run-development-20260916.jpg /tmp/homepage-result/og/
          cp docs/audits/HOME-SHARE-SEO-20260916.md /tmp/homepage-result/
          git rev-parse HEAD > /tmp/homepage-result/result-commit.txt
          git diff origin/main --stat > /tmp/homepage-result/diff-stat.txt
          git diff origin/main -- index.html > /tmp/homepage-result/metadata.patch
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-share-result
          path: /tmp/homepage-result
          retention-days: 1
