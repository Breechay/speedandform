name: Adrian nutrition final intake acceptance
on:
  push:
    branches: [work/adrian-nutrition-completion-20260922]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adrian-nutrition-completion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  complete-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped intake and copy refinement
        run: |
          node scripts/complete-adrian-nutrition-20260922.cjs
          node scripts/refine-adrian-nutrition-copy-20260922.cjs
          node scripts/refine-adrian-nutrition-copy-20260922.cjs
          node tests/cream-reading.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance
        run: python tests/adrian-nutrition-browser.py
      - name: Commit final source after acceptance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plans/adrian-nutrition-phase-01/index.html labs/adrian-runner-mass/index.html docs/studies/ADRIAN-NUTRITION-INTAKE-20260922.json docs/roadmap/FORM-ROADMAP.md tests/adrian-nutrition-browser.py
          git diff --cached --quiet || git commit -m 'Simplify Adrian nutrition actions; remove top navigation and coach-contact commentary'
          git push origin HEAD
          git rev-parse HEAD > /tmp/adrian-nutrition/commit.txt
          cp labs/adrian-runner-mass/index.html /tmp/adrian-nutrition/study.html
          cp plans/adrian-nutrition-phase-01/index.html /tmp/adrian-nutrition/nutrition.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adrian-nutrition-completion-acceptance
          path: /tmp/adrian-nutrition/
          retention-days: 7
