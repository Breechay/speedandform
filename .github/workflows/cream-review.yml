name: Cream reading review
on:
  push:
    branches: [work/cream-reading-20260916]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exactly reviewed source bundle
        shell: python
        run: |
          import base64, gzip, hashlib, json
          from pathlib import Path
          # Temporary transport from the offline review workspace. This workflow
          # is removed before merge; resulting files are ordinary readable code.
          payload = ''''''
          raw = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == 'c5ef15732a8d6377f4f0c337a8644f798d526207fbb7f04ad36a8001394161c8'
          bundle = json.loads(raw)
          assert set(bundle) == {'css/cream-reading.css','scripts/migrate-cream-reading.py','tests/cream-reading.py','docs/audits/CREAM-READING-20260916.md'}
          for name, text in bundle.items():
              path = Path(name); path.parent.mkdir(parents=True,exist_ok=True); path.write_text(text)
      - name: Apply explicit public-page manifest
        run: python scripts/migrate-cream-reading.py
      - name: Record the shared direction and roadmap
        shell: python
        run: |
          from pathlib import Path
          path=Path('docs/roadmap/FORM-ROADMAP.md'); text=path.read_text()
          row='| Public cream reading surfaces | STAGED; production verification pending | September 16: 82 public cream pages now share the homepage typography and palette, including every Library destination. Mobile stacking, readable secondary text, single dividers and existing tools checked. The one checklist and release receipt are in [cream reading audit](../audits/CREAM-READING-20260916.md). Dark surfaces, homepage, checkout and private apps are unchanged. |\n'
          if '| Public cream reading surfaces |' not in text:
              text=text.replace('| Homepage single-runner coaching path |',row+'| Homepage single-runner coaching path |',1)
          path.write_text(text)
          path=Path('docs/FORM_TYPOGRAPHY_STANDARD.md'); text=path.read_text()
          section='\n## Public cream pages: September 16 direction\n\nBrice explicitly chose the current homepage cream sections as the reference for Library and related cream pages. These opt in with `html[data-cream]` and load `css/cream-reading.css`: Georgia headings, native system sans body, restrained system mono labels, near-black ink and readable warm-gray secondary text. Do not reintroduce Cormorant/Jost, 8px labels or low-opacity instructions on these surfaces. Dark pages, private apps and native surfaces keep their own systems. See the [cream reading audit](audits/CREAM-READING-20260916.md) and its explicit migration manifest.\n'
          if '## Public cream pages: September 16 direction' not in text: text+=section
          path.write_text(text)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser prerequisites
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser and preservation tests
        env:
          CREAM_BASE: fd18f73494280c4c87e841850714c8db9bfea390
        run: python -u tests/cream-reading.py
      - name: Existing regression checks
        run: |
          node tests/coaching-measurement.cjs
          node tests/thursday-schedule.cjs
          node tests/homepage-metadata.cjs
          node tests/homepage-release.cjs
          git diff --check
      - name: Commit only the reviewed manifest
        shell: python
        run: |
          import importlib.util, subprocess, json, hashlib
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('m','scripts/migrate-cream-reading.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          path=Path('docs/audits/CREAM-READING-20260916.md'); text=path.read_text().replace('- [ ] Full-repository GitHub Actions run','- [x] Full-repository GitHub Actions run'); path.write_text(text)
          files=m.FILES+['css/cream-reading.css','scripts/migrate-cream-reading.py','tests/cream-reading.py','docs/audits/CREAM-READING-20260916.md','docs/roadmap/FORM-ROADMAP.md','docs/FORM_TYPOGRAPHY_STANDARD.md']
          subprocess.run(['git','add','--',*files],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(staged)==set(files), staged
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','style: align 82 public cream pages with the homepage [skip netlify]'],check=True)
          subprocess.run(['git','push','origin','HEAD:work/cream-reading-20260916'],check=True)
          receipt={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files}}
          Path('.cream-qa/commit.json').write_text(json.dumps(receipt,indent=2))
          Path('.cream-qa/change.patch').write_bytes(subprocess.check_output(['git','diff','fd18f73494280c4c87e841850714c8db9bfea390','--',*files]))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cream-reading-verified
          path: .cream-qa
          include-hidden-files: true
          retention-days: 3
