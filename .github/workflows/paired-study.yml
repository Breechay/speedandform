name: Connected study contracts
on:
  push:
    branches: [main, work/paired-study-20261004]
    paths:
      - 'data/studies/**'
      - 'scripts/studies/*paired*'
      - 'labs/the-two-curves/**'
      - 'labs/same-pace-different-problem/**'
      - 'labs/shared/**'
      - 'plans/elijah-savannah-half/**'
      - 'tests/paired-study*'
      - '.github/workflows/paired-study.yml'
  pull_request:
    paths:
      - 'data/studies/**'
      - 'scripts/studies/*paired*'
      - 'labs/the-two-curves/**'
      - 'labs/same-pace-different-problem/**'
      - 'labs/shared/**'
      - 'plans/elijah-savannah-half/**'
      - 'tests/paired-study*'
      - '.github/workflows/paired-study.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/studies/build-paired-study.cjs --refresh
      - run: node tests/paired-study-contract.cjs
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/paired-study-browser.py
        env:
          FORM_BROWSER_NETWORK: '1'
          FORM_SCREENSHOTS: /tmp/paired-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-study-browser-evidence
          path: /tmp/paired-qa
          retention-days: 7
