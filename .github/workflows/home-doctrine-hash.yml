name: Inventory unresolved later share snapshots
on:
  push:
    branches: [work/share-home-doctrine-receipt-20260917]
    paths: [.github/workflows/home-doctrine-hash.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print unresolved excluded-page drift
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const {sha}=require('./scripts/share-metadata.cjs');
          const manifest=JSON.parse(fs.readFileSync('docs/audits/SHARE-METADATA-MANIFEST-20260916.json','utf8'));
          const editorial=require('./scripts/guide-state.cjs');
          const updates=editorial.latestUpdates;
          let count=0;
          for(const row of manifest.excluded){
            const actual=sha(fs.readFileSync(row.file));
            const expected=updates.get(row.file)?.afterSha256||row.sha256;
            if(actual!==expected){
              count++;
              console.log('UNRESOLVED='+row.file);
              console.log('ACTUAL='+actual);
              console.log('BASELINE='+row.sha256);
            }
          }
          console.log('UNRESOLVED_COUNT='+count);
          NODE
