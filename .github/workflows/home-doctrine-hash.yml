name: Verify later share receipts
on:
  push:
    branches: [work/share-home-doctrine-receipt-20260917]
    paths: [.github/workflows/home-doctrine-hash.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify share and homepage contracts
        run: |
          node tests/share-metadata.cjs
          node tests/homepage-metadata.cjs
          node tests/homepage-release.cjs
          node tests/coaching-measurement.cjs
          node tests/cream-reading.cjs
          node labs/track/track.test.cjs
          node tests/thursday-schedule.cjs
