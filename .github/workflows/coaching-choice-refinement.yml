name: Verify coaching selector refinement
on:
  push:
    branches: [work/coaching-selector-20260916]
    paths: [.github/workflows/coaching-choice-refinement.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coaching-selector-20260916
      - name: Apply the narrow integration and regression edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html'); data=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='23e2c12fb250b6765940403566819407eb23388d', 'Homepage changed; review before retrying'
          s=data.decode()
          s=s.replace('<link rel="stylesheet" href="/css/homepage.css?v=20260916-single-runner">','<link rel="stylesheet" href="/css/homepage.css?v=20260916-single-runner">\n<link rel="stylesheet" href="/css/coaching-choice.css?v=20260916-picker">')
          s=s.replace('<script defer src="/js/homepage-motion.js?v=20260916-single-runner"></script>','<script defer src="/js/coaching-choice.js?v=20260916-picker"></script>\n<script defer src="/js/homepage-motion.js?v=20260916-single-runner"></script>')
          s=s.replace('$("#coachingChoice").value = link.dataset.coaching; if ($("#p-read").classList.contains("on")) build();','$("#coachingChoice").value = link.dataset.coaching; $("#coachingChoice").dispatchEvent(new Event("change", {bubbles:true}));')
          p.write_text(s)
          p=Path('tests/homepage-browser.py');s=p.read_text()
          s=s.replace("pg.select_option('#coachingChoice','both');", "pg.locator('#coachingChoiceTrigger').click();pg.locator('#coachingChoiceOption-1').click();")
          s=s.replace("pg.select_option('#coachingChoice','remote');", "pg.locator('#coachingChoiceTrigger').click();pg.locator('#coachingChoiceOption-2').click();")
          s=s.replace("pg.select_option('#coachingChoice','run')", "pg.locator('#coachingChoiceTrigger').click();pg.locator('#coachingChoiceOption-0').click()")
          s=s.replace("pg.emulate_media(reduced_motion='reduce');pg.wait_for_timeout(100);assert pg.evaluate('filmA.paused && analysisVideo.paused')", "pg.emulate_media(reduced_motion='reduce');pg.wait_for_function('filmA.paused && analysisVideo.paused',timeout=3000)")
          p.write_text(s)
          p=Path('docs/roadmap/FORM-ROADMAP.md');data=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='7157500ccd35a095544e74cb81b19cfc0f1963b6', 'Roadmap changed; review before retrying'
          row='| Homepage coaching selector | IMPLEMENTED; release receipt in audit | September 16: cream select-only popup, single-edge focus, service/fee hierarchy, keyboard and touch behavior, existing-link and inquiry synchronization. No offer or delivery changes. [Selector audit](../audits/COACHING-SELECTOR-20260916.md) owns the checklist and deployment receipt. |\n'
          p.write_text(data.decode().replace('| Homepage single-runner coaching path |',row+'| Homepage single-runner coaching path |',1))
          PY
      - name: Static regression checks
        run: |
          node --check js/coaching-choice.js
          node tests/homepage-release.cjs
          node tests/homepage-metadata.cjs
          node tests/coaching-measurement.cjs
      - name: Install test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser checks with intercepted submissions
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/coaching-choice-browser.py
          python tests/homepage-browser.py
      - name: Commit only verified integration paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/homepage-browser.py docs/roadmap/FORM-ROADMAP.md
          git commit -m 'Integrate and verify the coaching selector [skip netlify]'
          git push origin HEAD:work/coaching-selector-20260916
      - uses: actions/upload-artifact@v4
        with:
          name: coaching-selector-qa
          path: .homepage-qa/
          retention-days: 3
