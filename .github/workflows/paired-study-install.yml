name: Assemble and verify connected study
on:
  push:
    branches: [work/paired-study-20261004]
    paths: ['.github/workflows/paired-study-install.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'Breechay/speedandform' && github.ref == 'refs/heads/work/paired-study-20261004'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally verified source changes
        shell: python
        run: |
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          encoded=''.join((root/f'.paired-source/part{i}').read_text() for i in range(1,6))
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='be5abf3cfdca758fddfb2fa72640581de2857b6e7188e2de9465e0c08d258aee'
          d=json.loads(lzma.decompress(raw))
          patch=pathlib.Path('/tmp/paired.patch');patch.write_text(d['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          allowed=('docs/studies/','scripts/studies/','supabase/migrations/','tests/paired-study-','data/studies/','labs/shared/')
          for name,content in d['files'].items():
            assert name.startswith(allowed) and '..' not in pathlib.PurePosixPath(name).parts
            p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
      - name: Capture matched public plans and build all connected views
        run: node scripts/studies/build-paired-study.cjs --refresh
      - name: Source and privacy contracts
        run: node tests/paired-study-contract.cjs
      - name: Build existing site pipeline
        run: |
          node tests/cream-reading.cjs
          node scripts/build-cream-reading.cjs
          node scripts/build-commercial.cjs
          node scripts/build-sf-brand.cjs
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser layouts, filters, units, privacy and offline tests
        env:
          FORM_BROWSER_NETWORK: '1'
          FORM_SCREENSHOTS: /tmp/paired-qa
        run: python tests/paired-study-browser.py
      - name: Create reproducible study share-card renderer
        shell: python
        run: |
          from pathlib import Path
          Path('scripts/studies/build-paired-og.py').write_text('''"""Render the study editorial share card with the same public typography."""
          import pathlib,mimetypes
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          root=pathlib.Path(__file__).resolve().parents[2]
          with sync_playwright() as p:
            b=p.chromium.launch()
            page=b.new_page(viewport={"width":1200,"height":630},device_scale_factor=1)
            def route(r):
              if not r.request.url.startswith("https://speedandform.com"): return r.continue_()
              f=root/urlsplit(r.request.url).path.lstrip("/")
              return r.fulfill(status=200,content_type=mimetypes.guess_type(str(f))[0] or "text/plain",body=f.read_bytes()) if f.is_file() else r.fulfill(status=404,body="")
            page.route("**/*",route)
            page.set_content("""<html><head><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f3eee2;color:#191914;padding:46px 66px;font-family:Archivo,Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;font:13px 'Space Mono',monospace;letter-spacing:2px}header img{width:58px;height:52px}h1{font-size:112px;line-height:.86;letter-spacing:-7px;font-weight:800;font-stretch:85%;margin:46px 0 26px}h1 span{display:block}p{font-size:24px;max-width:870px;line-height:1.35;margin:0}footer{margin-top:34px;padding-top:23px;border-top:1px solid #9e988b;display:flex;justify-content:space-between;font:14px 'Space Mono',monospace}b{color:#385366}em{color:#a33d2c;font-style:normal}</style></head><body><header><img src="https://speedandform.com/assets/brand/sf-seal.svg"><span>FORM LABS · A PAIRED COACHING STUDY</span></header><h1><span>Same pace.</span><span>Different problem.</span></h1><p>One runner races in November. The other has until May.<br>The target may look similar. The work should not.</p><footer><span><em>ELIJAH</em> · SAVANNAH · NOV 14</span><span><b>SIMON</b> · SAUMUR · MAY 16</span></footer></body></html>""",wait_until="networkidle")
            page.evaluate("document.fonts.ready")
            page.screenshot(path=str(root/'labs/same-pace-different-problem/og.png'))
            b.close()
          ''')
      - name: Render share card
        run: python scripts/studies/build-paired-og.py
      - name: Leave a clean read-only verification workflow
        shell: python
        run: |
          import pathlib,shutil
          pathlib.Path('.github/workflows/paired-study.yml').write_text('''name: Connected study contracts
          on:
            push:
              branches: [work/paired-study-20261004]
            pull_request:
              paths:
                - 'data/studies/**'
                - 'scripts/studies/*paired*'
                - 'labs/the-two-curves/**'
                - 'labs/same-pace-different-problem/**'
                - 'labs/shared/**'
                - 'tests/paired-study*'
                - '.github/workflows/paired-study.yml'
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '20'
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: node scripts/studies/build-paired-study.cjs --refresh
                - run: node tests/paired-study-contract.cjs
                - run: python -m pip install playwright && python -m playwright install --with-deps chromium
                - run: python tests/paired-study-browser.py
                  env:
                    FORM_BROWSER_NETWORK: '1'
                    FORM_SCREENSHOTS: /tmp/paired-qa
                - uses: actions/upload-artifact@v4
                  with:
                    name: connected-study-browser-evidence
                    path: /tmp/paired-qa
                    retention-days: 7
          ''')
          pathlib.Path('.github/workflows/paired-study-install.yml').unlink()
          pathlib.Path('.github/workflows/paired-public-snapshot.yml').unlink()
          shutil.rmtree('.paired-source')
      - name: Commit only the verified study scope to its branch
        run: |
          git config user.name 'FORM study publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/roadmap/FORM-ROADMAP.md docs/studies/SIMON-STUDY-003.md docs/studies/CONNECTED-STUDY-CONTRACT.md labs/index.html labs/the-two-curves/AGENTS.md labs/the-two-curves/index.html labs/the-two-curves/published-plan.json labs/the-two-curves/published-plan.js netlify.toml scripts/discovery-catalog.cjs search-index.json sitemap.xml scripts/studies/build-simon-r2.cjs scripts/studies/build-paired-study.cjs scripts/studies/build-paired-og.py scripts/studies/paired-study-delivery.sql supabase/migrations/20261004130000_connected_study_publication.sql tests/paired-study-contract.cjs tests/paired-study-browser.py data/studies labs/shared labs/same-pace-different-problem plans/elijah-savannah-half plans/elijah-nov-11/index.html .github/workflows/paired-study.yml
          git add -u .github/workflows .paired-source
          git diff --cached --stat | tee /tmp/paired-qa/source-scope.txt
          git commit -m 'Build interconnected Elijah and Simon living study with verified plan delivery'
          git push origin HEAD:work/paired-study-20261004
          git rev-parse HEAD | tee /tmp/paired-qa/verified-commit.txt
          cp labs/same-pace-different-problem/og.png /tmp/paired-qa/og.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-study-verification
          path: /tmp/paired-qa
          retention-days: 7
