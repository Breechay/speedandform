name: Miami functional v2 acceptance
on:
  push:
    branches: [work/miami-running-v2-20260923]
    paths: ['.github/workflows/miami-functional-v2.yml', 'scripts/apply-miami-functional-v2.cjs', 'tests/miami-community-schedule.cjs']
permissions:
  contents: write
concurrency:
  group: miami-functional-v2-20260923
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Apply the bounded functional repair
        run: node scripts/apply-miami-functional-v2.cjs
      - name: Validate the repaired page
        run: |
          node tests/miami-community-schedule.cjs
          node tests/cream-reading.cjs
          git diff --check
      - name: Compare the inherited sitewide failure against the unchanged baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 84eed9121fd135650ebc149aadedd421cda16a66
          git worktree add --detach /tmp/miami-baseline 84eed9121fd135650ebc149aadedd421cda16a66
          set +e
          (cd /tmp/miami-baseline && node tests/share-metadata.cjs) > /tmp/miami-base-share.log 2>&1
          base_status=$?
          node tests/share-metadata.cjs > /tmp/miami-candidate-share.log 2>&1
          candidate_status=$?
          set -e
          cat /tmp/miami-base-share.log
          cat /tmp/miami-candidate-share.log
          node - "$base_status" "$candidate_status" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const base=fs.readFileSync('/tmp/miami-base-share.log','utf8'),candidate=fs.readFileSync('/tmp/miami-candidate-share.log','utf8');
          const candidateStatus=Number(process.argv[3]);
          if(candidateStatus!==0){
            assert.equal(Number(process.argv[2]),1,'The sitewide failure must already exist before the repair');
            assert.equal(candidateStatus,1);
            for(const log of [base,candidate]){
              assert.ok(log.includes('library.html exact Pass 6A source'));
              assert.ok(log.includes("actual: '2fc838fa7f04ad28c3adcdf01c18d56fe083e25ab92c63796e85544d9dd3a0a0'"));
              assert.ok(log.includes("expected: '89cab4179eeed63872bedf8b6fca65d97df7ede1b1210d3ccbc861049ceffeca'"));
            }
            assert.ok(fs.readFileSync('library.html').equals(fs.readFileSync('/tmp/miami-baseline/library.html')),'The Library source is unchanged');
            const p='docs/audits/MIAMI-FUNCTIONAL-V2-RECEIPT-20260923.json',receipt=JSON.parse(fs.readFileSync(p,'utf8'));
            receipt.inheritedSitewideFailure={test:'tests/share-metadata.cjs',baselineRevision:'84eed9121fd135650ebc149aadedd421cda16a66',message:'library.html exact Pass 6A source',actualSha256:'2fc838fa7f04ad28c3adcdf01c18d56fe083e25ab92c63796e85544d9dd3a0a0',expectedSha256:'89cab4179eeed63872bedf8b6fca65d97df7ede1b1210d3ccbc861049ceffeca',baselineAndCandidateBothFail:true,libraryUnchanged:true};
            fs.writeFileSync(p,JSON.stringify(receipt,null,2)+'\n');
            fs.appendFileSync('docs/roadmap/FORM-ROADMAP.md','\nAcceptance note: the dedicated Miami regression and 71-page reading checks pass. The broad share suite fails on the same pre-existing Library snapshot mismatch on both base `84eed912` and the candidate. The Library file and original share test remain unchanged. This release does not claim the entire sitewide share suite passed.\n');
            console.log('CONFIRMED inherited Library snapshot failure; Miami-specific metadata, schedule and source checks passed.');
          }else console.log('Full share suite passed.');
          NODE
          git diff --check
          git diff --stat
      - name: Commit accepted source to the working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/miami-functional-v2.yml scripts/apply-miami-functional-v2.cjs
          git add miami-running-training.html scripts/guide-state.cjs scripts/miami-functional-v2-state.cjs tests/miami-community-schedule.cjs docs/audits/MIAMI-FUNCTIONAL-V2-RECEIPT-20260923.json docs/roadmap/FORM-ROADMAP.md
          git commit -m 'Miami: repair shared Thursday schedule and readable community information'
          git push origin HEAD:work/miami-running-v2-20260923
          git rev-parse HEAD
