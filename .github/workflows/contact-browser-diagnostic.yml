name: Contact live acceptance
on:
  push:
    branches: [work/contact-browser-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d855371acf765f27e673bf3edc760107caada4d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing browser runtime
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Test the actual public pages without permitting collectors
        env:
          CONTACT_NOTES_LIVE: '1'
          BROWSER: ${{ matrix.browser }}
          CONTACT_NOTES_ARTIFACTS: /tmp/contact-live-acceptance
        run: python tests/contact-notes-browser.py
      - name: Preserve the source and request decisions
        if: always()
        run: |
          mkdir -p /tmp/contact-live-acceptance
          git rev-parse HEAD > /tmp/contact-live-acceptance/tested-commit.txt
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/contact-live-acceptance/browser.json')
          if p.exists():
              d=json.loads(p.read_text());print(json.dumps({k:d.get(k) for k in ['engine','result','failure','errors','blockedRequests']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contact-live-acceptance-${{ matrix.browser }}
          path: /tmp/contact-live-acceptance/
          retention-days: 14
