name: Patch Speed That Endures

on:
  push:
    branches:
      - editorial-cohesion-pass
    paths:
      - scripts/patch-speed-that-endures.mjs
      - .github/workflows/patch-speed-that-endures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch the study source
        run: node scripts/patch-speed-that-endures.mjs

      - name: Commit the patched study
        shell: bash
        run: |
          if git diff --quiet -- labs/speed-that-endures/index.html; then
            echo "No study changes to commit."
            exit 0
          fi
          git config user.name "FORM editorial bot"
          git config user.email "actions@users.noreply.github.com"
          git add labs/speed-that-endures/index.html
          git commit -m "Labs: refine Speed That Endures editorial system"
          git push origin HEAD:editorial-cohesion-pass
