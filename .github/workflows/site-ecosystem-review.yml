name: Site ecosystem review
on:
  push:
    branches: [work/site-ecosystem-2026-09-16]
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package public source for local audit
        run: |
          mkdir -p /tmp/site-review
          tar --exclude=.git --exclude=node_modules --exclude=.github -czf /tmp/site-review/speedandform-source.tar.gz .
          git rev-parse HEAD > /tmp/site-review/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: site-review-source
          path: /tmp/site-review/
          retention-days: 2
