name: House integrity

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'data/public-share.json'
      - 'search-index.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'netlify.toml'
      - '_redirects'
      - '_headers'
      - 'scripts/check-house-integrity.cjs'
      - '.github/workflows/house-integrity.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'data/public-share.json'
      - 'search-index.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'netlify.toml'
      - '_redirects'
      - '_headers'
      - 'scripts/check-house-integrity.cjs'
      - '.github/workflows/house-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit public house
        env:
          HOUSE_INTEGRITY_REPORT: /tmp/house-integrity/report.json
        run: node scripts/check-house-integrity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: house-integrity
          path: /tmp/house-integrity/
          retention-days: 14
