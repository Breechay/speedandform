name: Track gallery release checks
on:
  push:
    branches: [work/track-gallery-pass3, main]
    paths: ['track/**','media/track/**','scripts/*track*','tests/track*','tests/discovery-browser.py','css/track-gallery.css','js/track-gallery.js','.github/workflows/track-gallery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install explicit review dependencies
        run: |
          python -m pip install Pillow==11.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Source and critical-flow regression checks
        run: |
          set -o pipefail
          mkdir -p /tmp/gallery-receipt
          test ! -e .github/gallery-refine.py
          {
            python tests/track-poster.py
            node tests/track-gallery.cjs
            node tests/discovery.cjs
            node tests/share-metadata.cjs
            node tests/homepage-metadata.cjs
            node tests/homepage-release.cjs
            node tests/coaching-measurement.cjs
            node tests/cream-reading.cjs
            node labs/track/track.test.cjs
            node tests/thursday-schedule.cjs
          } | tee /tmp/gallery-receipt/source-tests.txt
          node scripts/build-track-gallery.cjs
          node scripts/build-discovery.cjs
          git diff --exit-code
      - name: Gallery browser acceptance
        env:
          TRACK_GALLERY_ARTIFACTS: /tmp/gallery-receipt/gallery
        run: python tests/track-gallery-browser.py
      - name: Existing discovery and homepage acceptance
        env:
          DISCOVERY_ARTIFACTS: /tmp/gallery-receipt/discovery
        run: |
          python tests/discovery-browser.py
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/homepage-browser.py
          cp .homepage-qa/browser-qa.json /tmp/gallery-receipt/homepage-browser.json
      - name: Verify the actual published release
        if: github.ref_name == 'main'
        env:
          GALLERY_LIVE_ARTIFACTS: /tmp/gallery-receipt/live
        run: |
          node scripts/verify-track-production.cjs /tmp/gallery-receipt/production.json
          node scripts/verify-discovery-production.cjs /tmp/gallery-receipt/discovery-production.json
          node scripts/verify-share-production.cjs /tmp/gallery-receipt/share-production.json
          python tests/track-gallery-live.py
      - name: Save exact tested commit and manifest
        if: always()
        run: |
          mkdir -p /tmp/gallery-receipt
          git rev-parse HEAD > /tmp/gallery-receipt/commit.txt
          cp track/media-manifest.json /tmp/gallery-receipt/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-receipt
          path: /tmp/gallery-receipt/
          retention-days: 14
