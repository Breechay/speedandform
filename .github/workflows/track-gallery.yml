name: Track gallery release checks
on:
  push:
    branches: [work/track-gallery-pass3]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review runtime
        run: |
          python -m pip install Pillow==11.3.0 playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Correct history focus and capture decoded media
        run: |
          test "$GITHUB_REF_NAME" = work/track-gallery-pass3
          python - <<'PY'
          from pathlib import Path
          p=Path('js/track-gallery.js');s=p.read_text()
          if 'focusReturn' not in s:
            s=s.replace('let index=-1, invoking=null,', 'let focusReturn=null;\n  let index=-1, invoking=null,')
            s=s.replace('const restore=invoking;invoking=null;if(restore?.isConnected)restore.focus({preventScroll:true});', 'if(invoking)focusReturn=invoking;invoking=null;if(focusReturn?.isConnected)focusReturn.focus({preventScroll:true});')
            s=s.replace('event.preventDefault();invoking=link;', 'event.preventDefault();focusReturn=null;invoking=link;')
            s=s.replace("window.addEventListener('popstate',()=>{ownsHistory=Boolean(history.state?.trackGallery);sync();});", "window.addEventListener('popstate',()=>{ownsHistory=Boolean(history.state?.trackGallery);sync();if(!dialog.open)requestAnimationFrame(()=>{if(focusReturn?.isConnected)focusReturn.focus({preventScroll:true});focusReturn=null;});});")
            p.write_text(s)
          p=Path('tests/track-gallery-browser.py');s=p.read_text()
          if 'decode()' not in s:
            s=s.replace("page.screenshot(path=str(OUT/f'viewer-{width}.png'))", "page.locator('.viewer-stage img').evaluate('(i)=>i.decode()');page.evaluate('()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)))');page.screenshot(path=str(OUT/f'viewer-{width}.png'))")
            s=s.replace("check('Focus returns to initiating image',", "page.wait_for_function(\"document.activeElement.dataset.frame==='beside-the-track'\");check('Focus returns to initiating image',")
            p.write_text(s)
          PY
          git add -- js/track-gallery.js tests/track-gallery-browser.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: preserve initiating frame focus across closing history navigation'
            git push origin HEAD:work/track-gallery-pass3
          fi
      - name: Source and existing critical-flow checks
        run: |
          set -o pipefail
          mkdir -p /tmp/gallery-receipt
          {
            node tests/track-gallery.cjs
            node tests/discovery.cjs
            node tests/share-metadata.cjs
            node tests/homepage-metadata.cjs
            node tests/homepage-release.cjs
            node tests/coaching-measurement.cjs
            node tests/cream-reading.cjs
            node labs/track/track.test.cjs
            node tests/thursday-schedule.cjs
          } | tee /tmp/gallery-receipt/source-tests.txt
          node scripts/build-track-gallery.cjs
          node scripts/build-discovery.cjs
          git diff --exit-code
      - name: Gallery browser acceptance
        env:
          TRACK_GALLERY_ARTIFACTS: /tmp/gallery-receipt/gallery
        run: python tests/track-gallery-browser.py
      - name: Existing discovery and homepage acceptance
        env:
          DISCOVERY_ARTIFACTS: /tmp/gallery-receipt/discovery
        run: |
          python tests/discovery-browser.py
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python tests/homepage-browser.py
          cp .homepage-qa/browser-qa.json /tmp/gallery-receipt/homepage-browser.json
      - name: Save exact source and review evidence
        if: always()
        run: |
          mkdir -p /tmp/gallery-receipt
          git rev-parse HEAD > /tmp/gallery-receipt/commit.txt
          tar --exclude=.git --exclude=node_modules --exclude=.homepage-qa -czf /tmp/gallery-receipt/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-receipt
          path: /tmp/gallery-receipt/
          retention-days: 7
