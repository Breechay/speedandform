name: Verify Run Development method release state
on:
  push:
    branches: [work/run-development-method-20260917]
    paths: [.github/workflows/run-development-method-hash.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source, share and release contracts
        run: |
          node tests/share-metadata.cjs
          node tests/homepage-metadata.cjs
          node tests/homepage-release.cjs
          node tests/run-development-method.cjs
          node tests/coaching-measurement.cjs
          node tests/cream-reading.cjs
          node labs/track/track.test.cjs
          node tests/thursday-schedule.cjs
          git diff --exit-code
