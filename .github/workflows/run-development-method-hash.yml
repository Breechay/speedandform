name: Compute Run Development method receipt
on:
  push:
    branches: [work/run-development-method-20260917]
    paths: [.github/workflows/run-development-method-hash.yml]
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact release hashes
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          for(const file of ['index.html','the-method.html','running-terms.html','css/method.css']){
            const text=fs.readFileSync(file,'utf8');
            console.log('FILE='+file);
            console.log('SOURCE_SHA256='+sha(text));
            if(file.endsWith('.html')) console.log('BODY_SHA256='+sha(text.slice(text.toLowerCase().indexOf('</head>'))));
          }
          NODE
