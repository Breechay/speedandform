name: Speed That Endures final polish

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oneoff-speed-endures-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch study
        run: python scripts/polish_speed_endures_sep11.py
      - name: Verify
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          git diff --name-only | grep -qx 'labs/speed-that-endures/index.html'
      - name: Commit
        run: |
          git config user.name "Breechay"
          git config user.email "briceikouebe@gmail.com"
          git add labs/speed-that-endures/index.html
          git rm scripts/polish_speed_endures_sep11.py
          git rm .github/workflows/oneoff-speed-endures-polish.yml
          git commit -m "Labs: complete paired W3 living-study read"
          git push origin HEAD:main
