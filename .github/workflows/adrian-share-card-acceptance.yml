name: Adrian share-card acceptance
on:
  push:
    branches: [work/adrian-share-card-20260923]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acceptance tools
        run: |
          pip install playwright==1.58.0 pillow
          python -m playwright install --with-deps chromium

      - name: Render supplied Adrian share-card design
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          html = r'''<!doctype html>
          <html><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}
          html,body{margin:0;width:1200px;height:630px;overflow:hidden}
          body{background:#f4f1e9;color:#17231d;font-family:Arial,Helvetica,sans-serif}
          .page{position:relative;width:1200px;height:630px}
          .logo{position:absolute;left:72px;top:61px;font-size:31px;font-weight:800;letter-spacing:-1.4px;line-height:1}
          .logo i{font-style:normal;color:#315842}
          .eyebrow{position:absolute;left:72px;top:143px;font-size:16px;font-weight:700;letter-spacing:3px;color:#526057}
          h1{position:absolute;left:72px;top:177px;margin:0;font-size:101px;line-height:1.01;letter-spacing:-5px;font-weight:800}
          .sub{position:absolute;left:72px;top:404px;font-size:31px;line-height:1.2;color:#315842}
          .panel{position:absolute;left:800px;top:58px;width:340px;height:410px;border-radius:25px;background:#e5eadf}
          .line{position:absolute;left:135px;top:44px;width:3px;height:322px;background:#c9cec4}
          .row{position:absolute;left:0;width:100%;height:42px;font-size:22px;font-weight:700;line-height:42px}
          .row .time{position:absolute;right:230px;width:100px;text-align:right}
          .row .dot{position:absolute;left:124px;top:10px;width:22px;height:22px;border-radius:50%;background:#315842}
          .row .label{position:absolute;left:166px;white-space:nowrap}
          .r1{top:44px}.r2{top:114px}.r3{top:184px}.r4{top:254px;color:#315842}.r5{top:324px}
          .r4 .dot{left:117px;top:3px;width:38px;height:38px;background:transparent;border:3px solid #315842}
          .r4 .dot:after{content:"";position:absolute;left:7px;top:7px;width:18px;height:18px;border-radius:50%;background:#315842}
          .rule{position:absolute;left:72px;top:500px;width:1056px;height:2px;background:#c9cec4}
          .foot{position:absolute;left:72px;top:525px;font-size:21px;line-height:1.2}
          .site{position:absolute;left:72px;top:567px;font-size:16px;color:#526057}
          </style></head><body><div class="page">
          <div class="logo">FORM<i>.</i></div>
          <div class="eyebrow">ADRIAN · NUTRITION 01</div>
          <h1>Fuel Your<br>Work</h1>
          <div class="sub">Prepare the meals you tend to miss.</div>
          <div class="panel"><div class="line"></div>
            <div class="row r1"><span class="time">Before</span><span class="dot"></span><span class="label">Banana</span></div>
            <div class="row r2"><span class="time">8:00</span><span class="dot"></span><span class="label">Breakfast</span></div>
            <div class="row r3"><span class="time">12:30</span><span class="dot"></span><span class="label">Lunch</span></div>
            <div class="row r4"><span class="time">3:30</span><span class="dot"></span><span class="label">Pasta box</span></div>
            <div class="row r5"><span class="time">6:30</span><span class="dot"></span><span class="label">Dinner</span></div>
          </div>
          <div class="rule"></div>
          <div class="foot">Your day · Three recipes · Shopping list · Kit</div>
          <div class="site">speedandform.com</div>
          </div></body></html>'''
          p=Path('/tmp/adrian-card.html'); p.write_text(html)
          out=Path('og/adrian-nutrition-20260923.jpg'); out.parent.mkdir(exist_ok=True)
          with sync_playwright() as pw:
              b=pw.chromium.launch()
              page=b.new_page(viewport={'width':1200,'height':630},device_scale_factor=1)
              page.goto(p.as_uri(),wait_until='load')
              page.screenshot(path=str(out),type='jpeg',quality=90,full_page=False)
              b.close()
          PY

      - name: Run Adrian acceptance
        run: python tests/adrian-nutrition-v15.py

      - name: Verify share card and privacy metadata
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('og/adrian-nutrition-20260923.jpg')
          assert p.exists()
          im=Image.open(p)
          assert im.size==(1200,630)
          assert im.format=='JPEG'
          h=Path('plans/adrian-nutrition-phase-01/index.html').read_text()
          assert '<meta name="robots" content="noindex,follow">' in h
          assert 'https://speedandform.com/og/adrian-nutrition-20260923.jpg' in h
          assert 'summary_large_image' in h
          s=Path('labs/adrian-runner-mass/index.html').read_text()
          assert 'A 19-year-old distance runner.' in s
          assert 'A 2:53:39 marathoner.' not in s
          PY

      - name: Commit accepted card bytes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og/adrian-nutrition-20260923.jpg
          git diff --cached --quiet || git commit -m 'Adrian nutrition: render accepted share card'
          git push origin HEAD
