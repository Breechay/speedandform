name: Manual Source Bundle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-source-bundle.yml'
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create clean source archive
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: speedandform-source
          path: source.zip
          retention-days: 1
