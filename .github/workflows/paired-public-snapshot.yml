name: Paired public snapshot
on:
  push:
    branches: [work/paired-study-20261004]
    paths: ['.github/workflows/paired-public-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read approved public plan projection
        run: |
          curl --fail --silent --show-error --retry 2 'https://pbgsjjegycacodiltbhn.supabase.co/rest/v1/rpc/paired_study_plans' -H 'apikey: sb_publishable_5Dg5TUvnh2mEo-zCYAbgmw_WHNXKDqj' -H 'Content-Type: application/json' -d '{}' -o /tmp/paired-plans.json
          python3 -c "import json; d=json.load(open('/tmp/paired-plans.json')); assert all(v['state']=='published' for v in d['athletes'].values())"
      - uses: actions/upload-artifact@v4
        with:
          name: paired-public-plans
          path: /tmp/paired-plans.json
          retention-days: 1
