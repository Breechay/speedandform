<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>App pages · layout review</title>
<style>body{margin:0;background:#ddd;color:#111;font:16px system-ui}header{padding:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}label{display:flex;gap:8px;align-items:center}select,button{font:inherit;padding:8px}main{padding:12px}iframe{display:block;border:0;background:#090908;transform-origin:top left}#frame-wrap{width:100%}output{font:14px monospace}</style></head>
<body><header><label>Page<select id="page"><option value="/form/">Running</option><option value="/forge-sculpt/">Strength</option></select></label><label>Width<select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>650</option><option>720</option><option>768</option><option>820</option><option>1024</option><option>1440</option></select></label><label>Text zoom<select id="zoom"><option value="1">100%</option><option value="2">200%</option></select></label><button id="answers">Open answers</button><button id="top">Top</button><output id="result"></output></header>
<main><div id="frame-wrap"><iframe title="App page under review" id="preview" src="/form/"></iframe></div></main>
<script>
const frame=document.getElementById('preview'),page=document.getElementById('page'),width=document.getElementById('width'),zoom=document.getElementById('zoom'),result=document.getElementById('result');
function measure(){const d=frame.contentDocument;result.textContent=width.value+'px / '+zoom.options[zoom.selectedIndex].text+': '+(d.documentElement.scrollWidth<=Number(width.value)+1?'contained':'OVERFLOW '+d.documentElement.scrollWidth);}
function layout(){const w=Number(width.value),scale=Math.min(1,(innerWidth-24)/w);frame.style.width=w+'px';frame.style.height='960px';frame.style.transform='scale('+scale+')';document.getElementById('frame-wrap').style.height=(960*scale)+'px';if(frame.contentDocument.body)frame.contentDocument.body.style.zoom=zoom.value;requestAnimationFrame(measure);}
frame.addEventListener('load',layout);width.addEventListener('change',layout);zoom.addEventListener('change',layout);page.addEventListener('change',()=>frame.src=page.value);window.addEventListener('resize',layout);
document.getElementById('answers').addEventListener('click',()=>{frame.contentDocument.querySelectorAll('details').forEach(d=>d.open=true);measure();});
document.getElementById('top').addEventListener('click',()=>frame.contentWindow.scrollTo(0,0));
</script></body></html>
