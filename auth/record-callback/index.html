<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#e8e3d9">
  <meta name="referrer" content="no-referrer">
  <title>Secure sign-in | Speed &amp; Form</title>
  <link rel="stylesheet" href="/auth/record-callback/callback.css?v=1">
</head>
<body>
  <a class="skip-link" href="#callbackMain">Skip to sign-in status</a>
  <div class="auth-shell">
    <header class="auth-header">
      <a class="house-mark" href="/" aria-label="Speed and Form home">
        <img src="/assets/brand/kit/emblem/sf-emblem-ink.svg" alt="">
      </a>
      <span class="auth-label">Secure access</span>
    </header>
    <main class="auth-main" id="callbackMain">
      <section class="auth-card" aria-live="polite">
        <p class="eyebrow">Private workspace</p>
        <h1 id="callbackTitle">Opening your workspace.</h1>
        <p class="auth-status" id="callbackStatus">Finishing the secure handoff.</p>
        <a class="button" id="callbackRetry" href="/athlete/" hidden>Request a new link</a>
        <p id="callbackStoreWrap" class="store-link" hidden>
          <a id="callbackStore" href="https://apps.apple.com/us/app/form-practice/id6761313085">FORM on the App Store</a>
        </p>
      </section>
    </main>
    <footer class="auth-footer">
      <span>Speed &amp; Form</span>
      <span>Private sign-in</span>
    </footer>
  </div>
  <script type="module" src="/auth/record-callback/callback.js?v=37"></script>
</body>
</html>
